<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速开对决 · 45席回合制大乱斗</title>
<style>
/* 速开对决 — 界面样式 */
:root {
  --bg: #070b15;
  --bg2: #0b1224;
  --panel: rgba(17, 25, 43, .78);
  --panel-solid: #111a2c;
  --line: rgba(160, 190, 235, .12);
  --text: #e9eefb;
  --muted: #8e9cb8;
  --gold: #e8c46a;
  --gold-deep: #b98c34;
  --blue: #5aa9ff;
  --red: #ff6b6b;
  --green: #5be37d;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1200px 700px at 18% -10%, rgba(58, 96, 170, .22), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(150, 108, 40, .12), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, rgba(40, 80, 130, .16), transparent 60%),
    var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.hidden { display: none !important; }

/* ------------------------------- 顶栏 ------------------------------- */
.app { display: flex; flex-direction: column; height: 100%; }
#topbar {
  height: 60px;
  flex: 0 0 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(12, 18, 32, .92), rgba(10, 15, 27, .72));
  backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.logo {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center;
  font-weight: 800; font-size: 19px; color: #171104;
  background: linear-gradient(140deg, #f3d98f, #c29233);
  box-shadow: 0 4px 14px rgba(232, 196, 106, .25), inset 0 1px 0 rgba(255, 255, 255, .5);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-text b { font-size: 16px; letter-spacing: .14em; }
.brand-text small { font-size: 8px; letter-spacing: .32em; color: var(--muted); margin-top: 4px; }
.round-badge {
  margin: 0 auto;
  padding: 7px 18px;
  border: 1px solid rgba(232, 196, 106, .28);
  border-radius: 99px;
  background: rgba(232, 196, 106, .07);
  color: var(--gold);
  font-size: 13px;
  letter-spacing: .18em;
  white-space: nowrap;
}
.top-actions { display: flex; gap: 8px; min-width: 150px; justify-content: flex-end; }

/* ------------------------------- 布局 ------------------------------- */
#main { flex: 1; display: flex; min-height: 0; }
#stage {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 18px 10px;
  position: relative;
}
#boardWrap { flex: 0 1 auto; display: flex; justify-content: center; margin: 0 auto; width: 100%; }
#board {
  position: relative;
  width: 100%;
  max-width: 1100px;
  width: min(100%, max(320px, calc((100vh - 170px) * 11 / 7)));
  aspect-ratio: 11 / 7;
  border-radius: 16px;
  border: 1px solid rgba(232, 196, 106, .18);
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(60, 100, 170, .16), transparent 55%),
    linear-gradient(180deg, #0c1426, #080e1c);
  box-shadow: inset 0 0 80px rgba(0, 0, 0, .65), 0 24px 70px rgba(0, 0, 0, .5);
  overflow: hidden;
  user-select: none;
}

/* 棋盘格 */
#cells { position: absolute; inset: 0; z-index: 1; }
.cell {
  position: absolute;
  width: calc(100% / 11);
  height: calc(100% / 7);
  border-right: 1px solid rgba(130, 165, 220, .12);
  border-bottom: 1px solid rgba(130, 165, 220, .12);
  transition: background .18s;
}
.cell::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 55%, rgba(90, 169, 255, .10), transparent 55%);
  opacity: 0;
  transition: opacity .18s;
}
.cell.can-move { cursor: pointer; }
.cell.can-move::before { opacity: .55; }
.cell.can-move:hover { background: rgba(90, 169, 255, .12); }
.cell.can-move:hover::before { opacity: 1; }
.cell.can-target { cursor: crosshair; }
.cell.can-target::after {
  content: "";
  position: absolute; inset: 16%;
  border: 2px solid rgba(232, 196, 106, .75);
  border-radius: 10px;
  animation: targetPulse 1.25s ease-in-out infinite;
}
.cell.can-cell-target::after {
  inset: 10%;
  border-color: rgba(240, 166, 181, .95);
  background: rgba(240, 166, 181, .08);
  box-shadow: 0 0 18px rgba(240, 166, 181, .35);
}
.cell.attack-range {
  background: rgba(232, 196, 106, .06);
  box-shadow: inset 0 0 0 1px rgba(232, 196, 106, .24);
}
.cell.attack-range::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255, 132, 82, .30), rgba(232, 196, 106, .08) 55%, transparent 78%);
  animation: attackRangePulse 1.15s ease-in-out infinite;
}
.cell.shop {
  background:
    repeating-linear-gradient(135deg, rgba(232, 196, 106, .10) 0 8px, rgba(232, 196, 106, .03) 8px 16px),
    rgba(232, 196, 106, .04);
  border-color: rgba(232, 196, 106, .18);
}
.cell.shop::before {
  content: "商店";
  writing-mode: vertical-rl;
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 11px; letter-spacing: .35em;
  color: rgba(232, 196, 106, .55);
  opacity: 1;
  background: none;
}
.cell.shop.can-shop { cursor: pointer; }
.cell.shop.can-shop { box-shadow: inset 0 0 22px rgba(232, 196, 106, .25); }
.cell.dungeon {
  background:
    radial-gradient(circle at 50% 50%, rgba(170, 100, 255, .22), transparent 70%),
    repeating-linear-gradient(45deg, rgba(150, 90, 230, .10) 0 10px, rgba(80, 40, 130, .06) 10px 20px);
  border-color: rgba(170, 120, 255, .35);
  box-shadow: inset 0 0 20px rgba(120, 60, 220, .25);
}
.cell.dungeon::before {
  content: "地牢";
  writing-mode: vertical-rl;
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 10px; letter-spacing: .3em;
  color: rgba(210, 170, 255, .65);
  opacity: 1;
  background: none;
}
.cell.dungeon.can-move { background: rgba(170, 100, 255, .28); }

/* 单位 */
#tokens { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.token {
  position: absolute;
  width: 7.6%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  transition: left .34s cubic-bezier(.22, .7, .3, 1), top .34s cubic-bezier(.22, .7, .3, 1), opacity .25s;
  cursor: pointer;
  pointer-events: auto;
  --team: #5aa9ff;
}
.token.team-right { --team: #ff6b6b; }
.token .disc {
  position: absolute; inset: 0;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 800;
  font-size: clamp(13px, 1.65vw, 22px);
  color: #f2f6ff;
  background:
    radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .22), transparent 42%),
    radial-gradient(circle at 50% 60%, #1c2a47, #0e1628 72%);
  border: 2px solid var(--team);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .4), 0 0 16px color-mix(in srgb, var(--team) 35%, transparent);
  text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
  transition: transform .18s, box-shadow .2s, filter .2s;
}
.token .token-name {
  position: absolute;
  top: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 8.5px;
  line-height: 1.15;
  color: #d5e1f5;
  background: rgba(6, 10, 18, .62);
  border-radius: 4px;
  padding: 1px 4px;
  text-shadow: 0 1px 3px #000;
  white-space: nowrap;
  max-width: 150%;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  opacity: .95;
}
.token .hpbar {
  position: absolute;
  left: 19%; right: 19%;
  bottom: 3px;
  height: 3px;
  border-radius: 2px;
  background: rgba(0, 0, 0, .66);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .45);
  overflow: hidden;
}
.token .hpbar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #42d977, #a8ef6b);
  transition: width .3s;
}
.token .hpbar.low i { background: linear-gradient(90deg, #ffb04a, #ffd76b); }
.token .hpbar.crit i { background: linear-gradient(90deg, #ff5252, #ff8a5c); }
.token .badges {
  position: absolute;
  top: -7px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 2px;
  pointer-events: none;
}
.token .badge {
  min-width: 13px; height: 13px; padding: 0 3px;
  border-radius: 5px;
  font-size: 8px; font-weight: 700;
  display: grid; place-items: center;
  background: rgba(8, 12, 22, .92);
  border: 1px solid rgba(255, 255, 255, .16);
  color: #dce7fb;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
}
.token .badge.frozen { color: #8fe6ff; border-color: rgba(107, 213, 255, .55); }
.token .badge.down { color: #ffb0b0; border-color: rgba(255, 107, 107, .55); }
.token .badge.shield { color: #ffe9a8; border-color: rgba(232, 196, 106, .55); }
.token .badge.stealth { color: #b8a6ff; border-color: rgba(160, 140, 255, .45); }
.token .badge.charge { color: #ffd27a; border-color: rgba(255, 200, 110, .5); }

.token.team-left .badge { border-color: rgba(90, 169, 255, .3); }
.token.team-right .badge { border-color: rgba(255, 107, 107, .3); }

.token.downed { opacity: .78; }
.token.downed .disc {
  filter: grayscale(.85) brightness(.75);
  transform: scale(.92);
}
.token.downed .token-name { color: #ff9c9c; }
.token.frozen .disc { box-shadow: 0 0 0 2px rgba(107, 213, 255, .5), 0 0 22px rgba(107, 213, 255, .45); }
.token.stealthed { opacity: .34; }
.token.stealthed .disc { border-style: dashed; }
.token.in-dungeon .disc { box-shadow: 0 0 0 2px #b06cff, 0 0 22px rgba(170, 100, 255, .6); }
.token.jeep .disc { border-color: #d7e0eb; box-shadow: inset 0 0 0 2px #aeb9c8, 0 0 18px rgba(200, 220, 255, .45); }
.token.jeep .glyph { filter: grayscale(1) brightness(1.7) contrast(1.12); font-size: 135%; }
.token.carried { transform: translate(-50%, -50%) translate(28%, -28%) scale(.8); }
.token.carried .token-name { opacity: .8; }

/* C闪：王之号炮的环绕金色光弹 */
.token.king-armed .disc {
  border-color: #ffd45e;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 210, 80, .55), 0 0 24px rgba(255, 190, 40, .55);
}
.king-ammo { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.king-ammo::before {
  content: '';
  position: absolute; left: 50%; top: 50%;
  width: 88%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255, 214, 92, .55);
  border-radius: 50%;
  box-shadow: 0 0 14px rgba(255, 196, 40, .5), inset 0 0 12px rgba(255, 214, 92, .18);
  animation: kingRing 9s linear infinite;
}
.king-ammo i {
  position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px; margin: -4px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fffbe0 0 18%, #ffd95c 42%, #d49400 75%);
  box-shadow: 0 0 7px #ffd95c, 0 0 14px rgba(255, 174, 0, .85);
  transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--ammo-r, 34px)));
  animation: kingOrb 1.7s ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes kingOrb {
  0%, 100% { opacity: .75; filter: brightness(.9); }
  50% { opacity: 1; filter: brightness(1.45); }
}
@keyframes kingRing {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
@media (max-width: 760px) {
  .king-ammo i { --ammo-r: 24px; width: 6px; height: 6px; margin: -3px; }
}
.token.dodging .disc { animation: dodgeToken .55s ease-out; }
.token.granted .disc {
  animation: grantedGlow 1.65s cubic-bezier(.2, .8, .25, 1) both;
}
.token.granted::after {
  content: "行 动";
  position: absolute;
  left: 50%;
  top: -6px;
  transform: translate(-50%, -100%);
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .14em;
  color: #211605;
  background: linear-gradient(135deg, #fff3b0, #ffc94a);
  box-shadow: 0 0 10px #ffcc55, 0 0 24px rgba(255, 190, 40, .7);
  animation: grantedTag 1.65s ease-out forwards;
  pointer-events: none;
  z-index: 8;
}
.granted-burst {
  position: absolute;
  width: clamp(56px, 6.5vw, 92px);
  height: clamp(56px, 6.5vw, 92px);
  transform: translate(-50%, -50%);
  border: 2px solid #ffe28a;
  border-radius: 50%;
  box-shadow: 0 0 24px #ffc84a, inset 0 0 18px rgba(255, 220, 120, .65);
  animation: grantedBurst .9s ease-out forwards;
}

.token.current .disc {
  transform: scale(1.08);
  box-shadow: 0 0 0 2px var(--gold), 0 0 24px rgba(232, 196, 106, .55);
  animation: currentPulse 1.8s ease-in-out infinite;
}
.token.targetable .disc { cursor: crosshair; box-shadow: 0 0 0 2px rgba(232, 196, 106, .85), 0 0 20px rgba(232, 196, 106, .45); }
.token.targetable:hover .disc { transform: scale(1.1); }
.token.selected .disc { box-shadow: 0 0 0 2px #fff, 0 0 18px rgba(255, 255, 255, .5); }
.token.hit .disc { animation: hitShake .28s; }
.token.dead { opacity: 0; transform: translate(-50%, -50%) scale(.5); }

/* 浮动数字 */
#fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#skillFx { position: absolute; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
.float-text {
  position: absolute;
  transform: translate(-50%, -50%);
  font-weight: 800;
  font-size: clamp(12px, 1.4vw, 18px);
  color: #ffd3c9;
  text-shadow: 0 2px 6px #000, 0 0 12px rgba(0, 0, 0, .8);
  animation: floatUp 1.05s ease-out forwards;
  white-space: nowrap;
}
.float-text.heal { color: #8df5a8; }
.float-text.true { color: #ff9df0; }
.float-text.direct { color: #c8a6ff; }
.float-text.element { color: #9fe8ff; }
.float-text.miss { color: #9aa8c2; font-size: 12px; }
.float-text.buff { color: #ffe29a; }
.float-text.debuff, .float-text.freeze { color: #8fe6ff; }
.float-text.root { color: #c4a7ff; }
.float-text.airborne { color: #7dd3fc; }
.float-text.down, .float-text.death { color: #ff8080; }
.float-text.inv, .float-text.block { color: #ffe9a8; }
.float-text.knife { color: #fff2c4; }
.float-text.dmg, .float-text.direct, .float-text.true, .float-text.element {
  z-index: 7;
  font-size: clamp(20px, 2.4vw, 34px);
  font-weight: 900;
  letter-spacing: -.02em;
  text-shadow:
    0 2px 0 #4a0909,
    0 0 10px rgba(255, 110, 60, .9),
    0 0 24px rgba(255, 50, 20, .55),
    0 3px 10px #000;
  animation: damageFloat .92s cubic-bezier(.18, .9, .3, 1) forwards;
}
.float-text.direct { color: #e1c4ff; text-shadow: 0 2px 0 #2a0b4a, 0 0 12px #b96bff, 0 0 26px rgba(150, 60, 255, .6), 0 3px 10px #000; }
.float-text.true { color: #ffb4ee; text-shadow: 0 2px 0 #4a0b37, 0 0 12px #ff5bd8, 0 0 28px rgba(255, 40, 190, .6), 0 3px 10px #000; }

/* 命中冲击 */
.impact-burst {
  position: absolute;
  width: 8px; height: 8px;
  transform: translate(-50%, -50%);
  z-index: 8;
  pointer-events: none;
}
.impact-burst::before {
  content: '';
  position: absolute; left: 50%; top: 50%;
  width: 18px; height: 18px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid rgba(255, 240, 200, .95);
  box-shadow: 0 0 12px #ffcf6e, inset 0 0 8px #fff3c4;
  animation: impactRing .34s ease-out forwards;
}
.impact-burst::after {
  content: '';
  position: absolute; left: 50%; top: 50%;
  width: 10px; height: 10px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #fff6d8;
  box-shadow: 0 0 16px 6px rgba(255, 180, 60, .95);
  animation: impactCore .28s ease-out forwards;
}
.impact-burst i {
  position: absolute; left: 50%; top: 50%;
  width: 3px; height: 10px;
  margin: -5px -1.5px;
  border-radius: 2px;
  background: linear-gradient(#fff7cf, #ffae28 55%, transparent);
  transform-origin: 50% 50%;
  animation: impactSpark .42s ease-out forwards;
}
.impact-burst i:nth-child(1) { --a: 0deg; }
.impact-burst i:nth-child(2) { --a: 45deg; }
.impact-burst i:nth-child(3) { --a: 90deg; }
.impact-burst i:nth-child(4) { --a: 135deg; }
.impact-burst i:nth-child(5) { --a: 180deg; }
.impact-burst i:nth-child(6) { --a: 225deg; }
.impact-burst i:nth-child(7) { --a: 270deg; }
.impact-burst i:nth-child(8) { --a: 315deg; }
.impact-burst.direct::before { border-color: #d8b4ff; box-shadow: 0 0 14px #a855ff, inset 0 0 8px #e9d5ff; }
.impact-burst.direct::after { background: #f3e8ff; box-shadow: 0 0 18px 7px rgba(168, 85, 247, .9); }
.impact-burst.direct i { background: linear-gradient(#f3e8ff, #b06bff 55%, transparent); }
.impact-burst.true::before { border-color: #ffb4ee; box-shadow: 0 0 14px #ff2bd0, inset 0 0 8px #ffe0fa; }
.impact-burst.true::after { background: #ffe0fa; box-shadow: 0 0 18px 7px rgba(255, 43, 208, .9); }
.impact-burst.true i { background: linear-gradient(#ffe0fa, #ff45d4 55%, transparent); }
.impact-burst.heavy::before { animation-duration: .46s; }
.impact-burst.heavy::after { animation-duration: .38s; }
.impact-burst.heavy i { animation-duration: .55s; height: 15px; }

.impact-flash {
  position: absolute; inset: 0;
  z-index: 7;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(255, 230, 180, .22), rgba(255, 120, 40, .08) 38%, transparent 70%);
  animation: impactFlash .24s ease-out forwards;
}
.impact-flash.direct { background: radial-gradient(circle at 50% 50%, rgba(220, 180, 255, .22), rgba(140, 60, 255, .08) 38%, transparent 70%); }
.impact-flash.true { background: radial-gradient(circle at 50% 50%, rgba(255, 180, 240, .24), rgba(255, 40, 190, .09) 38%, transparent 70%); }

#board.impact-shake-1 { animation: impactShake1 .2s linear; }
#board.impact-shake-2 { animation: impactShake2 .27s linear; }
#board.impact-shake-3 { animation: impactShake3 .36s linear; }

/* 负面状态特效 */
.status-burst {
  position: absolute;
  width: 10px; height: 10px;
  transform: translate(-50%, -50%);
  z-index: 9;
  pointer-events: none;
  color: #ffcf6e;
}
.status-burst::before {
  content: '';
  position: absolute; left: 50%; top: 50%;
  width: 26px; height: 26px;
  transform: translate(-50%, -50%);
  border: 2px solid currentColor;
  border-radius: 50%;
  box-shadow: 0 0 16px currentColor, inset 0 0 12px rgba(255, 255, 255, .18);
  animation: statusRing .62s ease-out forwards;
}
.status-burst::after {
  content: attr(data-glyph);
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-weight: 900;
  font-size: 20px;
  color: #fff;
  text-shadow: 0 0 8px currentColor, 0 0 20px currentColor, 0 2px 4px #000;
  animation: statusGlyph .7s ease-out forwards;
}
.status-burst i {
  position: absolute; left: 50%; top: 50%;
  width: 3px; height: 13px;
  margin: -6px -1.5px;
  border-radius: 2px;
  background: linear-gradient(currentColor, transparent);
  animation: statusShard .62s ease-out forwards;
}
.status-burst i:nth-child(1) { --a: 0deg; }
.status-burst i:nth-child(2) { --a: 60deg; }
.status-burst i:nth-child(3) { --a: 120deg; }
.status-burst i:nth-child(4) { --a: 180deg; }
.status-burst i:nth-child(5) { --a: 240deg; }
.status-burst i:nth-child(6) { --a: 300deg; }
.status-burst.freeze { color: #8fe6ff; }
.status-burst.root { color: #b58cff; }
.status-burst.airborne { color: #7dd3fc; }
.status-burst.down { color: #ff8a6b; }
.status-burst.death { color: #ff3b4b; }
.status-burst.debuff { color: #ff9df0; }

.token.rooted .disc { border-color: #b58cff; box-shadow: 0 0 0 2px rgba(181, 140, 255, .55), 0 0 18px rgba(150, 90, 255, .4); }
.token.rooted .disc::after {
  content: ''; position: absolute; inset: -8px;
  border: 1px dashed rgba(181, 140, 255, .7);
  border-radius: 50%;
  animation: rootSpin 6s linear infinite;
  pointer-events: none;
}
.token.airborne .disc { border-color: #7dd3fc; animation: airborneFloat 1.7s ease-in-out infinite; }
.token.stunned .disc { border-color: #ffd166; box-shadow: 0 0 0 2px rgba(255, 209, 102, .55), 0 0 20px rgba(255, 174, 0, .42); }
.token.marked .disc { border-color: #ff6b6b; filter: drop-shadow(0 0 7px rgba(255, 60, 60, .65)); }
.token.status-flash-freeze .disc { animation: statusShake .48s, freezeGlow .48s; }
.token.status-flash-root .disc { animation: statusShake .48s; box-shadow: 0 0 0 3px rgba(181, 140, 255, .65), 0 0 24px rgba(150, 90, 255, .55) !important; }
.token.status-flash-airborne .disc { animation: statusAir .55s; }
.token.status-flash-down .disc { animation: statusDown .55s; }
.token.status-flash-death .disc { animation: statusDeath .6s; }

@keyframes statusRing {
  0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
}
@keyframes statusGlyph {
  0% { transform: translate(-50%, -50%) scale(.45); opacity: 0; }
  22% { transform: translate(-50%, -70%) scale(1.25); opacity: 1; }
  100% { transform: translate(-50%, -180%) scale(.9); opacity: 0; }
}
@keyframes statusShard {
  0% { transform: rotate(var(--a)) translateY(-5px) scaleY(.3); opacity: 1; }
  100% { transform: rotate(var(--a)) translateY(-46px) scaleY(1.3); opacity: 0; }
}
@keyframes statusShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-4px, 1px); }
  55% { transform: translate(4px, -1px); }
  78% { transform: translate(-2px, 0); }
}
@keyframes statusAir {
  0%, 100% { transform: translateY(0); }
  45% { transform: translateY(-10px) scale(1.04); }
}
@keyframes statusDown {
  0%, 100% { transform: translateY(0) rotate(0); }
  45% { transform: translateY(5px) rotate(4deg); }
}
@keyframes statusDeath {
  0% { transform: scale(1); filter: brightness(1); }
  30% { transform: scale(1.15); filter: brightness(2); }
  100% { transform: scale(.4); opacity: 0; filter: brightness(.4); }
}
@keyframes freezeGlow {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.8) saturate(1.6); }
  100% { filter: brightness(1); }
}
@keyframes rootSpin {
  to { transform: rotate(360deg); }
}
@keyframes airborneFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}


.float-text.dodge {

  color: #9dffd0;
  font-size: clamp(24px, 3.4vw, 46px);

    0 0 8px #55ffb0,
    0 0 22px rgba(70, 255, 175, .9),
    0 0 44px rgba(40, 220, 150, .65),
    0 2px 8px #000;
  animation: dodgeFloat 1.25s cubic-bezier(.2, .9, .25, 1) forwards;
}
.dodge-burst {
  position: absolute;
  width: clamp(58px, 7vw, 96px);
  height: clamp(58px, 7vw, 96px);
  transform: translate(-50%, -50%);
  border: 2px solid #8bffca;
  border-radius: 50%;
  box-shadow: 0 0 26px #43ffae, inset 0 0 18px rgba(120, 255, 200, .55);
  animation: dodgeBurst .72s ease-out forwards;
}
.dodge-burst::after {
  content: "";
  position: absolute;
  inset: -9px;
  border: 1px solid rgba(190, 255, 225, .85);
  border-radius: 50%;
  animation: dodgeRing .85s .08s ease-out forwards;

}
.uc-head { display: flex; align-items: center; gap: 8px; position: relative; z-index: 1; }
.uc-glyph {

  color: #fff;
  background: radial-gradient(circle at 32% 26%, #26395f, #0e1729);

}
.uc-name { font-size: 12.5px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 124px; }
.uc-role { font-size: 9px; color: var(--muted); margin-top: 2px; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 124px; }
.uc-stats { display: flex; gap: 5px; flex-wrap: wrap; margin: 7px 0 5px; position: relative; z-index: 1; }
.uc-stats span {
  font-size: 9px; padding: 2px 5px; border-radius: 4px;

}

.uc-skills b { color: #d7c48a; font-weight: 600; }
.uc-info {
  position: absolute; top: 6px; right: 7px;
  width: 17px; height: 17px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .2);
  background: rgba(0, 0, 0, .35);
  color: #c9d6ee; font-size: 10px;

  z-index: 2;
}
.unit-card.selected .uc-info { right: 30px; }

.start-actions {
  display: flex; justify-content: center; gap: 12px;
  margin-top: 10px;
  flex: 0 0 auto;
  padding: 4px 0 2px;
}
.start-actions .btn { min-width: 150px; padding: 11px 22px; font-size: 13px; }
.tiny { text-align: center; color: #6e7d99; font-size: 10px; margin-top: 6px; flex: 0 0 auto; }

/* 移动模式 */
.btn.move-btn { border-color: rgba(90, 169, 255, .38); background: rgba(90, 169, 255, .09); }
.btn.move-btn:hover:not(:disabled) { background: rgba(90, 169, 255, .16); }
.btn.auto-battle { border-color: rgba(232, 196, 106, .38); color: #f0d894; }
.move-tip {
  padding: 10px 11px;
  border-radius: 10px;
  border: 1px dashed rgba(90, 169, 255, .45);
  background: rgba(90, 169, 255, .08);
  color: #bcd7ff;
  font-size: 11px;
  line-height: 1.6;
  margin-bottom: 7px;
}
.move-tip b { color: #fff; }

/* 战报 */
#reportModal { z-index: 72; }
.report-panel { width: min(1040px, 96vw); max-height: 92vh; }
.report-tools { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.report-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.report-kpi {
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 10px;
  padding: 9px 10px;
  background: rgba(255, 255, 255, .03);
}
.report-kpi span { display: block; font-size: 9px; letter-spacing: .12em; color: var(--muted); }
.report-kpi b { display: block; margin-top: 3px; font-size: 18px; color: #fff; font-weight: 900; }
.report-kpi.win b { color: var(--gold); }
.report-kpi.lose b { color: #ff9c9c; }
.report-teams { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }
.report-team {
  flex: 1 1 240px;
  border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 10px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, .025);
}
.report-team h4 { margin: 0 0 5px; font-size: 11px; letter-spacing: .08em; }
.report-team.left h4 { color: var(--blue); }
.report-team.right h4 { color: var(--red); }
.report-team p { margin: 0; font-size: 11px; line-height: 1.7; color: #b9c7e2; }
.report-section { margin-top: 16px; }
.report-section h3 { color: var(--gold); font-size: 13px; margin: 0 0 7px; letter-spacing: .08em; }
.report-copy {
  border: 1px solid rgba(180, 140, 255, .22);
  border-radius: 9px;
  background: rgba(120, 82, 200, .07);
  padding: 9px 11px;
  margin-bottom: 8px;
}
.report-copy-name { color: #d9c6ff; font-weight: 800; font-size: 12px; margin-bottom: 5px; }
.report-copy-line { display: flex; gap: 8px; font-size: 11px; line-height: 1.65; color: #c7d4e9; }
.report-copy-line b { flex: 0 0 150px; color: #decdfa; font-weight: 700; }
.report-copy-line span { flex: 1; color: #b8c7de; }
.report-table-wrap { overflow: auto; border: 1px solid rgba(255, 255, 255, .07); border-radius: 9px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 620px; }
.report-table th {
  text-align: left; padding: 7px 9px; color: var(--muted);
  font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, .1);
  background: rgba(0, 0, 0, .2); white-space: nowrap;
}
.report-table td { padding: 6px 9px; border-bottom: 1px solid rgba(255, 255, 255, .04); color: #c3d0e8; white-space: nowrap; }
.report-table tr:last-child td { border-bottom: 0; }
.report-table tr.mvp { background: rgba(232, 196, 106, .08); }
.report-table tr.mvp td { color: #fff; }
.report-table .pt { color: #8fa4c8; }
.report-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.report-mvp {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px; border-radius: 11px;
  border: 1px solid rgba(232, 196, 106, .35);
  background: linear-gradient(135deg, rgba(232, 196, 106, .13), rgba(232, 196, 106, .03));
}
.report-mvp .mvp-name { font-size: 18px; font-weight: 900; color: var(--gold); }
.report-mvp .mvp-meta { font-size: 11px; color: #c3d0e8; }
.report-events { margin: 0; padding-left: 18px; font-size: 11px; line-height: 1.75; color: #c3d0e8; }
.report-events li { margin: 2px 0; }
.report-events .rd { color: #6e7d99; font-size: 9px; margin-right: 5px; }
.report-details { margin-top: 16px; border-top: 1px dashed rgba(255, 255, 255, .12); padding-top: 10px; }
.report-details summary { cursor: pointer; color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
.report-log {
  margin-top: 8px;
  max-height: 300px;
  overflow: auto;
  padding: 9px 11px;
  border-radius: 9px;
  background: rgba(0, 0, 0, .24);
  border: 1px solid rgba(255, 255, 255, .06);
  font-size: 10.5px;
  line-height: 1.65;
  color: #b9c7e2;
}
.report-log .rline { border-bottom: 1px solid rgba(255, 255, 255, .025); padding: 1px 0; }
.report-log .rline .rd { color: #5f6d88; margin-right: 5px; font-size: 9px; }
.report-log .rline.kill { color: #ffd08a; }
.report-log .rline.death { color: #ff9c9c; }
.report-log .rline.turn { color: var(--gold); margin-top: 5px; }
.report-log .rline.draw { color: #d7c48a; }
.report-log .rline.skill { color: #cbb7ff; }
.report-empty { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
.report-hint { color: var(--muted); font-size: 10px; margin-top: 12px; }

/* 结算 */
.over-panel {
  width: min(520px, 92vw);
  padding: 30px 30px 26px;
  border-radius: 18px;
  border: 1px solid rgba(232, 196, 106, .3);
  background: linear-gradient(180deg, rgba(22, 31, 52, .96), rgba(10, 16, 29, .98));
  box-shadow: 0 30px 90px rgba(0, 0, 0, .6);
  text-align: center;
}
.over-kicker { font-size: 9px; letter-spacing: .4em; color: var(--muted); margin-bottom: 8px; }
.over-panel h2 { margin: 0 0 8px; font-size: 34px; letter-spacing: .14em; color: var(--gold); }
.over-panel p { color: #a9b6cf; font-size: 12px; margin: 0 0 16px; }
.over-stats { display: flex; justify-content: center; gap: 18px; margin-bottom: 20px; }
.over-stats div { font-size: 11px; color: var(--muted); }
.over-stats b { display: block; font-size: 20px; color: #fff; font-weight: 800; }
.over-actions { display: flex; gap: 10px; justify-content: center; }

/* 弹窗 */
.modal-panel {
  width: min(900px, 94vw);
  max-height: 88vh;
  display: flex; flex-direction: column;
  border-radius: 18px;
  border: 1px solid rgba(160, 190, 235, .16);
  background: linear-gradient(180deg, rgba(20, 29, 49, .98), rgba(10, 16, 29, .99));
  box-shadow: 0 30px 90px rgba(0, 0, 0, .65);
  overflow: hidden;
}
.modal-panel.narrow { width: min(560px, 94vw); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px;
  border-bottom: 1px solid var(--line);
  gap: 10px;
  flex-wrap: wrap;
}
.modal-head h2 { margin: 0; font-size: 15px; letter-spacing: .1em; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, .12);
  background: rgba(255, 255, 255, .04);
  color: #c9d6ee; cursor: pointer; font-size: 12px;
}
.icon-btn:hover { background: rgba(255, 255, 255, .1); }
.modal-body { padding: 16px 20px 22px; overflow: auto; flex: 1 1 auto; min-height: 0; font-size: 12px; line-height: 1.75; color: #c3d0e8; }
.modal-body h3 { color: var(--gold); font-size: 13px; margin: 18px 0 6px; letter-spacing: .08em; }
.modal-body h3:first-child { margin-top: 2px; }
.modal-body p { margin: 4px 0 8px; }
.modal-body ul { margin: 4px 0 10px; padding-left: 18px; }
.modal-body li { margin: 3px 0; }
.modal-body .warn { color: #ffce8a; }
.modal-body table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
.modal-body td { border-bottom: 1px solid rgba(255, 255, 255, .06); padding: 6px 8px; vertical-align: top; }
.modal-body td:first-child { width: 110px; color: #d7c48a; white-space: nowrap; font-weight: 600; }
.league-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.league-summary b { color: var(--gold); font-size: 14px; }
.league-summary span { color: var(--muted); font-size: 11px; }
.league-table td:first-child { width: auto; color: #c3d0e8; font-weight: 500; }
.league-table tr.league-row { cursor: pointer; }
.league-table tr.league-row:hover { background: rgba(232, 196, 106, .07); }
.league-detail { margin-top: 16px; }
.league-detail-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; color: var(--gold); }
.league-detail-head span { color: var(--muted); font-size: 11px; }

/* 单位详情 */
.detail-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.detail-glyph {
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; font-size: 24px; font-weight: 800;
  background: radial-gradient(circle at 32% 26%, #26395f, #0e1729);
  border: 2px solid var(--c, var(--gold));
}
.detail-name { font-size: 20px; font-weight: 900; }
.detail-role { font-size: 10px; color: var(--muted); letter-spacing: .1em; margin-top: 3px; }
.detail-stats { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
.detail-quote { color: #8fa4c8; font-style: italic; font-size: 11px; margin: 8px 0 4px; }
.detail-skill {
  border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 10px;
  padding: 8px 10px;
  margin: 7px 0;
  background: rgba(255, 255, 255, .025);
}
.detail-skill .sk-h { display: flex; justify-content: space-between; gap: 10px; }
.detail-skill .sk-h b { font-size: 12px; color: #f0dfae; }
.detail-skill .sk-h span { font-size: 10px; color: var(--muted); }
.detail-skill p { margin: 4px 0 0; font-size: 11px; color: #a9b8d3; line-height: 1.55; }

/* 提示气泡 */
.toast {
  position: fixed; left: 50%; bottom: 42px; transform: translate(-50%, 12px);
  padding: 9px 16px; border-radius: 10px;
  background: rgba(12, 18, 32, .96);
  border: 1px solid rgba(255, 107, 107, .35);
  color: #ffd9d2; font-size: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(140, 165, 210, .22); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(140, 165, 210, .4); }

/* 动画 */
@keyframes damageFloat {
  0% { transform: translate(-50%, -30%) scale(.45); opacity: 0; }
  18% { transform: translate(-50%, -65%) scale(1.28); opacity: 1; }
  55% { transform: translate(-50%, -80%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -145%) scale(.92); opacity: 0; }
}
@keyframes impactRing {
  0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(2.9); opacity: 0; }
}
@keyframes impactCore {
  0% { transform: translate(-50%, -50%) scale(.35); opacity: 1; }
  55% { transform: translate(-50%, -50%) scale(1.9); opacity: .95; }
  100% { transform: translate(-50%, -50%) scale(.1); opacity: 0; }
}
@keyframes impactSpark {
  0% { transform: rotate(var(--a)) translateY(-2px) scaleY(.45); opacity: 1; }
  70% { opacity: .95; }
  100% { transform: rotate(var(--a)) translateY(calc(-1 * var(--d, 24px))) scaleY(1.15); opacity: 0; }
}
@keyframes impactFlash {
  0% { opacity: .95; }
  100% { opacity: 0; }
}
@keyframes impactShake1 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, 1px); }
}
@keyframes impactShake2 {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-4px, 2px); }
  40% { transform: translate(4px, -2px); }
  60% { transform: translate(-3px, 2px); }
  80% { transform: translate(2px, -1px); }
}
@keyframes impactShake3 {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  15% { transform: translate(-6px, 3px) rotate(-.25deg); }
  30% { transform: translate(6px, -3px) rotate(.25deg); }
  45% { transform: translate(-5px, 2px) rotate(-.18deg); }
  60% { transform: translate(4px, -2px) rotate(.15deg); }
  78% { transform: translate(-2px, 1px) rotate(-.08deg); }
}

@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(.85); }
  15% { opacity: 1; transform: translate(-50%, -60%) scale(1.05); }
  100% { opacity: 0; transform: translate(-50%, -160%) scale(.95); }
}
@keyframes dodgeFloat {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(.35) rotate(-8deg); }
  18% { opacity: 1; transform: translate(-50%, -65%) scale(1.45) rotate(2deg); }
  52% { opacity: 1; transform: translate(-50%, -105%) scale(1.12) rotate(0); }
  100% { opacity: 0; transform: translate(-50%, -165%) scale(1); }
}
@keyframes dodgeBurst {
  0% { opacity: .95; transform: translate(-50%, -50%) scale(.35); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.85); }
}
@keyframes dodgeRing {
  0% { opacity: .9; transform: scale(.8); }
  100% { opacity: 0; transform: scale(1.8); }
}
@keyframes dodgeToken {
  0%, 100% { box-shadow: 0 0 0 2px #9dffd0, 0 0 22px rgba(70, 255, 175, .65); }
  50% { box-shadow: 0 0 0 4px #d9fff0, 0 0 40px rgba(70, 255, 175, 1); }
}
@keyframes grantedGlow {
  0% { box-shadow: 0 0 0 0 rgba(255, 215, 100, .95); filter: brightness(1); }
  22% { box-shadow: 0 0 0 5px rgba(255, 226, 145, .95), 0 0 38px rgba(255, 190, 40, .95); filter: brightness(1.28); }
  65% { box-shadow: 0 0 0 2px rgba(255, 220, 120, .7), 0 0 24px rgba(255, 190, 40, .7); filter: brightness(1.1); }
  100% { box-shadow: 0 0 0 0 rgba(255, 215, 100, 0); filter: brightness(1); }
}
@keyframes grantedTag {
  0% { opacity: 0; transform: translate(-50%, -55%) scale(.55); }
  18% { opacity: 1; transform: translate(-50%, -118%) scale(1.12); }
  72% { opacity: 1; transform: translate(-50%, -128%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -175%) scale(.98); }
}
@keyframes grantedBurst {
  0% { opacity: .95; transform: translate(-50%, -50%) scale(.35); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.85); }
}
@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(232, 196, 106, .4); }
  50% { box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(232, 196, 106, .7); }
}
@keyframes targetPulse {
  0%, 100% { opacity: .5; transform: scale(.96); }
  50% { opacity: 1; transform: scale(1.02); }
}
@keyframes attackRangePulse {
  0%, 100% { opacity: .18; }
  50% { opacity: .78; }
}
@keyframes hitShake {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-3px, 2px) scale(1.04); }
  60% { transform: translate(3px, -2px) scale(.98); }
}
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes bannerIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 响应式 */
@media (max-width: 1180px) {
  #side { width: 330px; flex-basis: 330px; overflow-y: auto; }
  .token .token-name { font-size: 8px; }
  .queue-list { max-height: 92px; }
  .log-card { min-height: 82px; }
}
@media (max-width: 980px) {
  .roster-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .start-screen { padding: 12px 12px 0; }
  .start-inner { height: auto; min-height: 0; padding-bottom: 86px; }
  .roster-grid { overflow: visible; flex: 0 0 auto; }
  .start-actions {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    margin: 0; padding: 10px 16px;
    background: rgba(7, 11, 21, .97);
    border-top: 1px solid rgba(232, 196, 106, .18);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .45);
  }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  #main { flex-direction: column; }
  #stage { padding: 10px 12px 4px; }
  .kill-banner { top: 34px; max-width: 94vw; padding: 7px 12px; gap: 5px; font-size: 12px; border-radius: 7px; }
  .kill-banner .kill-cause { display: none; }
  #side { width: 100%; flex: none; padding: 10px 12px 20px; display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
  .action-card { grid-column: 1 / -1; max-height: none; }
  .log-card { grid-column: 1 / -1; min-height: 150px; }
  #topbar { padding: 0 12px; }
  .brand { min-width: 0; }
  .brand-text small { display: none; }
  .round-badge { margin: 0; }
  .top-actions { margin-left: auto; }
  .start-actions { bottom: 30px; transition: transform .25s ease, opacity .2s ease; }
  .start-actions.collapsed { transform: translateY(calc(100% + 30px)); opacity: 0; pointer-events: none; }
  .start-actions-toggle {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 80;
    height: 30px;
    align-items: center;
    justify-content: center;
    border: 0;
    border-top: 1px solid rgba(232, 196, 106, .18);
    background: linear-gradient(180deg, rgba(13, 20, 34, .98), rgba(7, 11, 21, .98));
    color: var(--gold);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    cursor: pointer;
    box-shadow: 0 -6px 18px rgba(0, 0, 0, .35);
  }
  .start-inner { padding-bottom: 130px; }
  .start-screen.actions-collapsed .start-inner { padding-bottom: 54px; }
}
@media (max-width: 560px) {
  .hero h1 { font-size: 44px; }
  .hero .sub { font-size: 11px; }
  .start-inner { padding: 22px 12px 230px; }
  #side { grid-template-columns: 1fr; }
  .pick-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .start-actions { flex-direction: column; }
  .start-actions .btn { width: 100%; }
  .brand-text { display: none; }
  .round-badge { padding: 6px 10px; font-size: 11px; letter-spacing: .06em; }
  .top-actions { gap: 4px; }
  .top-actions .btn { padding: 5px 7px; font-size: 10px; }
}

/* ---------------- skill effects ---------------- */
.skill-fx {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 0; height: 0;
  z-index: 2;
  pointer-events: none;
  animation: skillFxFade 1.15s ease-out forwards;
}
.skill-fx .fx-core {
  position: absolute; left: 50%; top: 50%;
  width: 62px; height: 62px; margin: -31px 0 0 -31px;
  border: 2px solid var(--fx);
  border-radius: 50%;
  box-shadow: 0 0 18px var(--fx), inset 0 0 22px color-mix(in srgb, var(--fx) 32%, transparent);

        goldenVow: null, actedThisRound: false, ryougiKite: false,
        stun: 0, sharkEye: false,
        stunTimed: false, stunUntil: 0,
        armorBreakUntil: 0, liEvadeUntil: 0, counterStanceUntil: 0, counterStance: false,
        perfectPenalty: false, painCombo: 0, moonRoyal: 0, moonRerollRound: 0, carianCharges: 0,
        millicentCombo: 0, millicentLanding: null, millicentNextImmune: false, painShinraCdPending: false,
        drillLockUsed: false, zhangRoar: false, sentinelCdUntil: 0,
        layers: 0, source: def.source || 0, gang: 0,
        moves: 0, timeStops: 0, chargesUsed: 0, rangedCount: 0, actionsTaken: 0,
        items: { blood: 0, shield: 0 }, knife: { owned: false, used: false, special: false },
        gun: false, sword: false,
        trueShield: 0, exiledUntil: 0, circles: 0, humanOrderLoad: 0,
        freeMoveUntil: 0, freeMoveRound: 0,
        pleasure: 0, pleasureMax: 3, pleasureUsedRound: 0,
        goetiaUntil: 0, solomonSnapshot: null, goetiaSnapshot: null,
        solarBlockRound: 0, lancelotRageUntil: 0, lancelotExtra: 0, lancelotNextRoundExtra: 0,
        nextDamageHalf: false, standingDown: false, downEvade: 0, soujuuCombo: 0,
        circuitBreakUntil: 0, circuitBreakTriggered: false, skillSealUntil: 0,
        cds: {}, usedOnce: {}, uses: {},
        knockedThisRound: new Set(),
        kills: [], lastKillRound: -99,
        stats: { dealt: 0, taken: 0, healed: 0, kills: 0, downs: 0, actions: 0, skills: 0 },
        flags: {}, atkBonus: 0, extraNoKill: 0, extraAction: 0,
        sandaGuard: key === 'sanda',
        poisonUntil: 0, poisonDmg: 0, poisonSrc: null,
        summon: key === 'hanzoSalamander', summonUntil: 0,
        copiedSkills: null, copiedPassive: null, copiedPassiveKey: null,
        trialUntil: 0, bladeBreakUntil: 0, gilEnuma: null
      };
    }

    initEggplants() {
      const units = Object.values(WX.UNITS).filter(d => !d.summonOnly && !d.notSelectable && d.key !== 'cancerSpore' && d.key !== 'eggplant');
      const supportedPassives = new Set([
        'trainer', 'sanda', 'oldman', 'icehalberd', 'cancer', 'mih', 'gauntlet',
        'kukuang', 'diego', 'drill', 'fishknife', 'hakuno', 'li', 'ryougi', 'aokiji',
        'kiritsugu', 'gawain', 'lancelot', 'soujuurou'
      ]);
      const passiveKeys = Object.keys(WX.PASSIVES).filter(k =>
        supportedPassives.has(k) && WX.PASSIVES[k] && WX.PASSIVES[k].length);
      const blockedSkills = new Set([
        'painCombo', 'mumyou', 'vault', 'dungeonDuel', 'finger', 'fingerHit',
        'rageThrust', 'gravityBlade', 'kingVolley', 'guard', 'leader', 'thrust',
        'carianReturn', 'carianPierce', 'carianCharge',
        'rage', 'mourning', 'repair', 'roar', 'spear', 'recover', 'castle', 'clairvoyance',
        'selfCut'
      ]);
      const skillPool = [];
      units.forEach(d => (d.skills || []).forEach(s => {
        if (s && s.id && !blockedSkills.has(s.id)) skillPool.push(s);
      }));
      this.units.filter(u => u.key === 'eggplant').forEach(u => {
        const pk = this.pick(passiveKeys);
        const passives = WX.PASSIVES[pk] || [];
        const p = pk === 'ryougi'
          ? (passives.find(x => x.name.includes('直死')) || passives[0])
          : this.pick(passives);
        u.copiedPassiveKey = pk;
        u.copiedPassive = p ? { name: p.name, desc: p.desc, sourceKey: pk } : null;
        if (pk === 'sanda') u.basicHits = 2;
        if (pk === 'kukuang') u.meleeOpts = Object.assign({}, u.meleeOpts || {}, { trueDmg: true });
        if (u.copiedPassive) u.passive = `复制被动·${u.copiedPassive.name}：${u.copiedPassive.desc}`;
        const picked = [];
        const pool = skillPool.slice();
        while (picked.length < 2 && pool.length) {
          const idx = Math.floor(this.rng() * pool.length);
          const s = pool.splice(idx, 1)[0];
          if (picked.some(x => x.id === s.id)) continue;
          picked.push(Object.assign({}, s, { copied: true }));
        }
        u.copiedSkills = picked;
        this.log(`${u.name} 复制被动「${u.copiedPassive ? u.copiedPassive.name : '无'}」，技能「${picked.map(s => s.name).join('、')}」`, 'buff');
      });
    }

    setup(leftKeys, rightKeys) {
      this.units = [];
      this.round = 0;
      this.over = false;
      this.winner = null;
      this.massacre = null;
      this.timeStop = null;
      this.logs = [];
      this._logSeq = 0;
      this.startedAt = Date.now();
      this.endedAt = null;
      this.dungeonCells = [];
      this.dungeonSet = new Set();
      this.duelActive = false;
      this.duelFighters = [];
      this.pendingDuel = null;
      this.meteors = [];

      const occupied = new Set();
      const shops = new Set(C.SHOPS.map(s => s.x + ',' + s.y));

      const spawn = (keys, team) => {
        keys.forEach(key => {
          const cells = [];
          const x0 = team === 'left' ? 0 : C.W - 3;
          const x1 = team === 'left' ? 2 : C.W - 1;
          for (let x = x0; x <= x1; x++) for (let y = 0; y < C.H; y++) {
            const k = x + ',' + y;
            if (!occupied.has(k) && !shops.has(k)) cells.push({ x, y });
          }
          if (!cells.length) throw new Error('出生格不足');
          const c = this.pick(cells);
          occupied.add(c.x + ',' + c.y);
          const u = this.makeUnit(key, team);
          u.x = c.x; u.y = c.y;
          this.units.push(u);
        });
      };

      spawn(leftKeys, 'left');
      spawn(rightKeys, 'right');

      this.initEggplants();

      if (this.units.some(u => u.key === 'van')) this.generateDungeon();

      // 初始被动
      this.units.forEach(u => {
        if (u.key === 'oldman' || u.copiedPassiveKey === 'oldman') u.stealth = 5;
        if (u.key === 'icehalberd' || u.copiedPassiveKey === 'icehalberd') u.shield = Math.max(u.shield, 1);
        if (u.key === 'rakshasa') u.source = Math.max(u.source, 2);
        if (u.copiedPassiveKey === 'sanda') u.sandaGuard = true;
      });
      // 库赞冰封之路：开局冰冻一名敌人
      this.units.filter(u => u.key === 'aokiji' || u.copiedPassiveKey === 'aokiji').forEach(u => {
        const es = this.enemiesOf(u).slice();
        if (es.length) this.freeze(this.pick(es), u);
      });

      this.log('战斗开始。双方在 11×7 战场两侧就位。', 'system');
      this.startRound();
    }

    generateDungeon() {
      const starts = [];
      for (let x = 0; x < C.W - 1; x++) {
        for (let y = 0; y < C.H - 1; y++) {
          const cells = [{ x, y }, { x: x + 1, y }, { x, y: y + 1 }, { x: x + 1, y: y + 1 }];
          if (cells.some(c => this.isShop(c.x, c.y) || this.unitAt(c.x, c.y))) continue;
          starts.push({ x, y });
        }
      }
      if (starts.length) {
        const s = this.pick(starts);
        this.dungeonCells = [
          { x: s.x, y: s.y }, { x: s.x + 1, y: s.y },
          { x: s.x, y: s.y + 1 }, { x: s.x + 1, y: s.y + 1 }
        ];
      } else {
        const c = this.pick(this.freeCells());
        if (!c) return;
        this.dungeonCells = [c];
      }
      this.dungeonSet = new Set(this.dungeonCells.map(c => c.x + ',' + c.y));
      const minX = Math.min(...this.dungeonCells.map(c => c.x));
      const minY = Math.min(...this.dungeonCells.map(c => c.y));
      this.log(`特殊场地【地牢】出现在 (${minX + 1},${minY + 1}) 一带`, 'dungeon');
    }

    /* ------------------------------ round ------------------------------ */
    expireSummons() {
      this.units.filter(s => s.summon && !s.dead && !s.removed && this.round >= s.summonUntil).forEach(s => {
        const targets = this.units.filter(t => !t.dead && !t.removed && !t.downed && !t.summon &&
          t.team !== s.team && this.dist(s, t) <= 5);
        if (targets.length) {
          const t = targets.sort((a, b) => a.hp - b.hp || this.dist(s, a) - this.dist(s, b))[0];
          this.log(`${s.name} 消失，毒雾直中 ${t.name}`, 'skill');
          this.damage(s, t, 0.5, {
            ranged: true, direct: true, element: 'poison',
            ignoreEvade: true, ignoreVision: true, skill: '山椒鱼'
          });
        } else {
          this.log(`${s.name} 消失，未命中敌人`, 'move');
        }
        s.removed = true;
        this.emit();
      });
    }

    startRound() {
      if (this.over) return;
      this.round += 1;
      this.timeStop = null;
      this.cannotKill = false;
      this.current = null;
      this.actionsLeft = 0;
      this.units.forEach(u => {
        u.knockedThisRound.clear();
        u.actedThisRound = false;
      });
      this.expireSummons();
      if (this.over) { this.emit(); return; }
      // 米莉森：水鸟第一段在“下一轮开始”时自动降落并解除隐匿，
      // 不是等到她自己的下一次行动。
      this.units.forEach(u => {
        if (this.hasWaterfowl(u) && u.millicentCombo === 1 && !u.downed && !u.frozen) {
          this.resolveMillicentLanding(u);
        }
      });
      if (this.over) { this.emit(); return; }
      this.drawQueue();
      this.qIndex = 0;
      this.emit();
      this.advance();
    }

    drawQueue() {
      this.tickForms();
      const alive = this.units.filter(u => !u.dead && !u.removed && !u.summon && !this.isExiled(u));
      let k = 1;
      if (alive.length >= 2) k = 1 + Math.floor(this.rand() * (alive.length - 1));
      k = Math.min(k, alive.length);
      const drawn = this.shuffle(alive.slice()).slice(0, k);
      const downed = drawn.filter(u => u.downed);
      const normal = drawn.filter(u => !u.downed);
      const left = this.shuffle(normal.filter(u => u.team === 'left').slice());
      const right = this.shuffle(normal.filter(u => u.team === 'right').slice());
      let first;
      if (left.length === right.length) first = this.chance(0.5) ? 'left' : 'right';
      else first = left.length > right.length ? 'left' : 'right';

      // 只有“抽中”的倒地单位才优先行动；未抽到的倒地单位仍会被留到下一轮。
      const normalQueue = [];
      let a = first === 'left' ? left : right;
      let b = first === 'left' ? right : left;
      while (a.length || b.length) {
        if (a.length) normalQueue.push(a.shift());
        if (b.length) normalQueue.push(b.shift());
      }
      const downedQueue = this.shuffle(downed.slice());
      this.queue = downedQueue.concat(normalQueue).map(u => u.id);
      this.maybeKireiPleasure(drawn);
      this.applyGawainSolar(drawn.length);

      // 多人战中，抽中且时停就绪的海洋学博士仍是特殊优先；倒地优先权更高。
      const multi = ['left', 'right'].some(team => alive.filter(u => u.team === team).length > 1);
      if (multi) {
        const marines = drawn.filter(u => u.key === 'marine' && !u.downed && !u.frozen &&
          u.stun <= 0 && !u.inDungeon && (u.cds.timeStop || 0) <= this.round);
        if (marines.length) {
          const ids = marines.map(u => u.id);
          const head = this.queue.filter(id => downedQueue.some(u => u.id === id));
          this.queue = head.concat(ids, this.queue.filter(id => !ids.includes(id) && !head.includes(id)));
          this.log('海洋学博士时停就绪，强制优先行动', 'timestop');
        }
      }
      this.lastDraw = {
        total: k, left: drawn.filter(u => u.team === 'left').length,
        right: drawn.filter(u => u.team === 'right').length,
        downed: downed.length, first
      };
      this.log(`第 ${this.round} 回合抽签：抽中 ${k} 人行动（倒地 ${downed.length} 人优先；蓝方 ${this.lastDraw.left} / 红方 ${this.lastDraw.right}，${first === 'left' ? '蓝方' : '红方'}先手）`, 'draw');
      this.applyLancelotNextRoundExtra();
    }

    isExiled(u) {
      return !!(u && u.exiledUntil > this.round);
    }

    tickForms() {
      this.units.forEach(u => {
        if (u.dead || u.removed) return;
        if (u.key === 'goetia' && u.goetiaUntil && this.round >= u.goetiaUntil) this.revertGoetia(u);
        if (u.exiledUntil && u.exiledUntil <= this.round) u.exiledUntil = 0;
        if (u.solarBlockRound && u.solarBlockRound < this.round) {
          u.block = Math.max(0, (u.block || 0) - 0.5);
          u.solarBlockRound = 0;
        }
        if (this.hasKiritsuguPassive(u)) {
          const near = this.units.some(e => e.team !== u.team && !e.dead && !e.removed &&
            !e.summon && this.dist(u, e) <= 1);
          u.stealth = near ? 0 : 1;
        } else if (u.inDungeon) {
          u.stealth = 0;
        }
      });
    }

    hasKiritsuguPassive(u) {
      return !!u && !u.inDungeon && (u.key === 'kiritsugu' || u.copiedPassiveKey === 'kiritsugu');
    }

    maybeKireiPleasure(drawn) {
      this.units.forEach(u => {
        if (u.key !== 'kirei' || u.dead || u.removed || u.inDungeon || this.isExiled(u)) return;
        if (drawn.includes(u) || this.queue.includes(u.id)) return;
        if ((u.pleasure || 0) <= 0 || (u.pleasureUsedRound || 0) >= this.round) return;
        u.pleasure -= 1;
        u.pleasureUsedRound = this.round;
        this.queue.push(u.id);
        if (this.lastDraw) this.lastDraw.total += 1;
        this.log(`${u.name} 消耗 1 层愉悦，获得额外行动`, 'buff');
        this.float(u, '愉悦行动', 'buff');
      });
    }

    applyGawainSolar(drawnCount) {
      if (drawnCount % 2 === 0) return;
      this.units.forEach(u => {
        if ((u.key === 'gawain' || u.copiedPassiveKey === 'gawain') && !u.dead && !u.removed && !u.inDungeon) {
        u.frozen = false; u.stun = 0; u.stunTimed = false; u.stunUntil = 0;
        u.root = 0; u.airborne = 0;
        u.block = (u.block || 0) + 0.5;
        u.solarBlockRound = this.round;
        this.log(`${u.name} 的太阳骑士发动：清除负面，格挡 +50%（本轮）`, 'buff');
        this.float(u, '太阳骑士', 'buff');
        }
      });
    }

    applyLancelotNextRoundExtra() {
      this.units.forEach(u => {
        if (u.key !== 'lancelot' || u.dead || u.removed || u.inDungeon) return;
        if ((u.lancelotNextRoundExtra || 0) !== this.round) return;
        u.lancelotNextRoundExtra = 0;
        // 被抽中时，这次额外行动直接消失；只有没抽中才补 1 次行动。
        if (this.queue.includes(u.id)) {
          this.log(`${u.name} 已被抽中，狂化的额外行动不追加`, 'buff');
          return;
        }
        this.queue.unshift(u.id);
        if (this.lastDraw) this.lastDraw.total += 1;
        this.log(`${u.name} 未被抽中，狂化在回合开始追加 1 次行动`, 'buff');
        this.float(u, '狂化追加行动', 'buff');
      });
    }

    nearbyEnemies(u) {
      if (!u || u.inDungeon) return 0;
      return this.units.filter(t => t.team !== u.team && !t.dead && !t.removed &&
        !t.summon && this.sameZone(u, t) && this.dist(u, t) <= 1).length;
    }

    relocate(u, x, y) {
      if (!this.inBounds(x, y)) return this.err('目标格越界');
      if (this.isShop(x, y)) return this.err('商店格不可通行');
      if (!u.inDungeon && this.isDungeonCell(x, y)) return this.err('地牢只能由被点名者进入');
      if (u.inDungeon && !this.isDungeonCell(x, y)) return this.err('决斗期间无法离开地牢');
      if (this.unitAt(x, y)) return this.err('目标格已被占用');
      const partner = this.carryPartner(u);
      u.x = x; u.y = y;
      if (partner && !partner.dead && !partner.removed) { partner.x = x; partner.y = y; }
      if (!u.inDungeon && (u.key === 'solomon' || u.copiedPassiveKey === 'solomon')) u.circles = (u.circles || 0) + 1;
      this.updateStealthFor(u);
      return { ok: true };
    }

    kiritsuguTime(u, cell) {
      if (!cell || !this.inBounds(cell.x, cell.y)) return this.err('目标格无效');
      const r = this.relocate(u, cell.x, cell.y);
      if (r && r.error) return r;
      u.freeMoveUntil = this.round + 2;
      u.freeMoveRound = 0;
      this.log(`${u.name} 固有时制御：3R 内每回合可无步数移动 1 次`, 'buff');
      return { ok: true };
    }

    hasFreeMove(u) {
      return !!u && !u.dead && !u.removed && !u.inDungeon && !u.downed &&
        (u.key === 'kiritsugu' || u.copiedPassiveKey === 'kiritsugu') &&
        (u.freeMoveUntil || 0) >= this.round && (u.freeMoveRound || 0) < this.round;
    }

    freeMove(u, x, y) {
      if (!u || this.current !== u) return this.err('现在不是该角色的回合');
      if (!this.hasFreeMove(u)) return this.err('本回合免费移动不可用');
      const r = this.relocate(u, x, y);
      if (r && r.error) return r;
      u.freeMoveRound = this.round;
      this.log(`${u.name} 固有时制御：无步数移动`, 'move');
      if (this.actionsLeft <= 0) this.endTurnAfterFreeMove(u);
      return { ok: true };
    }

    endTurnAfterFreeMove(u) {
      if (!u || u.dead || u.removed) return;
      this.tickPoison(u);
      this.current = null;
      this.actionsLeft = 0;
      this.cannotKill = false;
      this.emit();
      this.advance();
    }

    updateStealthFor(u) {
      if (!this.hasKiritsuguPassive(u)) return;
      const near = this.units.some(e => e.team !== u.team && !e.dead && !e.removed &&
        !e.summon && this.dist(u, e) <= 1);
      u.stealth = near ? 0 : 1;
    }

    gainPleasure(u, n) {
      u.pleasureMax = (u.pleasureMax || 3) + (n > 0 && u._pleasureMaxGain ? 0 : 0);
      u.pleasure = Math.min(u.pleasureMax || 3, (u.pleasure || 0) + n);
    }

    kireiHeal(u, t) {
      if (!t || t.dead || t.removed) return this.err('目标无效');
      if (t.hp >= t.maxHp) {
        this.log(`${t.name} 已满血，治疗魔术没有生效`, 'warn');
        return { ok: true, wasted: true };
      }
      this.heal(t, 0.5);
      if (t.team !== u.team) {
        u.pleasure = Math.min(u.pleasureMax || 3, (u.pleasure || 0) + 1);
        this.log(`${u.name} 治疗敌方，愉悦 +1（${u.pleasure}/${u.pleasureMax}）`, 'buff');
      }
      return { ok: true };
    }

    kireiBaptism(u, t) {
      if (!t || t.dead || t.removed) return this.err('目标无效');
      t.frozen = false;
      t.stun = 0; t.stunTimed = false; t.stunUntil = 0;
      t.root = 0; t.airborne = 0;
      t.poisonUntil = 0; t.poisonDmg = 0; t.poisonSrc = null;
      t.armorBreakUntil = 0; t.bladeBreakUntil = 0;
      const extra = (u.pleasure || 0) * 0.5;
      this.log(`${u.name} 洗礼咏唱：清除 ${t.name} 的负面，愉悦附加 ${extra} 伤害`, 'skill');
      this.damage(u, t, 0.5 + extra, {
        ranged: true, direct: true, ignoreEvade: true, ignoreVision: true, skill: '洗礼咏唱'
      });
      return { ok: true };
    }

    kireiAzoth(u, t) {
      if (!t || t.dead || t.removed) return this.err('目标无效');
      if (t.team === u.team) {
        this.instantKill(u, t);
        return { ok: true, instant: true };
      }
      return this.damage(u, t, 1, { melee: true, skill: 'Azoth剑' });
    }

    deathfistSelfCut(u) {
      if (u.dead || u.removed) return this.err('已阵亡');
      if (!u.downed) {
        this.damage(u, u, 0.5, { direct: true, selfCut: true, noKnife: true });
        return { ok: true };
      }
      // 倒地后再次自裁：50% 夺舍，否则死亡。
      if (this.chance(0.5)) {
        const targets = this.enemiesOf(u).filter(t => !t.dead && !t.removed && !t.summon);
        if (!targets.length) {
          this.kill(u, u, { selfCut: true });
          return { ok: true };
        }
        const t = this.pick(targets);
        this.possess(u, t);
        return { ok: true, possessed: true };
      }
      this.log(`${u.name} 自裁失败，死亡之旅未能夺舍`, 'death');
      this.kill(u, u, { selfCut: true });
      return { ok: true };
    }

    possess(u, t) {
      const team = u.team;
      const id = u.id;
      this.log(`${u.name} 发动死亡之旅，夺舍 ${t.name}！`, 'death');
      this.kill(t, u, { possess: true });
      u.team = team; u.id = id;
      u.key = t.key; u.name = t.name; u.title = t.title || t.name; u.short = t.short || u.short;
      u.role = t.role || u.role; u.color = t.color || u.color;
      u.maxHp = t.maxHp; u.hp = t.maxHp;
      u.melee = t.melee; u.ranged = t.ranged || 0; u.rangedRange = t.rangedRange || 3;
      u.defense = t.defense || 0; u.block = t.block || 0; u.reduction = t.reduction || 0;
      u.finalReduction = t.finalReduction || 0;
      u.lockHp = t.lockHp || 0; u.roundLockHp = t.roundLockHp || 0; u.absoluteDefense = t.absoluteDefense || 0;
      u.skills = t.skills; u.passive = t.passive; u.passiveDefs = t.passiveDefs;
      u.downed = false; u.dead = false; u.removed = false; u.frozen = false;
      this.float(u, '夺舍', 'buff');
      this.emit();
    }

    liubeiRenDe(u, t) {
      if (!t || t.dead || t.removed || t.id === u.id || t.team !== u.team) return this.err('需要友方目标');
      this.log(`${u.name} 仁德：将行动转移给 ${t.name}`, 'buff');
      this.queue.splice(this.qIndex, 0, t.id);
      if (u.downed) {
        u.downed = false; u.hp = Math.max(0.5, u.maxHp * 0.5);
        this.log(`${u.name} 因仁德起身`, 'heal');
      } else {
        this.heal(u, 0.5);
      }
      return { ok: true };
    }

    solomonTransform(u) {
      const targets = this.enemiesOf(u).filter(t => this.dist(u, t) <= 1 && !t.dead && !t.removed);
      targets.forEach(t => { for (let i = 0; i < 3; i++) this.damage(u, t, 0.5, { trueDmg: true, skill: '统括局盖提亚' }); });
      this.damage(u, u, 0, { noKnife: true });
      u.solomonSnapshot = {
        key: u.key, name: u.name, title: u.title, short: u.short, role: u.role, color: u.color,
        maxHp: u.maxHp, hp: u.hp, melee: u.melee, lockHp: u.lockHp || 0,
        hitCap: u.hitCap || 0, humanOrderLoad: u.humanOrderLoad || 0,
        cds: Object.assign({}, u.cds)
      };
      u.goetiaSnapshot = { maxHp: 2, hp: 2, cds: {} };
      u.key = 'goetia'; u.name = '盖提亚'; u.title = '人理烧却'; u.short = '盖';
      u.role = '人理 · 兽'; u.color = '#d9a35f';
      u.maxHp = 2; u.hp = 2; u.melee = 2; u.lockHp = 0; u.hitCap = 0;
      u.humanOrderLoad = 0;
      u.cds = {};
      u.goetiaUntil = this.round + 6;
      this.log(`${u.name} 变身盖提亚（6R）`, 'buff');
      this.float(u, '盖提亚', 'buff');
      return { ok: true };
    }

    revertGoetia(u) {
      const s = u.solomonSnapshot;
      if (!s) return;
      u.key = s.key; u.name = s.name; u.title = s.title; u.short = s.short;
      u.role = s.role; u.color = s.color;
      u.maxHp = s.maxHp; u.hp = Math.min(s.hp, s.maxHp); u.melee = s.melee;
      u.cds = s.cds || {}; u.lockHp = s.lockHp || 0; u.hitCap = s.hitCap || 0;
      u.humanOrderLoad = s.humanOrderLoad || 0; u.goetiaUntil = 0;
      this.log(`${u.name} 从盖提亚变回原形态`, 'buff');
    }

    solomonExile(u) {
      if ((u.circles || 0) < 1) return this.err('需要 1 层法阵');
      u.circles -= 1;
      const targets = this.enemiesOf(u).slice(0, 2);
      targets.forEach(t => {
        this.damage(u, t, 0.5, { element: 'void', skill: '虚数之拥' });
        if (!t.dead && !t.removed) {
          t.exiledUntil = this.round + 2;
          this.log(`${t.name} 被放逐 2R（无法行动、不可选中）`, 'debuff');
          this.float(t, '放逐', 'debuff');
        }
      });
      return { ok: true };
    }

    solomonRaze(u, goetia) {
      this.enemiesOf(u).forEach(t => {
        if (!t.dead && !t.removed) {
          t.block = 0; t.defense = 0; t.reduction = 0; t.finalReduction = 0;
          t.flatReduction = 0; t.breakValue = 0;
          t.lockHp = 0; t.roundLockHp = 0; t.absoluteDefense = 0; t.shield = 0;
          t.trueShield = 0; t.hitCap = 0;
          this.damage(u, t, goetia ? 2.5 : 0.5, {
            trueDmg: true, armorBreak: true, ignoreDefense: true, ignoreCap: true,
            ignoreLock: true, skill: goetia ? '诞生之时已至' : '诞生之时已至，以此修正万象'
          });
        }
      });
      return { ok: true };
    }

    goetiaLoad(u) {
      u.humanOrderLoad = (u.humanOrderLoad || 0) + 1;
      this.log(`${u.name} 获得 1 层人理装填`, 'buff');
      return { ok: true };
    }

    goetiaRaze(u) {
      if ((u.humanOrderLoad || 0) < 1) return this.err('需要 1 层人理装填');
      u.humanOrderLoad -= 1;
      this.solomonRaze(u, true);
      return { ok: true };
    }

    goetiaCall(u) {
      this.enemiesOf(u).forEach(t => {
        if (!t.dead && !t.removed) this.damage(u, t, 0.5, { skill: '唤起' });
      });
      return { ok: true };
    }

    gawainHorse(u) {
      u.trueShield = (u.trueShield || 0) + 1;
      this.log(`${u.name} 召唤战马，获得 1 层真伤护盾`, 'buff');
      this.float(u, '真伤护盾', 'buff');
      return { ok: true };
    }

    gawainSword(u) {
      this.heal(u, 0.5);
      this.enemiesOf(u).filter(t => this.dist(u, t) <= 1 && !t.dead && !t.removed)
        .forEach(t => this.damage(u, t, 0.5, { element: 'light', skill: '卡美洛骑士直剑' }));
      return { ok: true };
    }

    kiritsuguOrigin(u, t) {
      if (!t || t.dead || t.removed) return this.err('目标无效');
      this.damage(u, t, 0.5, {
        ranged: true, direct: true, ignoreEvade: true, ignoreVision: true, skill: '起源弹'
      });
      if (!t.dead && !t.removed) {
        t.circuitBreakUntil = Math.max(t.circuitBreakUntil || 0, this.round + 5);
        t.circuitBreakTriggered = false;
        this.log(`${t.name} 陷入回路错乱 5R：首次使用技能后 -1 血并封技 5R`, 'debuff');
        this.float(t, '回路错乱', 'debuff');
      }
      return { ok: true };
    }

    soujuurouEvade(u) {
      u.downEvade = Math.min(2, (u.downEvade || 0) + 2);
      this.log(`${u.name} 无死不杀遍路：获得 2 层倒地闪避（${u.downEvade}/2）`, 'buff');
      this.float(u, '倒地闪避', 'buff');
      return { ok: true };
    }

    soujuurouCombo(u, t) {
      if (!t || t.dead || t.removed) return this.err('目标无效');
      if ((u.soujuuCombo || 0) === 0) {
        if (!u.downed) {
          u.hp = Math.max(0, r2(u.hp - 0.5));
          if (u.hp <= 0) this.down(u, u);
        }
        this.dashTo(u, t);
        this.damage(u, t, 0.5, { skill: '坐标不明，恶鬼杀手·一' });
        if (!t.dead && !t.removed) this.applyStun(t, 2, u);
        u.soujuuCombo = 1;
        this.log(`${u.name} 坐标不明：突刺命中，目标眩晕 2R`, 'skill');
        return { ok: true, keepCd: true };
      }
      if (this.dist(u, t) > 1) return this.err('第二段需要相邻目标');
      this.damage(u, t, 1, { trueDmg: true, skill: '坐标不明，恶鬼杀手·二' });
      u.soujuuCombo = 0;
      this.log(`${u.name} 坐标不明：第二段 1 真伤`, 'skill');
      return { ok: true };
    }

    lancelotRage(u) {
      u.hp = Math.max(0, u.hp - 0.5);
      if (u.hp <= 0) this.down(u, u);
      u.lancelotRageUntil = this.round + 1;
      u.lancelotNextRoundExtra = this.round + 1;
      u.lancelotExtra = (u.lancelotExtra || 0) + 1;
      u.nextDamageHalf = true;
      this.log(`${u.name} 狂化：失去 0.5 生命，获得额外行动，下一次受伤减半`, 'buff');
      return { ok: true };
    }

    lancelotRaid(u, t) {
      if (!t || t.dead || t.removed || this.dist(u, t) > 1) return this.err('需要相邻敌人');
      if (t.gun) { u.gun = true; t.gun = false; u.ranged = Math.max(u.ranged || 0, 0.5); u.rangedRange = Math.max(u.rangedRange || 0, 6); u.twoStep = true; }
      if (t.sword) { u.sword = true; t.sword = false; }
      if (t.knife && t.knife.owned) { u.knife = Object.assign({}, t.knife); t.knife = { owned: false, used: false, special: false }; }
      this.damage(u, t, 0.5, { melee: true, skill: '骑士不徒手而亡' });
      this.log(`${u.name} 掠夺了 ${t.name} 的装备`, 'knife');
      return { ok: true };
    }

    advance() {
      if (this.over) return;
      while (this.qIndex < this.queue.length) {
        const u = this.getUnit(this.queue[this.qIndex++]);
        if (!u || u.dead || u.removed || this.isExiled(u)) continue;
        if (this.timeStop && u.id !== this.timeStop.ownerId) {
          this.log(`${u.name} 被时停冻结，跳过本回合行动`, 'skip');
          continue;
        }
        if (u.mustDungeon && !u.inDungeon && !u.downed && !u.frozen && u.root <= 0) {
          const r = this.enterDungeon(u);
          if (r && r.error) {
            u.mustDungeon = false;
            this.log(`${u.name} 无法进入地牢：${r.error}`, 'warn');
          } else {
            this.log(`${u.name} 被地牢点名，本回合行动用于前往地牢`, 'dungeon');
            this.emit();
            continue;
          }
        }
        this.beginTurn(u);
        return;
      }
      this.endRound();
    }

    baseActions(u) {
      if (u.inDungeon) return 1;
      if (u.key === 'mih' || u.copiedPassiveKey === 'mih') return 2;
      if ((u.key === 'gauntlet' || u.copiedPassiveKey === 'gauntlet') && !u.flags.gauntletUsed) {
        u.flags.gauntletUsed = true;
        this.log('拳击手：首次行动后立即再行动一次', 'buff');
        return 2;
      }
      return 1;
    }

    /* ------------------------------ dungeon ---------------------------- */
    startDuel(van, target) {
      if (!van || !target) return this.err('目标无效');
      if (this.duelActive || this.pendingDuel) return this.err('地牢中已有决斗或点名');      if (van.team === target.team) return this.err('只能点名敌人');
      if (van.inDungeon || target.inDungeon) return this.err('双方都已在地牢中');
      if (target.dead || target.removed) return this.err('目标已不在场');
      if (van.mustDungeon || target.mustDungeon) return this.err('已经有点名在身');
      if (!this.dungeonCells.length) return this.err('本局没有地牢');
      // 规则级点名：不进行命中/闪避判定，迪亚哥动态视力不能规避。
      van.mustDungeon = true;
      target.mustDungeon = true;
      van.dungeonTarget = target.id;
      target.dungeonChallenger = van.id;
      this.pendingDuel = { vanId: van.id, targetId: target.id };
      this.log(`${van.name} 发动【地牢撅斗】，点名 ${target.name}：双方下一次行动（起身/解冻/解禁除外）必须前往地牢`, 'dungeon');
      this.float(target, '地牢点名', 'debuff');
      this.emit();
      return { ok: true };
    }

    isDuelPrincipal(t) {
      if (!t) return false;
      if (t.key === 'van') return true;
      if (this.pendingDuel && (this.pendingDuel.vanId === t.id || this.pendingDuel.targetId === t.id)) return true;
      return this.duelActive && this.duelFighters.includes(t.id);
    }

    enterDungeon(u) {
      if (!u || u.dead || u.removed) return this.err('单位已不在场');
      if (u.inDungeon) return { ok: true };
      if (u.carrying || u.carriedBy) this.releaseCarry(u, '进入地牢');
      const free = this.freeDungeonCells();
      if (!free.length) return this.err('地牢已满');
      const c = free[0];
      u.x = c.x; u.y = c.y;
      u.inDungeon = true;
      u.mustDungeon = false;
      u.frozen = false;
      u.root = 0;
      u.airborne = 0;
      u.charge = null;
      u.pendingShot = null;
      if (u.goldenVow) this.endGoldenVow(u);
      const prevBlock = u.block;
      const prevDefense = u.defense;
      const prevJeep = u.jeep;
      u.shield = 0;
      u.block = 0;
      u.defense = 0;
      u.reduction = 0;
      u.invincible = 0;
      u.invincibleUntilAction = 0;
      u.counter = 0;
      u.stealth = 0;
      u.evade = 0;
      u.evadeUses = 0;
      u.jeep = false;
      if (u.key !== 'van') {
        u.dungeonSnapshot = {
          maxHp: u.maxHp, melee: u.melee, ranged: u.ranged,
          rangedRange: u.rangedRange, meleeRange: u.meleeRange, twoStep: u.twoStep,
          shieldCap: u.shieldCap, block: prevBlock, defense: prevDefense, jeep: !!prevJeep,
          meleeOpts: u.meleeOpts, rangedOpts: u.rangedOpts, atkBonus: u.atkBonus,
          basicHits: u.basicHits
        };
        u.maxHp = 1;
        u.hp = 1;
        u.melee = 0.5;
        u.ranged = 0;
        u.rangedRange = 0;
        u.meleeRange = 1;
        u.twoStep = false;
        u.meleeOpts = null;
        u.rangedOpts = null;
        u.atkBonus = 0;
        u.basicHits = 1;
        this.log(`${u.name} 踏入地牢，被压制为 1 血 / 0.5 伤害的白板`, 'dungeon');
      } else {
        u.hp = Math.min(u.hp, u.maxHp);
        this.log(`${u.name} 踏入地牢`, 'dungeon');
      }
      const pd = this.pendingDuel;
      if (pd) {
        const a = this.getUnit(pd.vanId), b = this.getUnit(pd.targetId);
        if (a && b && a.inDungeon && b.inDungeon) this.beginDuel(a, b);
      }
      this.emit();
      return { ok: true };
    }

    beginDuel(a, b) {
      this.duelActive = true;
      this.duelFighters = [a.id, b.id];
      this.pendingDuel = null;
      this.log(`【地牢决斗】开始：${a.name} vs ${b.name}。外界无法干扰，直到一方彻底死亡`, 'dungeon');
      this.emit();
    }

    releaseFromDungeon(u) {
      if (!u || !u.inDungeon) return;
      const free = this.freeCells().filter(c => !this.isDungeonCell(c.x, c.y));
      const c = free.length ? this.pick(free) : this.freeCells()[0];
      if (c) { u.x = c.x; u.y = c.y; }
      u.inDungeon = false;
      u.mustDungeon = false;
      u.dungeonTarget = null;
      u.dungeonChallenger = null;
      const s = u.dungeonSnapshot;
      if (s) {
        u.maxHp = s.maxHp;
        u.melee = s.melee;
        u.ranged = s.ranged;
        u.rangedRange = s.rangedRange;
        u.meleeRange = s.meleeRange || 1;
        u.twoStep = s.twoStep;
        u.shieldCap = s.shieldCap;
        u.block = s.block;
        u.defense = s.defense || 0;
        u.jeep = !!s.jeep;
        u.jeepExploded = false;
        u.meleeOpts = s.meleeOpts || null;
        u.rangedOpts = s.rangedOpts || null;
        u.atkBonus = s.atkBonus || 0;
        u.basicHits = s.basicHits || 1;
        u.hp = Math.min(u.hp, u.maxHp);
        delete u.dungeonSnapshot;
      }
      this.log(`${u.name} 离开地牢${u.downed ? '（仍处于倒地）' : ''}`, 'dungeon');
    }

    endDuel(loser, winner, reason) {
      if (!this.duelActive) return;
      if (loser && !this.duelFighters.includes(loser.id)) return;
      const ids = this.duelFighters.slice();
      this.duelActive = false;
      this.duelFighters = [];
      this.pendingDuel = null;
      let win = winner;
      if (!win) {
        win = this.units.find(u => ids.includes(u.id) && u !== loser && !u.dead && !u.removed);
      }
      if (win && loser) {
        this.log(`【地牢决斗】结束：${win.name} 胜出，${loser.name} ${reason || '彻底死亡'}`, 'dungeon');
      } else {
        this.log('【地牢决斗】结束', 'dungeon');
      }
      ids.forEach(id => {
        const u = this.getUnit(id);
        if (!u || !u.inDungeon) return;
        if (u === loser && u.dead) return;
        this.releaseFromDungeon(u);
      });
      this.emit();
    }

    abortDuel(reason) {
      if (!this.pendingDuel && !this.duelActive && !this.units.some(u => u.inDungeon)) return;
      this.log(`【地牢决斗】中断${reason ? '：' + reason : ''}`, 'dungeon');
      this.pendingDuel = null;
      this.duelActive = false;
      this.duelFighters = [];
      this.units.forEach(u => {
        u.mustDungeon = false;
        u.dungeonTarget = null;
        u.dungeonChallenger = null;
        if (u.inDungeon && !u.dead && !u.removed) this.releaseFromDungeon(u);
      });
      this.emit();
    }

    beginTurn(u) {
      if (u.perfectPenalty) {
        u.perfectPenalty = false;
        this.log(`${u.name} 完美防反消耗了本回合行动，跳过`, 'warn');
        this.advance();
        return;
      }
      this.current = u;
      this.cannotKill = false;
      this.actionsLeft = Math.max(1, this.baseActions(u));
      this.log(`— ${u.name} 的回合（${u.team === 'left' ? '蓝' : '红'}方）—`, 'turn');
      if (u.downed) this.log(`${u.name} 处于倒地状态，可起身（恢复 ${r2(u.maxHp / 2)} 血）`, 'warn');
      if (u.frozen) this.log(`${u.name} 处于冰冻状态，只能解冻`, 'warn');
      this.startAction(u);
      this.emit();
      if (this.hooks.onTurn) this.hooks.onTurn(u);
    }

    startAction(u) {
      if (u.dead || u.removed || u.inDungeon) return;
      this._sentinelSnapshot = this.units.map(x => ({ id: x.id, x: x.x, y: x.y }));
      if (u.key === 'gil') {
        u.layers += 1;
        this.log(`王之宝库 +1 层（当前 ${u.layers} 层）`, 'buff');
      }
    }

    checkSentinelCross(snap) {
      if (!snap || !snap.length) return;
      const old = new Map(snap.map(p => [p.id, p]));
      for (const s of this.units) {
        if (s.key !== 'sentinel' || s.dead || s.removed || s.inDungeon) continue;
        if ((s.sentinelCdUntil || 0) > this.round) continue;
        const sp = old.get(s.id) || { x: s.x, y: s.y };
        let hit = null;
        for (const e of this.units) {
          if (e.dead || e.removed || e.team === s.team || e.stealth > 0) continue;
          if (!!e.inDungeon !== !!s.inDungeon) continue;
          const ep = old.get(e.id) || { x: e.x, y: e.y };
          const before = this.distXY(sp, ep.x, ep.y) <= 2;
          const after = this.distXY(s, e.x, e.y) <= 2;
          if (before !== after) { hit = e; break; }
        }
        if (hit) {
          s.sentinelCdUntil = this.round + 2;
          this.log(`治严：${hit.name} ${this.dist(s, hit) <= 2 ? '进入' : '离开'} ${s.name} 的射程`, 'skill');
          this.float(s, '治严', 'buff');
          this.damage(s, hit, 0.5, { skill: '治严', ignoreStealth: true });
        }
      }
    }

    consumeAction(u, opts) {
      opts = opts || {};
      if (this.over) return;
      if (u.dead || u.removed) {
        this.current = null;
        this.actionsLeft = 0;
        this.emit();
        this.advance();
        return;
      }
      this.checkSentinelCross(this._sentinelSnapshot);
      this._sentinelSnapshot = null;
      let extra = 0;
      if (u.extraNoKill > 0) {
        u.extraNoKill -= 1;
        extra = 1;
        this.cannotKill = true;
        this.log('时停的余韵：追加一次无法击杀的行动', 'timestop');
      }
      if (u.extraAction > 0) {
        u.extraAction -= 1;
        extra += 1;
        this.log(`${u.name} 的试刀物：行动结束后追加 1 次行动`, 'skill');
      }
      if (u.lancelotExtra > 0) {
        u.lancelotExtra -= 1;
        extra += 1;
        this.log(`${u.name} 的狂化：行动结束后追加 1 次行动`, 'buff');
      }
      this.actionsLeft += extra;
      this.actionsLeft -= 1;
      u.actionsTaken += 1;
      u.actedThisRound = true;
      if (u.painShinraCdPending && u.invincibleUntilAction <= u.actionsTaken) {
        u.painShinraCdPending = false;
        u.cds.shinraSuper = this.round + 6;
        this.log('神罗天征·超的无敌结束，开始计算 CD6', 'skill');
      }
      if (u.stats) u.stats.actions += 1;
      if (u.key === 'rakshasa' && !u.inDungeon && u.actionsTaken % 3 === 0) {
        u.source += 1;
        this.log(`生生不息：罗刹获得 1 层源泉（${u.source}）`, 'buff');
      }
      if (this.actionsLeft > 0 && u.mustDungeon && !u.inDungeon && !u.downed && !u.frozen && u.root <= 0) {
        const r = this.enterDungeon(u);
        if (!(r && r.error)) {
          this.log(`${u.name} 用剩余行动进入地牢`, 'dungeon');
          this.actionsLeft = 0;
          this.current = null;
          this.emit();
          this.advance();
          return;
        }
        u.mustDungeon = false;
        this.log(`${u.name} 无法进入地牢：${r.error}`, 'warn');
      }
      if (this.actionsLeft <= 0) {
        // 切嗣还有本轮免费移动时，保留回合让玩家/ AI 决定是否使用。
        if (this.hasFreeMove(u)) {
          this.current = u;
          this.actionsLeft = 0;
          this.emit();
          return;
        }
        this.tickPoison(u);
        this.current = null;
        this.actionsLeft = 0;
        this.cannotKill = false;
        this.emit();
        this.advance();
      } else {
        if (!extra) this.cannotKill = false;
        this.startAction(u);
        this.emit();
      }
    }

    tickPoison(u) {
      if (!u || u.dead || u.removed || u.downed) return;
      if (!(u.poisonUntil > this.round)) return;
      const src = this.getUnit(u.poisonSrc) || u;
      this.log(`${u.name} 的毒素发作`, 'debuff');
      this.damage(src, u, u.poisonDmg || 0.25, {
        element: 'poison', direct: true, dot: true, ignoreDefense: true, noReduce: true,
        ignoreEvade: true, ignoreVision: true, skill: '山椒鱼毒'
      });
    }

    endRound() {
      if (this.over) return;
      this.log(`第 ${this.round} 回合结束`, 'round');
      this.current = null;
      this.actionsLeft = 0;
      this.units.forEach(u => {
        if (u.dead || u.removed) return;
        if (u.root > 0 && (u.rootAppliedRound || 0) < this.round) u.root -= 1;
        if (u.airborne > 0) u.airborne -= 1;
        if (u.stunTimed && this.round >= u.stunUntil) {
          u.stun = 0; u.stunTimed = false; u.stunUntil = 0;
