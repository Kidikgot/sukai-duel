    if (d <= (u.meleeRange || 1)) return '';
    if (!u.ranged) return '近战只能攻击相邻单位';
    if (d > u.rangedRange) return '超出普攻射程';
    return '';
  }

  function currentTargets() {
    const g = UI.game;
    if (!g || !UI.targetSkill) return [];
    const cur = g.current;
    if (!cur) return [];
    if (UI.targetSkill.kind === 'basic') {
      return g.enemiesOf(cur).filter(t => !basicBlockReason(cur, t));
    }
    if (UI.targetSkill.skill) return g.targetsFor(cur, UI.targetSkill.skill);
    return [];
  }

  function attackRange(cur) {
    if (!cur || !UI.targetSkill) return 0;
    if (UI.targetSkill.kind === 'cell') {
      if (UI.targetSkill.skill.id === 'waterfowl' && (cur.millicentCombo || 0) >= 2) return 2;
      return UI.targetSkill.skill.range || 1;
    }
    if (UI.targetSkill.kind === 'basic') {
      return Math.max(cur.meleeRange || 1, cur.ranged ? (cur.rangedRange || 0) : 0);
    }
    const s = UI.targetSkill.skill;
    if (s && s.id === 'carianPierce') return 3 + ((cur.carianCharges || 0) * 2);
    if (s && s.range > 0 && (s.target === 'enemy' || s.showRange)) return s.range;
    return 0;
  }

  /* ------------------------------ 渲染 ------------------------------ */
  function sync() {
    const g = UI.game;
    if (!g) return;
    renderHeader();
    renderQueue();
    renderTurnCard();
    renderTokens();
    renderCells();
    renderLog();
    renderActionCard();
    renderHint();
    renderConfirm();
    renderBanner();
    if (g.over && !UI.overShown) { /* onGameOver 负责显示 */ }
  }

  function renderHeader() {
    const g = UI.game;
    const alive = team => g.units.filter(u => u.team === team && !u.dead && !u.removed).length;
    $('#roundBadge').textContent = '第 ' + g.round + ' 回合 · 蓝 ' + alive('left') + ' / 红 ' + alive('right') +
      (UI.cloneMode ? ' · 克隆' : '');
    const ab = $('#autoBtn');
    if (ab) {
      ab.classList.toggle('hidden', UI.autoBattle || UI.pvp);
      ab.classList.toggle('active', UI.autoplay && !UI.pvp);
      ab.textContent = UI.autoplay && !UI.pvp ? '手动' : '自动';
    }
  }

  function announceKill(killer, victim, opts) {
    if (!victim) return;
    UI.killQueue.push({ killer, victim, opts: opts || {} });
    if (!UI.killShowing) showNextKill();
  }

  function showNextKill() {
    const b = $('#killBanner');
    if (!b) return;
    if (!UI.killQueue.length) {
      UI.killShowing = false;
      b.classList.remove('show');
      return;
    }
    UI.killShowing = true;
    const entry = UI.killQueue.shift();
    const killer = entry.killer;
    const victim = entry.victim;
    const removed = entry.opts.removed;
    const teamClass = killer && !removed ? ' team-' + killer.team : '';
    b.className = 'kill-banner show' + teamClass;
    if (killer && killer !== victim && !removed) {
      b.innerHTML = '<span class="kill-swords">⚔</span>' +
        '<span class="kill-killer">' + esc(killer.name) + '</span>' +
        '<span class="kill-verb">击败了</span>' +
        '<span class="kill-victim">' + esc(victim.name) + '</span>' +
        (entry.opts.skill ? '<span class="kill-cause">' + esc(entry.opts.skill) + '</span>' : '');
    } else if (removed) {
      b.innerHTML = '<span class="kill-swords">✕</span><span class="kill-victim">' + esc(victim.name) + '</span>' +
        '<span class="kill-verb">被移除</span>';
    } else {
      b.innerHTML = '<span class="kill-swords">✕</span><span class="kill-victim">' + esc(victim.name) + '</span>' +
        '<span class="kill-verb">阵亡</span>';
    }
    clearTimeout(UI.killTimer);
    UI.killTimer = setTimeout(() => {
      b.classList.remove('show');
      UI.killTimer = setTimeout(() => {
        UI.killShowing = false;
        showNextKill();
      }, 240);
    }, 1750);
  }

  function renderBanner() {
    const g = UI.game;
    if (!g.lastDraw || UI.bannerRound === g.round) return;
    UI.bannerRound = g.round;
    flashGranted();
    const d = g.lastDraw;
    const b = $('#banner');
    b.textContent = '第 ' + g.round + ' 回合 · 抽中 ' + d.total + ' 人 · 蓝 ' + d.left + ' / 红 ' + d.right +
      (d.downed ? ' · 倒地 ' + d.downed + ' 人优先' : '') + ' · ' + (d.first === 'left' ? '蓝方' : '红方') + '先手';
    b.classList.add('show');
    clearTimeout(UI.bannerTimer);
    UI.bannerTimer = setTimeout(() => b.classList.remove('show'), 2600);
  }

  function flashGranted() {
    const g = UI.game;
    if (!g) return;
    clearTimeout(UI.grantedTimer);
    const ids = g.queue.filter(id => {
      const u = g.getUnit(id);
      return u && !u.dead && !u.removed;
    });
    UI.grantedIds = new Set(ids);
    renderTokens();
    renderQueue();
    ids.forEach((id, index) => {
      setTimeout(() => {
        if (UI.game !== g) return;
        const u = g.getUnit(id);
        if (!u) return;
        const b = document.createElement('div');
        b.className = 'granted-burst';
        b.style.left = ((u.x + 0.5) / C.W * 100) + '%';
        b.style.top = ((u.y + 0.5) / C.H * 100) + '%';
        $('#fx').appendChild(b);
        setTimeout(() => b.remove(), 950);
      }, index * 55);
    });
    UI.grantedTimer = setTimeout(() => {
      UI.grantedIds.clear();
      renderTokens();
      renderQueue();
    }, 1650);
  }

  function renderQueue() {
    const g = UI.game;
    const box = $('#queueCard');
    if (!g.queue.length) {
      box.innerHTML = '<div class="log-head"><h4>行动队列</h4></div><div class="queue-empty">尚未开始</div>';
      return;
    }
    let html = '<div class="log-head"><h4>行动队列</h4><span class="qt" style="font-size:9px;color:#7f8ca6">' + (g.lastDraw ? '蓝 ' + g.lastDraw.left + ' / 红 ' + g.lastDraw.right : '') + '</span></div><div class="queue-list">';
    g.queue.forEach((id, i) => {
      const u = g.getUnit(id);
      if (!u) return;
      const isCur = g.current === u;
      const granted = UI.grantedIds && UI.grantedIds.has(u.id);
      const done = !isCur && (i < g.qIndex || u.dead || u.removed || (g.timeStop && u.id !== g.timeStop.ownerId && i < g.qIndex));
      html += '<div class="queue-item ' + (u.team === 'right' ? 'right' : '') + (isCur ? ' cur' : '') + (granted ? ' granted' : '') + (done ? ' done' : '') + '">' +
        '<span class="qd"></span><span class="qname">' + esc(u.name) + '</span>' +
        '<span class="qt">' + (u.downed ? '倒地' : (u.frozen ? '冰冻' : 'HP ' + fmt(u.hp))) + '</span></div>';
    });
    html += '</div>';
    box.innerHTML = html;
  }

    if (u.key === 'goetia') chips.push(['人理装填 ×' + (u.humanOrderLoad || 0), 'special']);

    if (u.trueShield > 0) chips.push(['真伤护盾 ×' + u.trueShield, 'special']);
    if (u.stealth > 0 && !u.downed) chips.push(['隐身', 'special']);

    if (u.charge === 'finger') chips.push(['指刺蓄力', 'special']);

  function renderTurnCard() {
    const g = UI.game;
    const box = $('#turnCard');
    const u = g.current;
    if (!u) {
      box.innerHTML = '<div class="turn-top"><div class="turn-glyph" style="--team:#e8c46a">…</div>' +
        '<div class="turn-meta"><div class="nm">结算中</div><div class="rl">等待本回合行动队列</div></div></div>';
      return;
    }
    const hpPct = Math.max(0, Math.min(100, u.hp / u.maxHp * 100));

    const control = (UI.autoBattle || UI.demo) ? 'AI 自动' :
      (UI.pvp ? (isLocalUnit(u) ? '你的单位' : '对手单位') : (u.team === 'left' ? (UI.autoplay ? '自动托管' : '你的单位') : 'AI 控制'));

      '<div class="turn-top">' +
        '<div class="turn-glyph" style="--team:' + (u.team === 'left' ? '#5aa9ff' : '#ff6b6b') + '">' + esc(u.jeep ? '🚙' : u.short) + '</div>' +
        '<div class="turn-meta">' +
          '<div class="nm">' + esc(u.name) + '<span class="team-chip ' + u.team + '">' + (u.team === 'left' ? '蓝方' : '红方') + '</span></div>' +
          '<div class="rl">' + esc(u.role) + ' · ' + control + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="turn-hp"><div class="bar"><i class="' + hpClass(u) + '" style="width:' + hpPct + '%"></i></div>' +

        '<span class="stat">盾 <b>' + fmt(u.shield) + '</b></span>' +

  function renderTokens() {
    const g = UI.game;
    const targets = new Set(currentTargets().map(t => t.id));
    const cur = g.current;
    const playerTurn = cur && isLocalUnit(cur) && !g.over;

    // 移除已死亡/已移除的 token
    UI.tokens.forEach((el, id) => {
      const u = g.getUnit(id);
      if (!u || u.dead || u.removed) {
        el.classList.add('dead');
        setTimeout(() => el.remove(), 320);
        UI.tokens.delete(id);
      }
    });

    g.units.forEach(u => {
      if (u.dead || u.removed) return;
      let el = UI.tokens.get(u.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'token';
        el.dataset.id = u.id;
        el.innerHTML = '<div class="disc"><span class="glyph"></span></div>' +
          '<div class="hpbar"><i></i></div><div class="badges"></div><div class="token-name"></div>' +
          '<div class="king-ammo" aria-hidden="true"></div>';
        el.addEventListener('click', e => {
          e.stopPropagation();
          if (!u.summon) onTokenClick(u.id);
        });
        $('#tokens').appendChild(el);
        UI.tokens.set(u.id, el);
      }
      el.style.left = ((u.x + 0.5) / C.W * 100) + '%';
      el.style.top = ((u.y + 0.5) / C.H * 100) + '%';
      el.style.zIndex = String(10 + u.y + (u.carriedBy ? 1 : 0));

      let cls = 'token team-' + u.team;
      if (u.downed) cls += ' downed';
      if (u.frozen) cls += ' frozen';
      if (u.root > 0) cls += ' rooted';
      if (u.airborne > 0) cls += ' airborne';
      if (u.stun > 0) cls += ' stunned';
      if (u.stealth > 0) cls += ' stealthed';
      if (u.inDungeon) cls += ' in-dungeon';
      if (u.mustDungeon) cls += ' marked';
      if (u.jeep) cls += ' jeep';
      if (u.carriedBy) cls += ' carried';
      if (u.kingAmmo > 0) cls += ' king-armed';
      if (u.summon) cls += ' summon';
      if (UI.grantedIds && UI.grantedIds.has(u.id)) cls += ' granted';
      if (cur === u) cls += ' current';
      if (targets.has(u.id)) cls += ' targetable';
      if (UI.pending && UI.pending.targetId === u.id) cls += ' selected';
      el.className = cls;

      el.querySelector('.glyph').textContent = u.jeep ? '🚙' : u.short;
      el.querySelector('.token-name').textContent = u.name;
      const bar = el.querySelector('.hpbar');
      bar.className = 'hpbar ' + hpClass(u);
      bar.querySelector('i').style.width = Math.max(0, Math.min(100, u.hp / u.maxHp * 100)) + '%';

      const badges = [];
      if (u.inDungeon) badges.push('<span class="badge stealth">地</span>');
      if (u.jeep) badges.push('<span class="badge shield">吉</span>');
      if (u.carriedBy) badges.push('<span class="badge shield">背</span>');
      if (u.carrying) badges.push('<span class="badge shield">护</span>');
      if (u.downed) badges.push('<span class="badge down">倒</span>');
      if (u.frozen) badges.push('<span class="badge frozen">❄</span>');
      if (u.stealth > 0) badges.push('<span class="badge stealth">隐</span>');
      if (u.shield > 0) badges.push('<span class="badge shield">' + fmt(u.shield) + '</span>');
      if (u.invincible > 0) badges.push('<span class="badge shield">无</span>');
      if (u.charge) badges.push('<span class="badge charge">蓄</span>');
      if (u.pendingShot) badges.push('<span class="badge charge">瞄</span>');
      el.querySelector('.badges').innerHTML = badges.slice(0, 4).join('');

      const ammoEl = el.querySelector('.king-ammo');
      const ammo = u.kingAmmo || 0;
      if (ammo > 0) {
        let orbs = '';
        for (let i = 0; i < ammo; i++) {
          orbs += '<i style="--angle:' + (i * 360 / ammo) + 'deg;--delay:' + (i * 0.13) + 's"></i>';
        }
        ammoEl.innerHTML = orbs;
      } else if (ammoEl.innerHTML) {
        ammoEl.innerHTML = '';
      }
    });

    // AI 当前但玩家可查看
    if (!playerTurn && cur) { /* no-op */ }
  }

  function renderCells() {
    const g = UI.game;
    const cur = g.current;
    const isPlayer = cur && isLocalUnit(cur) && !g.over && !UI.autoBattle && !UI.netBusy;
    const canMove = isPlayer && UI.moveMode && !UI.targetSkill && !UI.pending && !cur.downed && !cur.frozen && cur.root <= 0;
    const range = isPlayer ? attackRange(cur) : 0;
    const targets = new Set(currentTargets().map(t => t.id));
    const cellSet = isPlayer && UI.targetSkill && UI.targetSkill.kind === 'cell'
      ? new Set((UI.targetSkill.skill.cells ? UI.targetSkill.skill.cells(g, cur) : [])
        .map(c => c.x + ',' + c.y))
      : null;
    const occupied = new Set();
    g.units.forEach(u => { if (!u.dead && !u.removed) occupied.add(u.x + ',' + u.y); });

    UI.cellEls.forEach(d => {
      const x = +d.dataset.x, y = +d.dataset.y;
      d.classList.remove('can-move', 'can-target', 'can-shop', 'attack-range', 'can-cell-target');
      d.classList.toggle('dungeon', g.isDungeonCell(x, y));
      if (isShop(x, y)) {
        if (isPlayer && !cur.inDungeon && g.nearShop(cur)) d.classList.add('can-shop');
        return;
      }
      const zoneOk = cur && (cur.inDungeon ? g.isDungeonCell(x, y) : !g.isDungeonCell(x, y));
      if (canMove && zoneOk && !occupied.has(x + ',' + y)) d.classList.add('can-move');
      if (cellSet && cellSet.has(x + ',' + y)) d.classList.add('can-cell-target', 'can-target');
      if (isPlayer && range > 0 && zoneOk && cur && g.distXY(cur, x, y) > 0 && g.distXY(cur, x, y) <= range) {
        d.classList.add('attack-range');
      }
      if (isPlayer && targets.size) {
        const has = [...targets].some(id => { const u = g.getUnit(id); return u && u.x === x && u.y === y; });
        if (has) d.classList.add('can-target');
      }
    });
  }

  function renderLog() {

    let html = '<div class="log-head"><h4>战报</h4><span style="font-size:9px;color:#5f6d88">第 ' + g.round + ' 回合</span></div><div class="log-body">';

      html += '<div class="log-line ' + l.cls + '"><span class="rd">R' + l.round + '</span>' + esc(l.msg) + '</div>';

    }
    const nb = box.querySelector('.log-body');
    if (nb) nb.scrollTop = nb.scrollHeight;
    box.querySelector('.log-head span').textContent = '第 ' + g.round + ' 回合';

        '<div class="buff-row" style="margin-top:8px">' + statusChips(u) + '</div>';
      return;
    }
    if (UI.pvp && UI.netBusy) {
      box.innerHTML = '<div class="action-title">行动 <span>' + esc(u.name) + '</span></div>' +

    if (UI.demo || UI.autoBattle || (!UI.pvp && (u.team === 'right' || (u.team === 'left' && UI.autoplay)))) {
      const label = UI.autoBattle ? '自动对战中…' : (u.team === 'left' ? '自动托管中…' : 'AI 正在决策…');
      box.innerHTML = '<div class="action-title">行动 <span>' + esc(u.name) + '</span></div>' +
        '<div class="ai-thinking"><span class="dots"><i></i><i></i><i></i></span> ' + label + '</div>' +
        '<div class="buff-row" style="margin-top:8px">' + statusChips(u) + '</div>';
      return;
    }

    if (g.actionsLeft <= 0) {
      const canFree = g.hasFreeMove(u);
      box.innerHTML = '<div class="action-title">行动 <span>' + esc(u.name) + ' · 行动点已用完</span></div>' +
        '<div class="move-tip">' + (canFree ? '固有时制御仍可免费移动 1 次。' : '结束本回合。') + '</div>' +
        '<div class="actions">' +
        (canFree ? '<button class="btn primary" data-act="freeMove">固有时制御·免费移动</button>' : '') +
        '<button class="btn" data-act="endTurn">结束回合</button></div>';
      return;
    }

    if (u.stun > 0 && !u.downed) {
      const timed = !!u.stunTimed;
      box.innerHTML = '<div class="action-title">眩晕 <span>' + esc(u.name) + ' · ' +
        (timed ? '持续到下回合结束' : '剩余 ' + u.stun + ' 层') + '</span></div>' +
        '<div class="move-tip">' + (timed ? '花 1 次行动可解除；未解除前不能移动、普攻或使用技能。' : '每层眩晕需要消耗 1 次行动解除；解除完才能移动、普攻或使用技能。') + '</div>' +
        '<div class="actions"><button class="btn primary" data-act="breakStun">' + (timed ? '解除眩晕（消耗行动）' : '解除一层眩晕（消耗行动）') + '</button></div>';
      return;
    }

    if (UI.moveMode) {
      box.innerHTML = '<div class="action-title">移动 <span>选择落点</span></div>' +
        '<div class="move-tip"><b>点击棋盘上的空格</b>移动。商店格不可通行；按 Esc 或下方按钮取消。</div>' +
        '<div class="actions"><button class="btn ghost" data-act="cancelMove">取消移动</button></div>';
      return;
    }

    if (u.mustDungeon && !u.inDungeon && u.root > 0) {
      box.innerHTML = '<div class="action-title">地牢点名 <span>' + esc(u.name) + '</span></div>' +
        '<div class="move-tip">你被 VAN 点名：本回合必须先解除禁锢，否则无法行动；下一次行动将被强制带入地牢。</div>' +
        '<div class="actions"><button class="btn primary" data-act="breakRoot">解除禁锢（消耗行动）</button></div>';
      return;
    }

    // 玩家行动
    let html = '<div class="action-title">行动 <span>' + esc(u.name) + ' · 剩余 ' + g.actionsLeft + ' 次</span></div><div class="actions">';
    if (u.inDungeon) {
      html += '<div class="move-tip"><b>地牢决斗中</b>：技能、被动与道具被封印，只能普攻或在地牢内移动；直到一方彻底死亡才会结束。</div>';
    }

    if (u.downed) {
      html += '<button class="btn primary" data-act="stand">起身（恢复 ' + fmt(Math.max(0.5, u.maxHp / 2)) + ' 血，解除眩晕）</button>';
      (WX.UNITS[u.key].skills || []).filter(s => s.id === 'selfCut' || s.id === 'renDe').forEach(s => {
        if (s.id === 'renDe') {
          const allies = g.targetsFor(u, s).filter(t => t.id !== u.id);
          if (!allies.length) return;
          html += '<button class="btn skill-btn ready" data-skill="' + s.id + '">' +
            '<span class="sk-name">' + esc(s.name) + '</span><span class="sk-meta">转移行动并起身</span></button>';
        } else {
          const e = g.skillReady(u, s, {});
          html += '<button class="btn skill-btn' + (e === true ? ' ready' : '') + '" data-skill="' + s.id + '"' +
            (e === true ? '' : ' disabled') + '><span class="sk-name">' + esc(s.name) + '</span><span class="sk-meta">倒地时可用</span></button>';
        }
      });
    } else if (u.frozen) {
      html += '<button class="btn primary" data-act="unfreeze">解冻（消耗本次行动）</button>';
    } else {
      if (u.root > 0) html += '<button class="btn" data-act="breakRoot">解除禁锢（消耗行动）</button>';
      if (u.pendingShot) {
        const shotLabel = u.pendingShot.kind === 'king'
          ? '王之号炮 ×' + u.pendingShot.n
          : (u.pendingShot.burn ? '燃烧坚果' : '命中');
        html += '<button class="btn primary" data-act="shot">结算射击（' + shotLabel + '）</button>';
      }

      // 移动
      const canMove = u.root <= 0;
      html += '<button class="btn move-btn" data-act="move"' + (canMove ? '' : ' disabled') +
        ' title="' + (canMove ? '选择移动落点' : '被禁锢，无法移动，请先解除') + '">' +
        '<span class="sk-name">移动</span><span class="sk-meta">点击棋盘空格选落点</span></button>';
      if ((u.freeMoveUntil || 0) >= g.round && (u.freeMoveRound || 0) < g.round && !u.inDungeon) {
        html += '<button class="btn" data-act="freeMove"><span class="sk-name">固有时制御·免费移动</span>' +
          '<span class="sk-meta">本轮 1 次，不消耗步数</span></button>';
      }

      // 普攻
      const bt = g.enemiesOf(u).filter(t => !basicBlockReason(u, t));
      html += '<button class="btn" data-act="basic"' + (bt.length ? '' : ' disabled') + '>' +
        '<span class="sk-name">普攻</span><span class="sk-meta">' +
        (u.ranged ? '近 ' + fmt(u.melee) + ' / 远 ' + fmt(u.ranged) + '（射程 ' + u.rangedRange + '）' : '近战 ' + fmt(u.melee) + (u.basicHits > 1 ? '×' + u.basicHits : '')) +
        '</span></button>';

      // 技能
      (WX.UNITS[u.key].skills || []).concat(u.copiedSkills || []).forEach(s => {
        if (u.inDungeon) return;
        if (s.hidden && (!s.available || !s.available(g, u))) return;
        if (s.tiers) {
          s.tiers.forEach((t, idx) => {
            const tier = idx + 1;
            const e = g.skillReady(u, s, { tier });
            const name = s.name + ' · ' + t.cost + ' 层';
            const meta = fmt(t.dmg) + ' 直伤';
            html += '<button class="btn skill-btn' + (e === true ? ' ready' : '') + '" data-skill="' + s.id + '" data-tier="' + tier + '"' +
              (e === true ? '' : ' disabled') + ' title="' + esc(e === true ? s.desc : e) + '">' +
              '<span class="sk-name">' + esc(name) + '</span><span class="sk-meta">' + meta + '</span></button>';
          });
        } else {
          const e = g.skillReady(u, s, {});
          const needsTarget = s.target === 'enemy' || s.target === 'ally' || s.target === 'any';
          const list = needsTarget ? g.targetsFor(u, s) : [];
          const noTarget = !needsTarget && s.targets && s.targets(g, u).length === 0;
          const ok = e === true && (!needsTarget || list.length > 0) && !noTarget;
          const meta = [];
          if (s.range) meta.push(s.rangeLabel ? s.rangeLabel : '射程 ' + s.range);
          if (s.cd) meta.push('CD ' + s.cd);
          const hint = e !== true ? e : (needsTarget && !list.length ? '射程内无目标' : (noTarget ? '没有可选目标' : s.desc));
          html += '<button class="btn skill-btn' + (ok ? ' ready' : '') + '" data-skill="' + s.id + '"' +
            (ok ? '' : ' disabled') + ' title="' + esc(hint) + '">' +
            '<span class="sk-name">' + esc(s.name) + '</span><span class="sk-meta">' + meta.map(esc).join(' ') + '</span></button>';
        }
      });

      // 道具
      if (!u.inDungeon && u.items.blood > 0) {
        html += '<div class="shop-item"><span class="nm">血包 ×' + u.items.blood + '</span>' +
          '<button class="btn small" data-act="item" data-item="blood"' + (u.hp >= u.maxHp ? ' disabled' : '') + '>食用</button></div>';
      }
      if (!u.inDungeon && u.items.shield > 0) {
        const cap = Math.max(1, u.shieldCap);
        html += '<div class="shop-item"><span class="nm">盾 ×' + u.items.shield + '</span>' +
          '<button class="btn small" data-act="item" data-item="shield"' + (u.shield >= cap ? ' disabled' : '') + '>套盾</button></div>';
      }

      // 商店
      if (!u.inDungeon && (g.nearShop(u) || u.key === 'muramasa')) {
        const ownShop = u.key === 'muramasa';
        html += '<div class="shop-box"><h4>' + (ownShop ? '村正自带商店' : '商店（相邻）') + '</h4>';
        const bladeLocked = u.key !== 'muramasa' && g.units.some(x => x.key === 'muramasa' && x.team !== u.team && !x.dead && !x.removed);
        ['blood', 'shield', 'knife', 'gun', 'sword'].forEach(k => {
          const it = C.ITEMS[k];
          const owned = (k === 'knife' && u.knife.owned) || (k === 'gun' && u.gun) || (k === 'sword' && u.sword);
          const isSwordBlocked = k === 'sword' && (u.key === 'trainer' || (u.melee || 0) >= 1);
          const blocked = (k === 'knife' && bladeLocked) || isSwordBlocked;
          const blockLabel = k === 'knife' ? '村正专属' : (u.key === 'trainer' ? '健身不可购买' : '近战已≥1');
          html += '<div class="shop-item"><span class="nm">' + it.icon + ' ' + it.name + '</span>' +
            '<span class="price">免费</span>' +
            '<button class="btn small" data-act="buy" data-item="' + k + '"' + (owned || blocked ? ' disabled' : '') + '>' +
            (owned ? '已购' : blocked ? blockLabel : '购买') + '</button></div>';
        });
        if (ownShop) {
          const it = C.ITEMS.muramasaBlade;
          const can = u.knife.owned && !u.knife.special;
          html += '<div class="shop-item"><span class="nm">' + it.icon + ' ' + it.name + '</span>' +
            '<span class="price">免费</span>' +
            '<button class="btn small" data-act="buy" data-item="muramasaBlade"' + (can ? '' : ' disabled') + '>' +
            (u.knife.special ? '已升级' : '升级') + '</button></div>';
        }
        html += '</div>';
      }

      html += '<button class="btn ghost" data-act="pass">原地待命</button>';
    }
    html += '</div>';
    box.innerHTML = html;
  }

  function renderHint() {
    const g = UI.game;
    const cur = g.current;
    let text = '';
    if (g.over) text = '对局结束 — 点击「再战一局」或「查看战报」。';
    else if (UI.demo) text = '演示对局：双方由 AI 操作。';
    else if (UI.autoBattle) text = '自动对战：双方 AI 对战中，结束后自动生成战报。';
    else if (UI.autoplay) text = '自动模式：AI 正在替你行动（点顶栏「手动」可接管）。';
    else if (UI.pending) text = '';
    else if (UI.targetSkill) text = '请选择目标（高亮单位），然后确认。按 Esc 取消。';
    else if (UI.moveMode) text = '移动模式：点击棋盘上的空格选择落点。按 Esc 取消。';
    else if (!cur) text = '结算中…';
    else if (UI.pvp && UI.netBusy) text = '已发送操作，等待房主结算…';
    else if (UI.pvp && !isLocalUnit(cur)) text = '等待对手行动…';
    else if (!UI.pvp && cur.team === 'right') text = 'AI 正在行动…';
    else if (cur.inDungeon) text = '地牢决斗：外界无法干扰，直到一方彻底死亡。';
    else if (cur.downed) text = '你已倒地：唯一选项是起身，恢复最大生命的一半并解除眩晕。';
    else if (cur.frozen) text = '冰冻：本次行动只能解冻。';
    else if (cur.mustDungeon) text = '被地牢点名：下一次行动必须前往地牢。';
    else text = '点「移动」选择落点，点敌人普攻，或使用右侧技能。';
    $('#hintBar').textContent = text;
  }

  function renderConfirm() {
    const g = UI.game;
    const bar = $('#confirmBar');
    if (!UI.pending || !g.current) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
    const t = g.getUnit(UI.pending.targetId);
    const label = UI.pending.kind === 'basic' ? '普攻' :
      (WX.UNITS[g.current.key].skills.find(s => s.id === UI.pending.id) || {}).name || '技能';
    bar.innerHTML = '<span>' + esc(label) + ' → <span class="target-name">' + esc(t ? t.name : '目标') + '</span></span>' +
      '<button class="btn primary small" id="confirmYes">确认</button>' +
      '<button class="btn ghost small" id="confirmNo">取消</button>';
    bar.classList.remove('hidden');
    $('#confirmYes').onclick = confirmPending;
    $('#confirmNo').onclick = clearModes;
  }

  function confirmPending() {
    const g = UI.game;
    const p = UI.pending;
    const cur = g.current;
    if (!p || !cur) return;
    let res;
    if (p.kind === 'basic') res = g.basicAttack(cur, p.targetId);
    else res = g.useSkill(cur, p.id, p.targetId, { tier: p.tier });
    if (res && res.error) { toast(res.error); return; }
    UI.pending = null; UI.targetSkill = null; UI.moveMode = false;
    sync();
  }

  function clearModes() {
    UI.pending = null;
    UI.targetSkill = null;
    UI.moveMode = false;
    UI.mode = 'player';
    sync();
  }

  function runAction(res) {
    if (res && res.error) { toast(res.error); return false; }
    UI.pending = null; UI.targetSkill = null; UI.moveMode = false;
    sync();
    return true;
  }

  /* ------------------------------ 弹出层 ------------------------------ */
  function showUnitByKey(key) {
    const def = WX.UNITS[key];
    const fake = {
      key, name: def.name, short: def.short, role: def.role, color: def.color,
      maxHp: def.hp, hp: def.hp, melee: def.melee, ranged: def.ranged,
      rangedRange: def.rangedRange, shield: def.shield || 0,
      knife: { owned: false, used: false }, items: { blood: 0, shield: 0 }
    };
    showUnit(fake, true);
  }

  function showUnit(u, defOnly) {

    const box = $('#unitModalBody');
    let html = '<div class="detail-top"><div class="detail-glyph" style="--c:' + def.color + '">' + esc(def.short) + '</div>' +
      '<div><div class="detail-name">' + esc(def.name) + '</div><div class="detail-role">' + esc(def.title || def.role) + ' · ' + esc(def.role) + '</div></div></div>';
    if (def.quote) html += '<div class="detail-quote">「' + esc(def.quote) + '」</div>';
    html += '<div class="detail-stats">' +
      '<span class="stat">HP <b>' + def.hp + '</b></span>' +
      '<span class="stat">近战 <b>' + fmt(def.melee || 0) + '</b>' +
        ((def.meleeRange || 1) > 1 ? '（射程 ' + def.meleeRange + '）' : '') + '</span>' +
      (def.ranged ? '<span class="stat">远程 <b>' + fmt(def.ranged) + '</b>（射程 ' + (def.rangedRange || 3) + '）</span>' : '') +
      (def.shield ? '<span class="stat">初始护盾 <b>' + def.shield + '</b></span>' : '') +
      '</div>';
    if (!defOnly && u.id && UI.game) {
      html += '<div class="detail-stats">' +
        '<span class="stat">当前 HP <b>' + fmt(u.hp) + ' / ' + u.maxHp + '</b></span>' +
        '<span class="stat">护盾 <b>' + fmt(u.shield) + '</b></span>' +
        '<span class="stat">装备 <b>' + ([u.gun ? '枪' : '', u.sword ? '刀' : '', u.knife.owned ? '名刀' : ''].filter(Boolean).join('/') || '无') + '</b></span>' +
        '<span class="stat">击杀 <b>' + (u.kills ? u.kills.length : 0) + '</b></span>' +
        '</div>';
    }
    let passives = (WX.PASSIVES && WX.PASSIVES[def.key]) || def.passives || [];
    if (u && u.copiedPassive) passives = [u.copiedPassive].concat(passives);
    passives.forEach(p => {
      html += '<div class="detail-skill"><div class="sk-h"><b>被动 · ' + esc(p.name) + '</b></div>' +
        '<p>' + esc(p.desc || '') + '</p></div>';
    });
    (def.skills || []).concat(u && u.copiedSkills ? u.copiedSkills : []).forEach(s => {
      const meta = [];
      if (s.range) meta.push(s.rangeLabel ? s.rangeLabel : '射程 ' + s.range);
      if (s.cd) meta.push('CD ' + s.cd);
      if (s.once) meta.push('本局限一次');
      if (s.tiers) meta.push('消耗 1/2/3 层');
      html += '<div class="detail-skill"><div class="sk-h"><b>' + esc(s.name) + '</b><span>' + meta.map(esc).join(' · ') + '</span></div>' +
        '<p>' + esc(s.desc) + '</p></div>';
    });
    if (def.key === 'solomon') {
      const go = WX.UNITS.goetia;
      html += '<div class="detail-skill" style="border-color:#d9a35f"><div class="sk-h"><b>变身形态 · ' + esc(go.name) + '</b><span>' + esc(go.title) + '</span></div>' +
        '<p>HP ' + go.hp + ' · 近战 ' + fmt(go.melee) + '；与所罗门的血量、CD 互相独立，不进入可选角色列表。</p></div>';
      (WX.PASSIVES.goetia || []).forEach(p => {
        html += '<div class="detail-skill"><div class="sk-h"><b>被动 · ' + esc(p.name) + '</b></div><p>' + esc(p.desc) + '</p></div>';
      });
      (go.skills || []).forEach(s => {
        const meta = [];
        if (s.cd) meta.push('CD ' + s.cd);
        html += '<div class="detail-skill"><div class="sk-h"><b>' + esc(s.name) + '</b><span>' + meta.join(' · ') + '</span></div><p>' + esc(s.desc) + '</p></div>';
      });
    }
    if (!defOnly && u.id && UI.game) {
      const chips = statusChips(u);
      if (chips) html += '<div class="buff-row" style="margin-top:10px">' + chips + '</div>';

    $('#unitModalTitle').textContent = def.name;
    box.innerHTML = html;
    $('#unitModal').classList.remove('hidden');
  }

  function buildLeague() {
    const body = $('#leagueBody');
    const L = WX.LEAGUE;
    if (!L || !L.ranking || !L.ranking.length) {
      body.innerHTML = '<p>暂无榜单数据。请先运行 <code>node tools/duel-league.js</code>。</p>';
      return;
    }
    let html = '<div class="league-summary"><b>' + L.ranking.length + ' 人单挑榜</b>' +
      '<span>每对 ' + L.gamesPerPair + ' 局 · 共 ' + L.totalGames + ' 局 · 胜场差 ≤' + L.drawBand + ' 判平 · 胜率两位小数</span></div>';
    html += '<div class="report-table-wrap"><table class="report-table league-table"><thead><tr>' +
      '<th>排名</th><th>角色</th><th class="num">积分</th><th>对局 优/平/劣</th><th class="num">胜率</th></tr></thead><tbody>';
    L.ranking.forEach((r, i) => {
      html += '<tr class="league-row' + (i === 0 ? ' mvp' : '') + '" data-league-key="' + esc(r.key) + '">' +
        '<td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td>' +
        '<td class="num">' + r.points + '</td>' +
        '<td>' + r.pairWins + '/' + r.pairDraws + '/' + r.pairLosses + '</td>' +
        '<td class="num">' + (r.winRate * 100).toFixed(2) + '%</td></tr>';
    });
    html += '</tbody></table></div><div id="leagueDetail" class="league-detail">点击上方角色查看对位详情。</div>';
    body.innerHTML = html;
  }

  function showLeagueDetail(key) {
    const L = WX.LEAGUE, box = $('#leagueDetail');
    if (!box || !L) return;
    const rank = new Map(L.ranking.map((r, i) => [r.key, i + 1]));
    const row = L.ranking.find(r => r.key === key);
    if (!row) return;
    const rows = [];
    L.matchups.forEach(m => {
      if (m.a !== key && m.b !== key) return;
      const other = m.a === key ? m.b : m.a;
      const me = m.a === key ? m.aWins : m.bWins;
      const op = m.a === key ? m.bWins : m.aWins;
      const pts = m.a === key ? m.aPts : m.bPts;
      rows.push({ other, me, op, pts, rate: me / L.gamesPerPair });
    });
    rows.sort((a, b) => (rank.get(a.other) || 99) - (rank.get(b.other) || 99));
    let html = '<div class="league-detail-head"><b>' + esc(row.name) + '</b>' +
      '<span>第 ' + rank.get(key) + ' 名 · ' + row.points + ' 分 · 胜率 ' + (row.winRate * 100).toFixed(2) + '%</span></div>';
    html += '<div class="report-table-wrap"><table class="report-table"><thead><tr>' +
      '<th>对手</th><th class="num">胜率</th><th class="num">战绩</th><th>结果</th></tr></thead><tbody>';
    rows.forEach(x => {
      const result = x.pts === 2 ? '优' : x.pts === 1 ? '平' : '劣';
      html += '<tr><td>' + esc(rank.get(x.other) + '. ' + (L.ranking.find(r => r.key === x.other) || {}).name) + '</td>' +
        '<td class="num">' + (x.rate * 100).toFixed(2) + '%</td>' +
        '<td class="num">' + x.me + ' : ' + x.op + '</td><td>' + result + '</td></tr>';
    });
    html += '</tbody></table></div>';
    box.innerHTML = html;
  }

  function buildRules() {
    const body = $('#rulesBody');
    let html = '';
    html += '<h3>行动顺序</h3><ul>' +

  /* ------------------------------ 战报 ------------------------------ */
  function openReport() {
    if (!UI.game) { toast('还没有开始对局'); return; }
    const r = WX.Report.build(UI.game, {
      autoBattle: UI.autoBattle, demo: UI.demo, pvp: UI.pvp,
      mode: UI.matchMode, clone: UI.cloneMode
    });
    UI.lastReport = { data: r, markdown: r.markdown };
    $('#reportBody').innerHTML = r.html;
    $('#reportModal').classList.remove('hidden');
  }

  function reportStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function copyReport() {
    if (!UI.lastReport) return;
    const md = UI.lastReport.markdown;
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = md;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('战报已复制到剪贴板'); }
      catch (e) { toast('复制失败，请手动选择文本'); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(() => toast('战报已复制到剪贴板')).catch(fallback);
    } else fallback();
  }

  function downloadReport() {
    if (!UI.lastReport) return;
    const blob = new Blob(['\ufeff' + UI.lastReport.markdown], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '速开对决-战报-' + reportStamp() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1200);
    toast('战报开始下载');
  }

  function showGameOver(winner) {
    const g = UI.game;
    if (!g) return;
    if (UI.demo && !UI.autoBattle) return;
    UI.overShown = true;
    const title = winner === 'left' ? '蓝方获胜' : winner === 'right' ? '红方获胜' : '平局';
    const left = g.units.filter(u => u.team === 'left');
    const right = g.units.filter(u => u.team === 'right');
    const aliveL = left.filter(u => !u.dead && !u.removed).length;
    const aliveR = right.filter(u => !u.dead && !u.removed).length;
    const killsL = left.reduce((s, u) => s + u.kills.length, 0);
    const killsR = right.reduce((s, u) => s + u.kills.length, 0);
    $('#overTitle').textContent = title;
    if (UI.autoBattle) $('#overText').textContent = '本局由双方 AI 自动完成，可查看并导出完整战报。';
    else if (winner === 'draw') $('#overText').textContent = '双方都没能站到最后。';
    else $('#overText').textContent = winner === 'left' ? '你的队伍清除了所有敌人。' : 'AI 的队伍赢下了这场对决。';
    $('#overStats').innerHTML =
      '<div><b>' + g.round + '</b>回合</div>' +
      '<div><b>' + aliveL + ' : ' + aliveR + '</b>存活</div>' +
      '<div><b>' + killsL + ' : ' + killsR + '</b>击杀</div>';
    $('#reportOverBtn').classList.remove('hidden');
    $('#gameOver').classList.remove('hidden');
  }

  function onGameOver(winner) {
    const g = UI.game;
    setTimeout(() => {
      if (UI.game !== g) return;
      showGameOver(winner);
      if (UI.autoBattle) {
        setTimeout(() => { if (UI.game === g) openReport(); }, 700);
      }
    }, 900);
    if (UI.demo && !UI.autoBattle) {
      setTimeout(() => {
        if (UI.game !== g) return;
        const pool = WX.ROSTER.slice();
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        startGame(pool.slice(0, 4), pool.slice(4, 8));
      }, 3600);
    }
  }

  function playSkillFx(u, skill, target, res) {
    if (!u || !skill) return;
    const host = $('#skillFx') || $('#fx');
    if (!host) return;
    let meta = SKILL_FX[skill.id] || { shape: 'burst', color: '#e8f4ff', glyph: skill.name.slice(0, 1), atTarget: !!target };
    if (skill.id === 'meteorVolcano' && u.meteorCharge === 1) {
      meta = { shape: 'charge', color: '#ff9b45', glyph: '蓄', atTarget: false };
    }
    if (skill.id === 'enumaElish') {
      meta = u.gilEnuma
        ? { shape: 'charge', color: '#ff4b4b', glyph: '蓄', atTarget: false }
        : { shape: 'laser', color: '#ff2d2d', glyph: '乖', atTarget: true };
    }
    const anchor = meta.atTarget && target ? target : u;
    const style = `left:${((anchor.x + 0.5) / C.W * 100)}%;top:${((anchor.y + 0.5) / C.H * 100)}%;` +
      `--fx:${meta.color};--fx2:${meta.color};`;

    const wrap = document.createElement('div');
    wrap.className = 'skill-fx shape-' + meta.shape;
    wrap.setAttribute('style', style);
    let rays = '';
    for (let i = 0; i < 16; i++) rays += '<i style="--a:' + (i * 22.5 + 5) + 'deg"></i>';
    wrap.innerHTML = '<i class="fx-aura"></i><i class="fx-seal">' + esc(u.short || '') + '</i>' +
      '<span class="fx-rays">' + rays + '</span>' +
      '<i class="fx-core"></i><i class="fx-ring"></i><i class="fx-ring second"></i><i class="fx-ring third"></i>' +
      '<span class="fx-glyph">' + esc(meta.glyph) + '</span>' +
      '<span class="fx-name">' + esc(skill.name) + '</span>';
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('i');
      p.className = 'fx-particle';
      p.style.setProperty('--a', (i * 15 + 7) + 'deg');
      p.style.setProperty('--d', (38 + (i % 7) * 12) + 'px');
      p.style.setProperty('--s', (0.55 + (i % 4) * 0.28).toFixed(2));
      wrap.appendChild(p);
    }
    host.appendChild(wrap);
    if (skill.id === 'goetiaRaze') playGoetiaRazeFx();
    skillTitle(u, skill, meta);
    const strong = !!meta.global || ['fire', 'shock', 'gravity', 'chains', 'moon', 'slash', 'flurry', 'blade', 'laser'].includes(meta.shape);
    skillFlash(meta.color, strong);
    if (strong) shakeBoard(meta.global ? 'big' : '');
    if (skill.id === 'flurry') spawnComboFx(anchor, 'combo-fist', '#ffd166');
    if (skill.id === 'waterfowl') spawnComboFx(anchor, 'combo-blade', meta.color);
    if (skill.id === 'enumaElish' && !u.gilEnuma && target) {
      spawnEnumaLaser(u, target, meta.color);
    }
    setTimeout(() => wrap.remove(), 1700);

    if (meta.beam && target && target !== u) {
      spawnSkillBeam(u, target, meta.color);
      spawnSkillImpact(target, meta);
    }
    if (meta.global) {
      const g = document.createElement('div');
      g.className = 'skill-global';
      g.style.setProperty('--fx', meta.color);
      host.appendChild(g);
      setTimeout(() => g.remove(), 1250);
    }
    if (skill.id === 'meteorVolcano' && u.lastMeteorCells && u.meteorCharge === 0) {
      u.lastMeteorCells.forEach((c, i) => {
        setTimeout(() => spawnSkillImpact({ x: c.x, y: c.y }, { shape: 'fire', color: meta.color }), i * 180);

  }

  function pvpSend(obj) {
    if (!UI.pvpConn) return false;
    try {
      UI.pvpConn.send(obj);
      return true;
    } catch (e) {
      return false;
    }
  }

  function pvpSerialize(name, args) {
    const u = args[0];
    const out = [u && u.id];
    if (name === 'move') out.push(args[1], args[2]);
    else if (name === 'basicAttack') out.push(args[1]);
    else if (name === 'useSkill') out.push(args[1], args[2] || null, args[3] || {});
    else if (name === 'buy' || name === 'useItem') out.push(args[1]);
    return out;
  }

  function pvpCall(game, data) {
    if (!game || !data || !Array.isArray(data.args)) return { error: '无效动作' };
    const u = game.getUnit(data.args[0]);
    if (!u) return { error: '单位不存在' };
    const a = data.args.slice(1);
    switch (data.name) {
      case 'move': return game.move(u, a[0], a[1]);
      case 'basicAttack': return game.basicAttack(u, a[0]);
      case 'useSkill': return game.useSkill(u, a[0], a[1], a[2] || {});
      case 'stand': return game.stand(u);
      case 'unfreeze': return game.unfreeze(u);
      case 'breakRoot': return game.breakRoot(u);
      case 'resolveShot': return game.resolveShot(u);
      case 'pass': return game.pass(u);
      case 'buy': return game.buy(u, a[0]);
      case 'useItem': return game.useItem(u, a[0]);
      default: return { error: '未知动作' };
    }
  }

  function pvpInstall(game) {
    if (!game || game._pvpInstalled) return;
    game._pvpInstalled = true;
    const methods = ['move', 'basicAttack', 'useSkill', 'stand', 'unfreeze', 'breakRoot', 'resolveShot', 'pass', 'buy', 'useItem'];
    methods.forEach(name => {
      const orig = game[name].bind(game);
      game[name] = function (...args) {
        if (UI.pvp && !UI.netApply) {
          if (UI.pvpRole === 'guest') {
            if (UI.netBusy) return { error: '等待房主结算' };
            const data = { t: 'action', name, args: pvpSerialize(name, args) };
            UI.netBusy = true;
            UI.pending = null;
            UI.targetSkill = null;
            UI.moveMode = false;
            pvpSend(data);
            sync();
            return { ok: true, pending: true };
          }
          if (UI.pvpRole === 'host') {
            UI.netApply = true;
            let res;
            try { res = orig(...args); }
            finally { UI.netApply = false; }
            if (!(res && res.error)) pvpSend({ t: 'action', name, args: pvpSerialize(name, args) });
            return res;
          }
        }
        return orig(...args);
      };
    });
  }

  function pvpApplyRemote(data) {
    const g = UI.game;
    if (!g) return;
    UI.netApply = true;
    let res;
    try { res = pvpCall(g, data); }
    finally { UI.netApply = false; }
    UI.netBusy = false;
    if (res && res.error) toast(res.error);
    sync();
  }

  function pvpHostData(data) {
    if (!data || !data.t) return;
    if (data.t === 'hello') {
      pvpSend({ t: 'welcome', mode: UI.matchMode });
      pvpStatus('对手已连接，等待准备');
      return;
    }
    if (data.t === 'ready') {
      UI.pvpGuestKeys = data.keys || [];
      UI.pvpGuestReady = true;
      pvpStatus('对手已准备，点击「开始对战」');
      pvpUpdateUI();
      return;
    }
    if (data.t === 'action') {
      const g = UI.game;
      if (!g) return;
      UI.netApply = true;
      let res;
      try { res = pvpCall(g, data); }
      finally { UI.netApply = false; }
      if (res && res.error) {
        pvpSend({ t: 'error', message: res.error });
        toast(res.error);
      } else {
        pvpSend({ t: 'action', name: data.name, args: data.args });
        sync();
      }
      return;
    }
    if (data.t === 'bye') {
      pvpStatus('对手已离开房间');
      toast('对手已离开房间');
    }
  }

  function pvpGuestData(data) {
    if (!data || !data.t) return;
    if (data.t === 'welcome') {
      UI.pvpWelcome = true;
      UI.matchMode = MODES[data.mode] ? data.mode : 'classic';
      const max = MODES[UI.matchMode].max;
      if (UI.selected.size > max) UI.selected = new Set([...UI.selected].slice(0, max));
      buildRoster();
      updatePickCount();
      pvpStatus('已加入房间，请选人并准备');
      pvpUpdateUI();
      return;
    }
    if (data.t === 'init') {
      pvpGuestStart(data);
      return;
    }
    if (data.t === 'action') {
      pvpApplyRemote(data);
      return;
    }
    if (data.t === 'error') {
      UI.netBusy = false;
      toast(data.message || '房主拒绝了该操作');
      sync();
      return;
    }
    if (data.t === 'bye') {
      pvpStatus('房主已离开房间');
      toast('房主已离开房间');
    }
  }

  function pvpWire(conn) {
    conn.on('data', data => {
      if (UI.pvpRole === 'host') pvpHostData(data);
      else pvpGuestData(data);
    });
    conn.on('open', () => {
      clearTimeout(UI.pvpConnTimer);
      UI.pvpConnTimer = null;
      if (UI.pvpRole === 'host') pvpSend({ t: 'welcome', mode: UI.matchMode });
      else pvpSend({ t: 'hello' });
    });
    conn.on('close', () => {
      if (UI.pvpConn !== conn) return;
      if (!UI.pvp) return;
      pvpStatus('连接已断开');
      toast('联机连接已断开');
    });
    conn.on('error', err => {
      pvpStatus('连接错误：' + (err && err.type ? err.type : '未知'));
    });
  }

  function pvpSignalTopic() {
    return PVP_TOPIC_PREFIX + UI.pvpCode;
  }

  function pvpSignalPublish(data) {
    if (!UI.pvpCode) return;
    data.code = UI.pvpCode;
    fetch(PVP_SIGNAL_BASE + pvpSignalTopic(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    }).catch(() => {});
  }

  function pvpSignalSubscribe() {
    clearTimeout(UI.pvpPollTimer);
    clearTimeout(UI.pvpWSRetryTimer);
    if (UI.pvpES) { try { UI.pvpES.close(); } catch (e) {} }
    UI.pvpES = null;
    if (UI.pvpWS) { try { UI.pvpWS.close(); } catch (e) {} }
    UI.pvpWS = null;
    try {
      const ws = new WebSocket(PVP_SIGNAL_WS + pvpSignalTopic() + '/ws');
      UI.pvpWS = ws;
      ws.onopen = () => {
        pvpStartRelay();
      };
      ws.onmessage = ev => {
        let env;
        try { env = JSON.parse(ev.data); } catch (e) { return; }
        if (!env || (env.event && env.event !== 'message')) return;
        if (typeof env.message !== 'string') return;
        let data;
        try { data = JSON.parse(env.message); } catch (e) { return; }
        if (!data || !data.kind) return;
        pvpSignalHandle(data);
      };
      ws.onerror = () => {
      };
      ws.onclose = () => {
        if (UI.pvpWS !== ws) return;
        UI.pvpWS = null;
        if (!UI.pvpRole) return;
        pvpStatus('WebSocket 信令中断，切换 HTTPS 流…');
        pvpStartSSE();
      };
    } catch (e) {
      pvpStartSSE();
    }
  }

  function pvpStartSSE() {
    if (!UI.pvpRole || !UI.pvpCode) return;
    if (UI.pvpES) { try { UI.pvpES.close(); } catch (e) {} }
    try {
      const es = new EventSource(PVP_SIGNAL_BASE + pvpSignalTopic() + '/sse');
      UI.pvpES = es;
      es.onopen = () => {
        pvpStatus('HTTPS 信令已连接');
        pvpStartRelay();
      };
      es.addEventListener('message', ev => {
        if (!ev.data) return;
        let env;
        try { env = JSON.parse(ev.data); } catch (e) { return; }
        if (!env || (env.event && env.event !== 'message')) return;
        if (typeof env.message !== 'string') return;
        let data;
        try { data = JSON.parse(env.message); } catch (e) { return; }
        if (!data || !data.kind) return;
        pvpSignalHandle(data);
      });
      es.onerror = () => {
        if (UI.pvpRole && !(UI.pvpConn && UI.pvpConn.open)) {
          pvpStatus('HTTPS 信令重连中…');
        }
      };
    } catch (e) {
      pvpSignalFail('signal');
    }
  }

  function pvpStartRelay() {
    if (!UI.pvpRole || !UI.pvpCode) return;
    if (UI.pvpConn && UI.pvpConn.open) return;
    const handlers = {};
    const conn = {
      open: true,
      on(evt, cb) { (handlers[evt] || (handlers[evt] = [])).push(cb); },
      emit(evt, arg) { (handlers[evt] || []).forEach(cb => { try { cb(arg); } catch (e) {} }); },
      send(obj) {
        pvpSignalPublish({
          kind: 'relay', from: UI.pvpRole, session: UI.pvpSignalSession, payload: obj
        });
        return true;
      },
      close() { this.open = false; }
    };
    UI.pvpConn = conn;
    pvpWire(conn);
    pvpStatus(UI.pvpRole === 'host' ? '房间已创建，等待对手加入' : '已连接信令，等待房主…');
    conn.emit('open');
    if (UI.pvpRole === 'guest') {
      pvpSignalPublish({ kind: 'join', from: 'guest', session: UI.pvpSignalSession });
    }
  }

  function pvpRelayReceive(payload) {
    if (!payload || !payload.t) return;
    if (UI.pvpRole === 'host') pvpHostData(payload);
    else if (UI.pvpRole === 'guest') pvpGuestData(payload);
  }

  function pvpSignalHandle(data) {
    if (!data || data.code !== UI.pvpCode) return;
    if (data.kind === 'relay') {
      if (data.from === UI.pvpRole) return;
      pvpRelayReceive(data.payload);
      return;
    }
    if (data.kind === 'join') {
      if (UI.pvpRole === 'host') {
        pvpStatus('对手已连接，等待准备');
        pvpSend({ t: 'welcome', mode: UI.matchMode });
      }
      return;
    }
    if (data.kind === 'bye') {
      pvpStatus('对手已离开房间');
      toast('对手已离开房间');
    }
  }

  function pvpSignalFail(type) {
    if (UI.pvpConn && UI.pvpConn.open) return;
    if (pvpScheduleRetry()) return;
    pvpCloseSignal();
    const text = pvpErrorText(type || 'signal');
    pvpStatus(text);
    toast(text);
  }

  function pvpScheduleRetry() {
    if (!UI.pvpRole || UI.pvpRetry >= 3) return false;
    UI.pvpRetry += 1;
    clearTimeout(UI.pvpRetryTimer);
    pvpCloseSignal();
    pvpStatus('联机通道建立失败，正在重试（' + UI.pvpRetry + '/3）…');
    UI.pvpRetryTimer = setTimeout(() => {
      if (UI.pvpRole === 'host') pvpHostSignal();
      else if (UI.pvpRole === 'guest') pvpGuestSignal();
    }, 1200 * UI.pvpRetry);
    return true;
  }

  function pvpAddRemoteIce(candidate) {
    if (!candidate || !UI.pvpPC) return;
    if (UI.pvpPC.remoteDescription) {
      try { UI.pvpPC.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {}); } catch (e) {}
    } else {
      UI.pvpRemoteIce.push(candidate);
    }
  }

  function pvpFlushRemoteIce() {
    const pc = UI.pvpPC;
    if (!pc || !pc.remoteDescription) return;
    const list = UI.pvpRemoteIce.splice(0);
    list.forEach(c => {
      try { pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}); } catch (e) {}
    });
  }

  function pvpBindDC(dc) {
    if (!dc) return;
    if (UI.pvpDC && UI.pvpDC !== dc) { try { UI.pvpDC.close(); } catch (e) {} }
    UI.pvpDC = dc;
    const handlers = {};
    const conn = {
      open: false,
      on(evt, cb) { (handlers[evt] || (handlers[evt] = [])).push(cb); },
      emit(evt, arg) { (handlers[evt] || []).forEach(cb => { try { cb(arg); } catch (e) {} }); },
      send(obj) {
        if (dc.readyState !== 'open') return false;
        try { dc.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
      },
      close() { try { dc.close(); } catch (e) {} }
    };
    UI.pvpConn = conn;
    dc.onopen = () => {
      if (UI.pvpDC !== dc) return;
      conn.open = true;
      clearInterval(UI.pvpOfferTimer);
      clearTimeout(UI.pvpSignalTimer);
      UI.pvpOfferTimer = null;
      UI.pvpSignalTimer = null;
      UI.pvpRetry = 0;
      pvpStatus('联机通道已建立');
      clearTimeout(UI.pvpPollTimer);
      UI.pvpPollTimer = null;
      conn.emit('open');
      pvpUpdateUI();
    };
    dc.onmessage = ev => {
      let data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      conn.emit('data', data);
    };
    dc.onclose = () => {
      conn.open = false;
      conn.emit('close');
      if (UI.pvpConn === conn) {
        pvpStatus('联机通道已断开');
      }
    };
    dc.onerror = () => conn.emit('error', { type: 'webrtc' });
    pvpWire(conn);
  }

  function pvpCloseSignal() {
    clearInterval(UI.pvpOfferTimer);
    clearTimeout(UI.pvpSignalTimer);
    clearTimeout(UI.pvpConnTimer);
    clearTimeout(UI.pvpPollTimer);
    clearTimeout(UI.pvpWSRetryTimer);
    UI.pvpPollTimer = null;
    UI.pvpWSRetryTimer = null;
    if (UI.pvpWS) { try { UI.pvpWS.close(); } catch (e) {} }
    UI.pvpWS = null;
    UI.pvpOfferTimer = null;
    UI.pvpSignalTimer = null;
    UI.pvpConnTimer = null;
    if (UI.pvpES) { try { UI.pvpES.close(); } catch (e) {} }
    UI.pvpES = null;
    const conn = UI.pvpConn;
    UI.pvpConn = null;
    if (conn) { try { conn.close(); } catch (e) {} }
    UI.pvpDC = null;
    if (UI.pvpPC) { try { UI.pvpPC.close(); } catch (e) {} }
    UI.pvpPC = null;
    UI.pvpRemoteIce = [];
    UI.pvpHostIce = [];
    UI.pvpGuestAnswered = false;
    UI.pvpGuestAnswer = null;
    UI.pvpSignalSession = '';
  }

  function pvpPublishHostOffer(withIce) {
    const pc = UI.pvpPC;
    if (!pc || !pc.localDescription) return;
    pvpSignalPublish({
      kind: 'offer', from: 'host', session: UI.pvpSignalSession,
      sdp: pc.localDescription
    });
    if (withIce) {
      UI.pvpHostIce.forEach(candidate => pvpSignalPublish({
        kind: 'ice', from: 'host', session: UI.pvpSignalSession, candidate
      }));
    }
  }

  function pvpHostSignalData(data) {
    if (data.from === 'host') return;
    const pc = UI.pvpPC;
    if (!pc) return;
    if (data.kind === 'join') {
      pvpStatus('对手已加入房间，正在建立通道…');
      pvpPublishHostOffer(true);
      return;
    }
    if (!data.session || data.session !== UI.pvpSignalSession) return;
    if (data.kind === 'answer') {
      if (pc.signalingState !== 'have-local-offer') return;
      try {
        pc.setRemoteDescription(new RTCSessionDescription(data.sdp)).then(() => {
          pvpFlushRemoteIce();
          pvpStatus('正在建立 P2P 通道…');
        }).catch(() => pvpSignalFail('webrtc'));
      } catch (e) { pvpSignalFail('webrtc'); }
      return;
    }
    if (data.kind === 'ice') {
      pvpAddRemoteIce(data.candidate);
    }
  }

  function pvpGuestSignalData(data) {
    if (data.from === 'guest') return;
    if (data.kind === 'offer') {
      if (!data.session) return;
      if (UI.pvpGuestAnswered && data.session === UI.pvpSignalSession) {
        if (UI.pvpGuestAnswer) pvpSignalPublish({
          kind: 'answer', from: 'guest', session: UI.pvpSignalSession, sdp: UI.pvpGuestAnswer
        });
        return;
      }
      UI.pvpSignalSession = data.session;
      const pc = UI.pvpPC;
      if (!pc) return;
      try {
        pc.setRemoteDescription(new RTCSessionDescription(data.sdp)).then(() => {
          pvpFlushRemoteIce();
          return pc.createAnswer();
        }).then(answer => pc.setLocalDescription(answer)).then(() => {
          UI.pvpGuestAnswered = true;
          UI.pvpGuestAnswer = pc.localDescription;
          pvpSignalPublish({
            kind: 'answer', from: 'guest', session: UI.pvpSignalSession,
            sdp: pc.localDescription
          });
          pvpStatus('正在建立 P2P 通道…');
        }).catch(() => pvpSignalFail('webrtc'));
      } catch (e) { pvpSignalFail('webrtc'); }
      return;
    }
    if (data.kind === 'ice') {
      pvpAddRemoteIce(data.candidate);
    }
  }

  function pvpHostSignal() {
    if (UI.pvpRole !== 'host' || !UI.pvpCode) return;
    pvpCloseSignal();
    UI.pvpSignalSession = pvpUid();
    pvpStatus('正在连接 HTTPS 信令…');
    pvpSignalSubscribe();
  }

  function pvpGuestSignal() {
    if (UI.pvpRole !== 'guest' || !UI.pvpCode) return;
    pvpCloseSignal();
    UI.pvpSignalSession = pvpUid();
    pvpStatus('正在加入房间…');
    pvpSignalSubscribe();
  }

  function pvpCreate() {
    if (typeof WebSocket === 'undefined') { toast('当前浏览器不支持联机信令'); return; }
    const keys = pvpKeys();
    if (!pvpValidate(keys)) { toast('请先选好你的阵容'); return; }
    pvpReset();
    const code = pvpGenCode();
    UI.pvp = true;
    UI.pvpRole = 'host';
    UI.pvpLocalTeam = 'left';
    UI.pvpCode = code;
    UI.pvpOpen = true;
    pvpSetOpen(true);
    pvpHostSignal();
  }

  function pvpJoin() {
    if (typeof WebSocket === 'undefined') { toast('当前浏览器不支持联机信令'); return; }
    const input = $('#pvpCodeInput');
    const code = (input && input.value || '').trim().toUpperCase();
    if (code.length < 4) { toast('请输入房间码'); return; }
    pvpReset();
    UI.pvp = true;
    UI.pvpRole = 'guest';
    UI.pvpLocalTeam = 'right';
    UI.pvpCode = code;
    UI.pvpOpen = true;
    pvpSetOpen(true);
    pvpGuestSignal();
  }

  function pvpReset() {
    clearTimeout(UI.pvpRetryTimer);
    UI.pvpRetryTimer = null;
    UI.pvpRetry = 0;
    pvpCloseSignal();
    UI.pvpConn = null;
    UI.pvpPeer = null;
    UI.pvpRole = null;
    UI.pvpCode = '';
    UI.pvpGuestKeys = null;
    UI.pvpGuestReady = false;
    UI.pvpReady = false;
    UI.pvpWelcome = false;
    UI.netBusy = false;
    UI.netApply = false;
    UI.pvp = false;
    UI.pvpLocalTeam = 'left';
    pvpUpdateUI();
  }

  function pvpLeave() {
    pvpSend({ t: 'bye' });
    pvpReset();
    pvpSetOpen(false);
  }

  function pvpReady() {
    if (UI.pvpRole !== 'guest' || !UI.pvpWelcome) return;
    const keys = pvpKeys();
    if (!pvpValidate(keys)) { toast('你的阵容不符合当前模式'); return; }
    if (!pvpSend({ t: 'ready', keys })) { toast('尚未连接房主'); return; }
    UI.pvpReady = true;
    pvpStatus('已准备，等待房主开始');
    pvpUpdateUI();
  }

  function pvpHostStart() {
    if (UI.pvpRole !== 'host' || !UI.pvpGuestReady) return;
    const hostKeys = pvpKeys();
    const guestKeys = UI.pvpGuestKeys;
    if (!pvpValidate(hostKeys)) { toast('你的阵容不符合当前模式'); return; }
    if (!pvpValidate(guestKeys)) { toast('对手阵容不符合当前模式'); return; }
    const left = pvpExpand(hostKeys);
    const right = pvpExpand(guestKeys);
    const seed = Math.floor(Math.random() * 0xffffffff);
    startGame(left, right, {
      mode: UI.matchMode, clone: UI.matchMode === 'clone',
      pvp: true, pvpRole: 'host', localTeam: 'left', seed
    });
    pvpSend({
      t: 'init', seed, left, right,
      mode: UI.matchMode, clone: UI.matchMode === 'clone'
    });
  }

  function pvpGuestStart(data) {
    if (!data || !Array.isArray(data.left) || !Array.isArray(data.right)) return;
    startGame(data.left, data.right, {
      mode: data.mode, clone: !!data.clone,
      pvp: true, pvpRole: 'guest', localTeam: 'right', seed: data.seed
    });
  }

  /* ------------------------------ 事件 ------------------------------ */
  function bindEvents() {
    $('#randomBtn').addEventListener('click', () => {
      if (UI.pvpRole && (UI.pvpReady || UI.pvpGuestReady)) { toast('已准备，不能更改阵容'); return; }
      const n = (MODES[UI.matchMode] || MODES.classic).random;
      UI.selected = new Set(randomLineup(n));
      buildRoster();
      updatePickCount();
      toast('已随机选择 ' + n + ' 名单位');
    });

    document.querySelectorAll('.mode-chip').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    $('#startActionsToggle').addEventListener('click', () => setStartActionsCollapsed(!UI.startActionsCollapsed));

    $('#pvpToggleBtn').addEventListener('click', () => {
      if (UI.pvpRole) pvpLeave();
      else pvpSetOpen(!UI.pvpOpen);
    });
    $('#pvpCloseBtn').addEventListener('click', () => {
      if (UI.pvpRole) pvpLeave();
      else pvpSetOpen(false);
    });
    $('#pvpCreateBtn').addEventListener('click', pvpCreate);
    $('#pvpJoinBtn').addEventListener('click', pvpJoin);
    $('#pvpCodeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') pvpJoin();
    });
    $('#pvpReadyBtn').addEventListener('click', pvpReady);
    $('#pvpStartBtn').addEventListener('click', pvpHostStart);
    $('#pvpLeaveBtn').addEventListener('click', pvpLeave);

    $('#autoBattleBtn').addEventListener('click', () => {
      if (UI.pvpOpen || UI.pvpRole) { toast('联机房间进行中，请先离开'); return; }
      const mode = UI.matchMode;
      const n = mode === 'classic' ? 4 : MODES[mode].max;
      const left = randomLineup(n);
      if (mode === 'clone') {
        const ai = (UI.opponentPick !== 'random' && WX.UNITS[UI.opponentPick])
          ? UI.opponentPick : randomLineup(1)[0];
        startGame(Array(4).fill(left[0]), Array(4).fill(ai), { autoBattle: true, mode, clone: true });
        return;
      }
      const right = enemyLineup(n, left);
      startGame(left, right, { autoBattle: true, mode });
    });

    $('#startBtn').addEventListener('click', () => {
      if (UI.pvpOpen || UI.pvpRole) return;
      const cfg = MODES[UI.matchMode] || MODES.classic;
      if (UI.selected.size < cfg.min) { toast('至少选择 ' + cfg.min + ' 名单位'); return; }
      let left = WX.ROSTER.filter(k => UI.selected.has(k));
      let right;
      if (UI.matchMode === 'clone') {
        const base = left[0];
        const ai = (UI.opponentPick !== 'random' && WX.UNITS[UI.opponentPick])
          ? UI.opponentPick : randomLineup(1).find(k => k !== base) || randomLineup(1)[0];
        left = Array(4).fill(base);
        right = Array(4).fill(ai);
      } else {
        right = enemyLineup(left.length, left);
      }
      startGame(left, right, { mode: UI.matchMode, clone: UI.matchMode === 'clone' });
    });

    $('#autoBtn').addEventListener('click', () => {
      if (UI.autoBattle) { toast('当前是自动对战，双方都由 AI 操作'); return; }
      UI.autoplay = !UI.autoplay;
      UI.aiToken += 1;
      UI.pending = null;
      UI.targetSkill = null;
      UI.moveMode = false;
      const g = UI.game;
      if (UI.autoplay && g && !g.over && g.current && g.current.team === 'left' && g.actionsLeft > 0) {
        const u = g.current;
        const token = ++UI.aiToken;
        setTimeout(() => aiStep(u, token), 240);
      }
      sync();
    });

    $('#leagueBtn').addEventListener('click', () => {
      buildLeague();
      $('#leagueModal').classList.remove('hidden');
    });

    $('#startLeagueBtn').addEventListener('click', () => {
      buildLeague();
      $('#leagueModal').classList.remove('hidden');
    });

    $('#leagueBody').addEventListener('click', e => {
      const tr = e.target.closest('tr[data-league-key]');
      if (tr) showLeagueDetail(tr.dataset.leagueKey);
    });

    $('#rulesBtn').addEventListener('click', () => {
      buildRules();
      $('#rulesModal').classList.remove('hidden');
    });

    $('#reportBtn').addEventListener('click', openReport);
    $('#reportOverBtn').addEventListener('click', openReport);
    $('#copyReportBtn').addEventListener('click', copyReport);
    $('#downloadReportBtn').addEventListener('click', downloadReport);
    $('#reportModal').addEventListener('click', e => {
      if (e.target.id === 'reportModal') e.target.classList.add('hidden');
    });

    $('#restartBtn').addEventListener('click', () => {
      if (UI.pvp) { toast('联机对局请返回选人后重新开房'); return; }
      if (!UI.lastLineup) return;
      startGame(UI.lastLineup.left, UI.lastLineup.right, {
        autoBattle: !!UI.lastLineup.autoBattle,
        mode: UI.lastLineup.mode,
        clone: !!UI.lastLineup.clone
      });
    });

    $('#againBtn').addEventListener('click', () => {
      if (UI.pvp) { toast('联机对局请返回选人后重新开房'); return; }
      $('#gameOver').classList.add('hidden');
      $('#reportModal').classList.add('hidden');
      if (!UI.lastLineup) return;
      startGame(UI.lastLineup.left, UI.lastLineup.right, {
        autoBattle: !!UI.lastLineup.autoBattle,
        mode: UI.lastLineup.mode,
        clone: !!UI.lastLineup.clone
      });
    });

    $('#backBtn').addEventListener('click', () => {
      if (UI.pvpRole || UI.pvpOpen) pvpLeave();
      $('#gameOver').classList.add('hidden');
      $('#reportModal').classList.add('hidden');
      $('#app').classList.add('hidden');
      $('#startScreen').classList.remove('hidden');
      clearMenuArtifacts();
      UI.game = null;
      UI.autoBattle = false;
      UI.autoplay = false;
      UI.moveMode = false;
      setStartActionsCollapsed(false);
      updatePickCount();
    });

    document.addEventListener('click', e => {
      const c = e.target.closest('[data-close]');
      if (c) $('#' + c.dataset.close).classList.add('hidden');
    });

    $('#leagueModal').addEventListener('click', e => {
      if (e.target.id === 'leagueModal') e.target.classList.add('hidden');
    });
    $('#rulesModal').addEventListener('click', e => {
      if (e.target.id === 'rulesModal') e.target.classList.add('hidden');
    });
    $('#unitModal').addEventListener('click', e => {
      if (e.target.id === 'unitModal') e.target.classList.add('hidden');
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (!$('#reportModal').classList.contains('hidden')) $('#reportModal').classList.add('hidden');
        else if (!$('#unitModal').classList.contains('hidden')) $('#unitModal').classList.add('hidden');
        else if (!$('#leagueModal').classList.contains('hidden')) $('#leagueModal').classList.add('hidden');
        else if (!$('#rulesModal').classList.contains('hidden')) $('#rulesModal').classList.add('hidden');
        else clearModes();
      }
    });

    $('#actionCard').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      const g = UI.game;
      const u = g.current;
      if (!u || !isLocalUnit(u) || g.over || UI.netBusy) return;

      if (b.dataset.skill) {
        const id = b.dataset.skill;
        const s = (WX.UNITS[u.key].skills || []).concat(u.copiedSkills || []).find(x => x.id === id);
        if (!s) return;
        const tier = b.dataset.tier ? +b.dataset.tier : null;
        if (s.target === 'cell') {
          UI.targetSkill = { kind: 'cell', id, tier, skill: s };
          UI.mode = 'target';
          sync();
        } else if (s.target === 'enemy' || s.target === 'ally' || s.target === 'any') {
          UI.targetSkill = { kind: 'skill', id, tier, skill: s };
          UI.mode = 'target';
          sync();
        } else {
          runAction(g.useSkill(u, id, null, { tier }));
        }
        return;
      }

      const act = b.dataset.act;
      if (act === 'move') {
        UI.moveMode = true;
        UI.freeMoveMode = false;
        UI.pending = null;
        UI.targetSkill = null;
        sync();
      } else if (act === 'freeMove') {
        UI.moveMode = true;
        UI.freeMoveMode = true;
        UI.pending = null;
        UI.targetSkill = null;
        sync();
      } else if (act === 'cancelMove') {
        UI.moveMode = false;
        UI.freeMoveMode = false;
        sync();
      } else if (act === 'basic') {
        UI.targetSkill = { kind: 'basic' };
        UI.mode = 'target';
        sync();
      } else if (act === 'stand') runAction(g.stand(u));
      else if (act === 'unfreeze') runAction(g.unfreeze(u));
      else if (act === 'breakRoot') runAction(g.breakRoot(u));
      else if (act === 'breakStun') runAction(g.breakStun(u));
      else if (act === 'shot') runAction(g.resolveShot(u));
      else if (act === 'pass') runAction(g.pass(u));
      else if (act === 'endTurn') runAction(g.endTurnAfterFreeMove(u));
      else if (act === 'item') runAction(g.useItem(u, b.dataset.item));
      else if (act === 'buy') runAction(g.buy(u, b.dataset.item));
    });
  }

  /* ------------------------------ 启动 ------------------------------ */
  function clearMenuArtifacts() {
    ['gameOver', 'reportModal', 'unitModal', 'rulesModal', 'leagueModal'].forEach(id => {
      const el = $('#' + id);
      if (el) el.classList.add('hidden');
    });
    ['fx', 'skillFx'].forEach(id => {
      const el = $('#' + id);
      if (el) el.innerHTML = '';
    });
    const banner = $('#banner');
    if (banner) banner.classList.remove('show');
    document.body.style.filter = '';
    document.body.style.opacity = '';
  }

  function init() {
    clearMenuArtifacts();
    buildRoster();
    buildOpponentSelect();
    updatePickCount();
    bindEvents();

    const params = new URLSearchParams(location.search);
    UI.demo = params.has('demo');
    if (params.has('fast')) UI.speed = 120;
    else if (UI.demo) UI.speed = 380;

    if (UI.demo) {
      const pool = WX.ROSTER.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      startGame(pool.slice(0, 4), pool.slice(4, 8));
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();





</script>
</body>
</html>
