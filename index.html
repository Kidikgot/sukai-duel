<script>
/* 速开对决 — 简单但完整的对局 AI */
(function (root) {
  'use strict';
  const WX = (root.WX = root.WX || {});
  const AI = (WX.AI = {});

  // 所有 AI 都会评估免费装备与补给；不再按角色一刀切禁止购物。
  const NO_SHOP_KEYS = new Set([]);
  function refusesShop(u) {
    return !!u && NO_SHOP_KEYS.has(u.key);
  }
  function knifeBlocked(g, u) {
    return u.key !== 'muramasa' && g.units.some(x => x.key === 'muramasa' && x.team !== u.team && !x.dead && !x.removed);
  }

  function skillOf(u, id) {
    return ((WX.UNITS[u.key].skills || []).concat(u.copiedSkills || [])).find(s => s.id === id);
  }
  function ready(g, u, id, opt) {
    const s = skillOf(u, id);
    return !!s && g.skillReady(u, s, opt || {}) === true;
  }
  function lowestHp(list) {
    return list.slice().sort((a, b) => a.hp - b.hp)[0] || null;
  }
  function adjacentTarget(g, u, enemies) {
    return lowestHp(enemies.filter(t => !isInvincible(t) && g.dist(u, t) === 1));
  }
  function inRangeTarget(g, u, enemies, range) {
    return lowestHp(enemies.filter(t => !isInvincible(t) && g.dist(u, t) <= range));
  }
  function nearestDist(g, u, enemies) {
    let m = 99;
    enemies.forEach(e => { m = Math.min(m, g.dist(u, e)); });
    return m;
  }
  function isInvincible(t) {
    return !!t && (t.invincible > 0 || t.invincibleUntilAction > t.actionsTaken);
  }
  function isStunImmune(t) {
    return !!t && (t.jeep || t.stunImmune);
  }

  function scoreDamage(g, u, t, dmg, opts) {
    opts = opts || {};
    if (!t || t.dead || t.removed) return -999;
    if (t.downed) {
      if (!u.knockedThisRound.has(t.id)) return 220;
      return 4;
    }
    if (isInvincible(t) && !opts.pierceInvincible) return -999;
    if (u.key === 'mih' && u.knockedThisRound.has(t.id)) return -999;

    let raw = dmg;
    if (!opts.ignoreDefense) raw = Math.max(0, raw - t.defense);
    if (!opts.noReduce && !opts.element) raw *= (1 - t.reduction);
    if (t.key === 'drill' && !t.inDungeon && !opts.noReduce && !opts.element) raw *= 0.5;
    if (!opts.armorBreak && t.block > 0) raw *= 0.75;

    let shieldPart = 0, hpPart = raw;
    if (!opts.trueDmg && !opts.direct && !opts.armorBreak) {
      shieldPart = Math.min(t.shield, raw);
      hpPart = raw - shieldPart;
    }

    let sc = hpPart * 12 + shieldPart * 4;
    if (hpPart >= t.hp) sc += 70;
    sc += Math.max(0, 3 - t.hp) * 2;
    if (t.frozen) sc -= 4;
    return sc;
  }

  function basicDamage(u) {
    let dmg = u.melee +
      (u.key === 'li' && !u.inDungeon ? Math.min(1.5, Math.floor(u.gang / 3) * 0.5) : 0) +
      (u.key === 'bernahl' && u.goldenVow ? 0.5 : 0);
    if (u.sword) dmg = Math.max(dmg, 1);
    return dmg;
  }

  function gilVaultLethal(g, u, t) {
    if (!t || t.dead || t.removed) return false;
    if (isInvincible(t)) return false;
    if (t.downed) return u.layers >= 1 && !g.knifeGuardReady(t);
    if (t.counterStance && t.counterStanceUntil > g.round) return false;
    // 有格挡/锁血/团队领袖等不确定或额外减伤时，不把“可能击倒”当成确定击倒。
    if ((t.block || 0) > 0 || t.leaderGuard) return false;
    if (t.key === 'drill' && !t.drillLockUsed) return false;
    const tier = Math.min(vaultTier(t), u.layers, 3);
    if (tier < 1) return false;
    let raw = [0, 0.5, 1.0, 1.5][tier];
    raw = Math.max(0, raw - (t.defense || 0));
    raw *= (1 - (t.reduction || 0));
    if ((t.key === 'trainer' || t.copiedPassiveKey === 'trainer') && !t.inDungeon) raw = Math.min(raw, 0.5);
    return raw >= t.hp;
  }


  function canFinishNow(g, u, enemies) {
    const t = inRangeTarget(g, u, enemies, u.meleeRange || 1);
    if (!t || t.shield > 0 || (t.defense || 0) > 0 || (t.block || 0) > 0 || (t.reduction || 0) > 0) return false;
    if (isInvincible(t)) return false;

  function vaultTier(t) {
    for (let tier = 1; tier <= 3; tier++) {

      dmg *= (1 - (t.reduction || 0));
      if ((t.block || 0) > 0) dmg *= 0.75;
      if (dmg >= t.hp - 1e-6) return tier;

  function bestOffense(g, u, enemies) {
    const acts = [];

    // 普攻
    for (const t of enemies) {
      const d = g.dist(u, t);
      if (d === 0) continue;
      if (!g.targetable(u, t)) continue;

      const assassin = (u.key === 'kiritsugu' || u.copiedPassiveKey === 'kiritsugu') && t.downed;

        : ((u.key === 'lancelot' || u.copiedPassiveKey === 'lancelot') ? 0.5 + g.nearbyEnemies(u) : basicDamage(u)));

      let sc = scoreDamage(g, u, t, dmg, opts);
      if (u.twoStep && ranged) sc -= 6;

    // 技能
    switch (u.key) {
      case 'gil': {
        if (!ready(g, u, 'vault')) break;
        const ts = enemies.filter(t => !isInvincible(t));

          if (sc > bestScore) {

            bestAct = { type: 'skill', id: 'vault', targetId: t.id, tier, score: sc };

      }
      case 'li': {
        const t = adjacentTarget(g, u, enemies);
        if (t) {

          if (ready(g, u, 'tiger')) acts.push({ type: 'skill', id: 'tiger', targetId: t.id, score: scoreDamage(g, u, t, 0.5, { armorBreak: true }) + 5 });

      case 'aokiji': {

        break;

      case 'tree': {

      case 'ryougi': {

        if (t && ready(g, u, 'roar') && !easyKill && u.hp > 0.5) {

        }
        if (s && spearReady) {

        }

      }
      case 'whitebeard': {
        const t = lowestHp(enemies);
        if (t && ready(g, u, 'breakAir')) {
          acts.push({ type: 'skill', id: 'breakAir', targetId: t.id, score: scoreDamage(g, u, t, 0.5, { trueDmg: true }) + 4 });

      case 'cgil': {

          acts.push({ type: 'skill', id: 'kingVolley', targetId: t.id, score: 30 });
        }

      }
      default: break;
    }

    acts.sort((a, b) => b.score - a.score);
    return acts.length && acts[0].score > 0 ? acts[0] : null;
  }

  function fleeMove(g, u, enemies) {
    if (!enemies.length) return null;

    for (const c of cells) {

    if (best) return { type: 'move', x: best.x, y: best.y };

  function gilKiteMove(g, u, enemies) {
    if (!enemies.length) return null;
    const cells = g.freeCellsFor(u);
    let best = null, bestScore = -Infinity;

      let nearest = 99, adj = 0;
      for (const e of enemies) {
        const d = g.distXY(c, e.x, e.y);
        nearest = Math.min(nearest, d);

      }

      let sc = -Math.abs(nearest - 4) * 18 + Math.min(nearest, 5) * 4 - adj * 120;
      if (g.isShop(c.x, c.y)) sc -= 5;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    return best ? { type: 'move', x: best.x, y: best.y } : null;
  }

  function moveAction(g, u, enemies) {
    if (u.root > 0) return { type: 'pass' };
    const eligible = enemies.filter(t => t.stealth <= 0 &&
      !(u.key === 'mih' && u.knockedThisRound.has(t.id)));
    const target = lowestHp(eligible) || (u.key === 'mih' ? null : enemies[0]);
    if (!target) return { type: 'pass' };
    const cells = g.freeCellsFor(u);
    const pref = u.ranged > 0 ? (u.twoStep ? 3 : 2) : 1;
    const oldman = enemies.find(t => t.key === 'oldman' || t.copiedPassiveKey === 'oldman');
    let best = null, bestScore = -1e9;
    for (const c of cells) {
      const d = g.distXY(c, target.x, target.y);
      let sc = -Math.abs(d - pref) * 9;
      if (u.ranged <= 0 && d === 1) sc += 8;
      if (oldman && g.distXY(c, oldman.x, oldman.y) <= 1) sc -= 80;
      let adj = 0;
      for (const e of enemies) if (g.distXY(c, e.x, e.y) <= 1) adj += 1;
      if (u.hp <= u.maxHp * 0.6) sc -= adj * 5;
      if (c.x === u.x && c.y === u.y) sc -= 6;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (best && (best.x !== u.x || best.y !== u.y)) return { type: 'move', x: best.x, y: best.y };
    return { type: 'pass' };
  }

  function moveToCenter(g, u) {
    const cells = g.freeCellsFor(u);
    if (!cells.length) return { type: 'pass' };
    const cx = Math.floor(WX.CONST.W / 2), cy = Math.floor(WX.CONST.H / 2);
    let best = null, bestScore = -Infinity;
    for (const c of cells) {
      if (c.x === u.x && c.y === u.y) continue;
      const d = Math.abs(c.x - cx) + Math.abs(c.y - cy);
      const sc = -d * 4;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    return best ? { type: 'move', x: best.x, y: best.y } : { type: 'pass' };
  }

  function noVisibleEnemyAction(g, u, hidden) {
    if (u.inDungeon) return moveToCenter(g, u);
    if (hidden && hidden.some(t => t.key === 'kiritsugu' || t.copiedPassiveKey === 'kiritsugu')) {
      return closeInMove(g, u, hidden);
    }
    if (hidden && hidden.length) return moveToCenter(g, u);
    if (u.key === 'jotaro' && !u.flags.star && ready(g, u, 'star')) return { type: 'skill', id: 'star' };
    if (u.key === 'moshuiliang' && !u.jeep && ready(g, u, 'jeep')) return { type: 'skill', id: 'jeep' };
    if (u.key === 'whitebeard' && !u.leaderGuard && ready(g, u, 'leader')) return { type: 'skill', id: 'leader' };
    if (u.key === 'bernahl' && !u.goldenVow && ready(g, u, 'goldenVow')) return { type: 'skill', id: 'goldenVow' };
    if (u.key === 'cgil' && u.kingAmmo <= 0 && ready(g, u, 'kingBarrage')) return { type: 'skill', id: 'kingBarrage' };
    if (u.key === 'cgil' && !u.evadeUses && ready(g, u, 'clairvoyance')) return { type: 'skill', id: 'clairvoyance' };
    if (u.key === 'kukuang' && !u.charge && u.chargesUsed < 3 && u.hp > 0.5 && ready(g, u, 'rage')) return { type: 'skill', id: 'rage' };
    if (u.key === 'mih') {
      const shop = mihShopPlan(g, u, []);
      if (shop) return shop;
    }
    return moveToCenter(g, u);
  }

  const BLOOD_BOUND_KEYS = new Set(['bernahl', 'whitebeard', 'trainer', 'drill']);

  function needBlood(u) {
    return BLOOD_BOUND_KEYS.has(u.key) && u.hp <= u.maxHp * 0.5;
  }

  function closeInMove(g, u, enemies) {
    if (!enemies.length) return { type: 'pass' };
    const target = enemies.slice().sort((a, b) =>
      g.dist(u, a) - g.dist(u, b) || a.hp - b.hp)[0];
    const cells = g.freeCellsFor(u);
    let best = null, bestScore = -Infinity;
    for (const c of cells) {
      if (!u.inDungeon && g.isDungeonCell(c.x, c.y)) continue;
      const d = g.distXY(c, target.x, target.y);
      let sc = -d * 30;
      if (d === 1) sc += 100;
      if (c.x === u.x && c.y === u.y) sc -= 4;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (best && (best.x !== u.x || best.y !== u.y)) return { type: 'move', x: best.x, y: best.y };
    return { type: 'pass' };
  }

  function sentinelMove(g, u, enemies) {
    const target = enemies.slice().sort((a, b) =>
      g.dist(u, a) - g.dist(u, b) || a.hp - b.hp)[0];
    if (!target) return { type: 'pass' };
    const cells = g.freeCellsFor(u);
    let best = null, bestScore = -Infinity;
    for (const c of cells) {
      if (g.isDungeonCell(c.x, c.y) && !u.inDungeon) continue;
      const d = g.distXY(c, target.x, target.y);
      let sc = -Math.abs(d - 2) * 40;
      if (d === 2) sc += 60;
      if (d === 1) sc -= 20;
      if (c.x === u.x && c.y === u.y) sc -= 5;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (best && (best.x !== u.x || best.y !== u.y)) return { type: 'move', x: best.x, y: best.y };
    return { type: 'pass' };
  }

  function decideBuy(g, u) {
    if (u.key === 'muramasa') {
      if (!u.knife.owned) return 'knife';
      if (!u.knife.special) return 'muramasaBlade';
      if (!u.gun && (u.ranged || 0) < 0.5) return 'gun';
      return null;
    }
    if (needBlood(u) && u.items.blood < 2) return 'blood';
    if (!u.knife.owned && !knifeBlocked(g, u)) return 'knife';
    // 刀：近战低于 1 的角色提升最大；健身教练被规则禁止。
    if (!u.sword && u.key !== 'trainer' && u.melee < 1) return 'sword';
    // 枪：没有可靠远程时补 0.5 射程 6，避免被风筝。
    if (!u.gun && (u.ranged || 0) < 0.5) return 'gun';
    if (u.shield < 1 && u.items.shield < 1) return 'shield';
    return null;
  }

  function moveToShop(g, u, enemies) {
    const shops = WX.CONST.SHOPS;
    const cells = g.freeCellsFor(u);
    let best = null, bestScore = -Infinity;
    for (const c of cells) {
      const sd = Math.min(...shops.map(s => g.distXY(c, s.x, s.y)));
      let sc = -sd * 12;
      if (sd <= 1) sc += 35;
      const danger = enemies.filter(e => g.distXY(c, e.x, e.y) <= 1).length;
      sc -= danger * (u.shield > 0 ? 8 : 18);
      if (c.x === u.x && c.y === u.y) sc -= 6;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (best && (best.x !== u.x || best.y !== u.y)) return { type: 'move', x: best.x, y: best.y };
    return null;
  }

  function mihShopPlan(g, u, enemies) {
    if (u.key !== 'mih' || refusesShop(u) || u.inDungeon || u.root > 0 || u.mustDungeon) return null;
    const want = (!u.knife.owned && !knifeBlocked(g, u)) ? 'knife'
      : (!u.sword && u.melee < 1 ? 'sword'
        : (!u.gun && (u.ranged || 0) < 0.5 ? 'gun'
          : (needBlood(u) && u.items.blood < 1 ? 'blood'
            : (u.shield < 1 && u.items.shield < 1 ? 'shield' : null))));
    if (!want) return null;
    // 贴脸先打，不在敌人面前原地购物。
    if (enemies.some(e => g.dist(u, e) <= 1)) return null;
    if (g.nearShop(u)) return { type: 'buy', item: want };
    return moveToShop(g, u, enemies);
  }

  function mihReposition(g, u, enemies) {
    const cells = g.freeCellsFor(u);
    let best = null, bestScore = -Infinity;
    for (const c of cells) {
      if (c.x === u.x && c.y === u.y) continue;
      if (!u.inDungeon && g.isDungeonCell(c.x, c.y)) continue;
      let sc = 0;
      for (const e of enemies) {
        const d = g.distXY(c, e.x, e.y);
        sc += Math.min(d, 5) * 4;
        if (d <= 1) sc -= 24;
      }
      // 没有可攻击目标时，优先回到中央，保持下一轮的选择权。
      sc -= Math.abs(c.x - 5) * 2 + Math.abs(c.y - 3) * 2;
      if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (best) return { type: 'move', x: best.x, y: best.y };
    return null;
  }

  function mihNoTargetAction(g, u, enemies) {
    if (u.inDungeon) return null;
    if (u.items.shield > 0 && u.shield < Math.max(1, u.shieldCap)) {
      return { type: 'item', item: 'shield' };
    }
    if (u.items.blood > 0 && u.hp < u.maxHp) {
      return { type: 'item', item: 'blood' };
    }
    const shop = mihShopPlan(g, u, []);
    if (shop) return shop;
    const move = mihReposition(g, u, enemies);
    if (move) return move;
    return { type: 'pass' };
  }

  function shopPlan(g, u, enemies) {
    if (refusesShop(u)) return null;
    if (u.inDungeon || u.root > 0 || u.mustDungeon) return null;
    if (enemies.some(e => g.dist(u, e) <= 1)) return null;
    if (nearestDist(g, u, enemies) <= 2) return null;
    const want = decideBuy(g, u);
    if (!want) return null;
    // 装备与补给均为高收益目标；没有金币门槛，只看是否需要。
    const worth = needBlood(u) || !u.knife.owned || !u.gun || (!u.sword && u.melee < 1) ||
      (u.shield < 1 && u.items.shield < 1);
    if (!worth) return null;
    if (g.nearShop(u)) return { type: 'buy', item: want };
    return moveToShop(g, u, enemies);
  }

  // 鱼刀/牙套面对两仪式：直死是击倒而不是普通伤害，优先用护盾挡掉第一下，
  // 其次才是名刀；安全距离先补盾，贴脸则直接把已有盾套上。
  function ryougiShopPlan(g, u, enemies) {
    const ry = enemies.find(e => e.key === 'ryougi' && !e.dead && !e.removed);
    if (!ry || u.inDungeon || u.mustDungeon || u.root > 0) return null;
    const d = nearestDist(g, u, enemies);
    if (u.items.shield > 0 && u.shield < 1 && d <= 2) return { type: 'item', item: 'shield' };
    const want = (u.shield < 1 && u.items.shield < 1) ? 'shield'
      : (!u.sword && u.melee < 1 ? 'sword'
        : (!u.gun && (u.ranged || 0) < 0.5 ? 'gun'
          : (!u.knife.owned && !knifeBlocked(g, u) ? 'knife' : null)));
    if (!want) return null;
    if (g.nearShop(u) && d > 1) return { type: 'buy', item: want };
    if (d > 2) return moveToShop(g, u, enemies);
    return null;
  }


  function shouldMassacre(g, u, enemies) {
    if (u.lastKillRound < 0) return false;
    if (u.lastKillRound < g.round - 2) return false;
    const allies = g.units.filter(x => x.team === u.team && !x.dead && !x.removed).length;
    return g.round >= 4 && allies >= enemies.length;
  }

  AI.choose = function (g, u) {
    if (!u || u.dead || u.removed) return { type: 'pass' };
    const enemies = g.enemiesOf(u);
    if (g.actionsLeft <= 0) {
      if (g.hasFreeMove(u)) {
        const free = kiritsuguMove(g, u, enemies);
        if (free) return { type: 'freeMove', x: free.x, y: free.y };
      }
      return { type: 'endTurn' };
    }
    if (u.pendingShot && (!u.downed || u.standingDown) && !(u.stun > 0)) return { type: 'shot' };
    if (u.frozen && (!u.downed || u.standingDown) && !(u.stun > 0)) return { type: 'unfreeze' };
    if (u.stun > 0 && !u.downed) return { type: 'breakStun' };
    if ((u.skillSealUntil || 0) > g.round && (!u.downed || u.standingDown)) {
      const t = lowestHp(enemies.filter(e => g.targetable(u, e) && !isInvincible(e)));
      if (t && (g.dist(u, t) <= 1 ||
          (u.ranged && g.dist(u, t) <= u.rangedRange && !u.twoStep))) {
        return { type: 'attack', targetId: t.id };
      }
      return moveAction(g, u, enemies) || { type: 'pass' };
    }
    if (!u.inDungeon && (!u.downed || u.standingDown) &&
        (u.key === 'soujuurou' || u.copiedPassiveKey === 'soujuurou')) {
      const adj = adjacentTarget(g, u, enemies);
      if (u.soujuuCombo === 1 && adj) return { type: 'skill', id: 'akuma', targetId: adj.id };
      if (u.soujuuCombo === 0 && ready(g, u, 'akuma') && enemies.length) {
        return { type: 'skill', id: 'akuma', targetId: lowestHp(enemies).id };
      }
      if (u.downed && (u.downEvade || 0) < 2 && ready(g, u, 'fushi')) {
        return { type: 'skill', id: 'fushi' };
      }
      if (u.downed && u.standingDown) {
        const off = bestOffense(g, u, enemies);
        if (off) return off;
        const mv = moveAction(g, u, enemies);
        if (mv) return mv;
        return { type: 'pass' };
      }
    }

    if (u.downed) {
      if (u.key === 'deathfist' && !u.inDungeon) return { type: 'skill', id: 'selfCut' };
      if (u.key === 'liubei') {
        const ally = g.alliesOf(u).filter(a => !a.dead && !a.removed).sort((a, b) => basicDamage(b) - basicDamage(a))[0];
        if (ally) return { type: 'skill', id: 'renDe', targetId: ally.id };
      }
      return { type: 'stand' };
    }
    if (u.stun > 0) return { type: 'breakStun' };
    if (u.frozen) return { type: 'unfreeze' };
    if (u.key === 'marine' && ready(g, u, 'timeStop') && !u.mustDungeon && !u.inDungeon &&
        ['left', 'right'].some(team => g.units.filter(x => x.team === team && !x.dead && !x.removed).length > 1)) {
      return { type: 'skill', id: 'timeStop' };
    }
    if (u.mustDungeon && u.root > 0) return { type: 'breakRoot' };
    if (u.pendingShot) return { type: 'shot' };
    if ((u.key === 'kiritsugu' || u.copiedPassiveKey === 'kiritsugu') &&
        (u.freeMoveUntil || 0) >= g.round && (u.freeMoveRound || 0) < g.round) {
      const free = kiritsuguMove(g, u, enemies);
      if (free) return { type: 'freeMove', x: free.x, y: free.y };
    }
    if (!enemies.length && u.key === 'van' && !u.inDungeon && ready(g, u, 'dungeonDuel') && !g.duelActive && !g.pendingDuel) {
      const t = g.targetsFor(u, skillOf(u, 'dungeonDuel'))
        .sort((a, b) => (b.melee + b.ranged) - (a.melee + a.ranged))[0];
      if (t) return { type: 'skill', id: 'dungeonDuel', targetId: t.id };
    }
    if (!enemies.length) {
      const hidden = g.units.filter(t => !t.dead && !t.removed && t.team !== u.team &&
        t.stealth > 0 && !!t.inDungeon === !!u.inDungeon);
      if (!hidden.length) return { type: 'pass' };
      return noVisibleEnemyAction(g, u, hidden);
    }

    if (enemies.every(isInvincible)) return { type: 'pass' };

    // VAN 老实优先用【地牢撅斗】，不把行动浪费在普通攻击上。
    if (u.key === 'van' && !u.inDungeon && ready(g, u, 'dungeonDuel') && !g.duelActive && !g.pendingDuel) {
      const t = g.targetsFor(u, skillOf(u, 'dungeonDuel'))
        .sort((a, b) => (b.melee + b.ranged) - (a.melee + a.ranged))[0];
      if (t) return { type: 'skill', id: 'dungeonDuel', targetId: t.id };
    }

    // 对切嗣要主动贴脸：远程保持距离会让他重新隐身。
    const kiri = enemies.find(t => t.key === 'kiritsugu' || t.copiedPassiveKey === 'kiritsugu');
    if (kiri && g.dist(u, kiri) > 1 && !canFinishNow(g, u, [kiri])) {
      return closeInMove(g, u, [kiri]);
    }
    // 卫宫切嗣：远程拉扯，优先点杀倒地目标；贴身会破隐，所以主动拉开。
    if (u.key === 'kiritsugu' || u.copiedPassiveKey === 'kiritsugu') {
      const finish = enemies.filter(t => t.downed && !isInvincible(t) && !g.knifeGuardReady(t))
        .sort((a, b) => a.hp - b.hp)[0];
      if (finish) return { type: 'attack', targetId: finish.id };
      if (ready(g, u, 'originBullet') && enemies.length) {
        const target = enemies.filter(t => !isInvincible(t) && !t.downed)
          .sort((a, b) => (b.melee + b.ranged) - (a.melee + a.ranged) || a.hp - b.hp)[0];
        if (target) return { type: 'skill', id: 'originBullet', targetId: target.id };
      }
      const adj = enemies.filter(t => g.dist(u, t) <= 1 && !isInvincible(t))
        .sort((a, b) => a.hp - b.hp)[0];
      if (adj) return { type: 'attack', targetId: adj.id };
      if (g.nearShop(u) && !u.inDungeon) {
        if (!u.knife.owned && !knifeBlocked(g, u)) return { type: 'buy', item: 'knife' };
        if (!u.sword && u.melee < 1) return { type: 'buy', item: 'sword' };
        if (u.shield < 1 && u.items.shield < 1) return { type: 'buy', item: 'shield' };
      } else if (!u.inDungeon && (!u.knife.owned || !u.sword || u.shield < 1) &&
                 !g.enemiesOf(u).some(e => g.dist(u, e) <= 2)) {
        return moveToShop(g, u, enemies) || kiritsuguMove(g, u, enemies);
      }
      if (ready(g, u, 'timeAccel') && (u.freeMoveUntil || 0) < g.round) {
        const cells = (skillOf(u, 'timeAccel').cells || (() => []))(g, u);
        const safe = cells.sort((a, b) => {
          const da = Math.min(...enemies.map(e => g.distXY(a, e.x, e.y)));
          const db = Math.min(...enemies.map(e => g.distXY(b, e.x, e.y)));
          return db - da;
        })[0];
        if (safe) return { type: 'skill', id: 'timeAccel', x: safe.x, y: safe.y };
      }
      const shot = bestOffense(g, u, enemies);
      if (shot) return shot;
      const mv = kiritsuguMove(g, u, enemies);
      if (mv) return mv;
    }

    // 言峰绮礼：治疗敌方刷愉悦，Azoth 补刀；优先保持中距离。
    if (u.key === 'kirei') {
      if (ready(g, u, 'churchHeal') === true) {
        const hurtEnemy = enemies.filter(t => !t.dead && !t.removed && t.hp < t.maxHp &&
          g.dist(u, t) > 1)
          .sort((a, b) => a.hp - b.hp)[0];
        if (hurtEnemy) return { type: 'skill', id: 'churchHeal', targetId: hurtEnemy.id };
        if (u.hp < u.maxHp) return { type: 'skill', id: 'churchHeal', targetId: u.id };
        const ally = g.alliesOf(u).filter(t => !t.dead && !t.removed && t.hp < t.maxHp)
          .sort((a, b) => a.hp - b.hp)[0];
        if (ally) return { type: 'skill', id: 'churchHeal', targetId: ally.id };
      }
      const adj = enemies.filter(t => g.dist(u, t) <= 1 && !isInvincible(t))
        .sort((a, b) => a.hp - b.hp)[0];
      if (ready(g, u, 'baptism') === true) {
        const power = 0.5 + (u.pleasure || 0) * 0.5;
        const targets = enemies.filter(t => !isInvincible(t) && !g.knifeGuardReady(t) &&
          t.hp <= power)
          .sort((a, b) => a.hp - b.hp || g.dist(u, a) - g.dist(u, b));
        if (targets.length) return { type: 'skill', id: 'baptism', targetId: targets[0].id };
      }
      if (!adj && g.nearShop(u) && !u.inDungeon) {
        if (!u.knife.owned && !knifeBlocked(g, u)) return { type: 'buy', item: 'knife' };
        if (u.shield < 1 && u.items.shield < 1) return { type: 'buy', item: 'shield' };
      }
      if (adj && ready(g, u, 'azoth') === true && (adj.hp <= 1 || !g.knifeGuardReady(adj))) {
        return { type: 'skill', id: 'azoth', targetId: adj.id };
      }
      if (adj) return { type: 'attack', targetId: adj.id };
    }

    // 刘备：队友倒地/残血时优先仁德转移行动；自己倒地时在上方处理。
    if (u.key === 'liubei') {
      const ally = g.alliesOf(u).filter(a => !a.dead && !a.removed &&
        (a.downed || a.hp <= a.maxHp * 0.5)).sort((a, b) => a.hp - b.hp)[0];
      if (ally && ready(g, u, 'renDe') === true && g.dist(u, ally) <= 99) {
        return { type: 'skill', id: 'renDe', targetId: ally.id };
      }
    }

    // 死拳套：先用自裁把自己送进倒地，再赌夺舍。
    if (u.key === 'deathfist') {
      if (ready(g, u, 'selfCut') === true && u.hp > 0.5 && g.dist(u, enemies[0]) <= 3) {
        return { type: 'skill', id: 'selfCut' };
      }
    }

    // 所罗门：先铺法阵，再用虚数放逐；盖提亚形态优先人理装填/宝具。
    if (u.key === 'solomon') {
      const near = enemies.filter(t => g.dist(u, t) <= 1 && !isInvincible(t));
      if (ready(g, u, 'goetiaForm') === true && enemies.length) return { type: 'skill', id: 'goetiaForm' };
      if (ready(g, u, 'imaginaryEmbrace') === true && (u.circles || 0) >= 1 && enemies.length) {
        return { type: 'skill', id: 'imaginaryEmbrace' };
      }
      if (ready(g, u, 'razeOrder') === true && enemies.length) return { type: 'skill', id: 'razeOrder' };
    }
    if (u.key === 'goetia') {
      if ((u.humanOrderLoad || 0) < 1 && ready(g, u, 'humanOrder') === true) return { type: 'skill', id: 'humanOrder' };
      if ((u.humanOrderLoad || 0) >= 1 && ready(g, u, 'goetiaRaze') === true) return { type: 'skill', id: 'goetiaRaze' };
      if (ready(g, u, 'goetiaCall') === true && enemies.length) return { type: 'skill', id: 'goetiaCall' };
    }

    if (u.key === 'gawain') {
      const adj = enemies.filter(t => g.dist(u, t) <= 1 && !isInvincible(t));
      if (adj.length && ready(g, u, 'camelotSword') === true) return { type: 'skill', id: 'camelotSword' };
      if (ready(g, u, 'roundTable') === true && !u.trueShield) return { type: 'skill', id: 'roundTable' };
    }

    if (u.key === 'lancelot') {
      const adj = enemies.filter(t => g.dist(u, t) <= 1 && !isInvincible(t))
        .sort((a, b) => a.hp - b.hp)[0];
      if (adj && ready(g, u, 'knightRaid') === true &&
          (adj.gun || adj.sword || (adj.knife && adj.knife.owned))) {
        return { type: 'skill', id: 'knightRaid', targetId: adj.id };
      }
      if (adj && u.hp > 0.5 && ready(g, u, 'madEnhance') === true) return { type: 'skill', id: 'madEnhance' };
      if (adj) return { type: 'attack', targetId: adj.id };
    }

    // 拳套：首动双打全部用于贴脸；优先 1 血且没有锁血保命的目标
    if (u.key === 'gauntlet') {
      if (u.root > 0) return { type: 'breakRoot' };
      const noLock = t => !(t.key === 'drill' && !t.drillLockUsed) &&
        !(t.knife && t.knife.owned && !t.knife.used) &&
        !t.lockHp && !(t.flags && t.flags.lockHp);
      const easy = enemies.filter(t => !t.dead && !t.removed && !t.downed &&
        t.hp <= 1 && !isInvincible(t) && noLock(t))
        .sort((a, b) => g.dist(u, a) - g.dist(u, b) || a.hp - b.hp)[0];
      if (easy && g.dist(u, easy) === 1) return { type: 'attack', targetId: easy.id };
      if (easy) return closeInMove(g, u, [easy]);
      const t = adjacentTarget(g, u, enemies);
      if (t) return { type: 'attack', targetId: t.id };
      return closeInMove(g, u, enemies);
    }

    // 散打僧：贴脸后优先疾风连击，其次震慑拳，最后双连普攻
    if (u.key === 'sanda') {
      if (u.root > 0) return { type: 'breakRoot' };
      const adj = adjacentTarget(g, u, enemies);
      if (adj && ready(g, u, 'flurry')) return { type: 'skill', id: 'flurry' };
      if (adj && ready(g, u, 'stunFist')) return { type: 'skill', id: 'stunFist', targetId: adj.id };
      if (adj) return { type: 'attack', targetId: adj.id };
      return closeInMove(g, u, enemies);
    }

    // 千子村正：自给商店，先名刀再升级，随后无元剑制/试刀物
    if (u.key === 'eggplant') {
      let best = null, bestScore = -Infinity;
      const consider = (act, score) => {
        if (score > bestScore) { bestScore = score; best = act; }
      };
      for (const s of (u.copiedSkills || [])) {
        if (ready(g, u, s.id) !== true) continue;
        if (s.available && !s.available(g, u)) continue;
        if (s.targets && !s.targets(g, u).length) continue;
        if (s.id === 'akuma' && u.soujuuCombo === 1 &&
            !enemies.some(t => g.dist(u, t) <= 1)) continue;
        const used = u.uses[s.id] || 0;
        const unused = used === 0 ? 2 : 0;
        const once = s.once && !u.usedOnce[s.id] ? 12 : 0;
        if (s.target === 'cell') {
          let cells = [];
          try { cells = (s.cells ? s.cells(g, u) : []) || []; } catch (e) { cells = []; }
          if (!cells.length) continue;
          const c = cells[0];
          consider({ type: 'skill', id: s.id, x: c.x, y: c.y, tier: s.tiers ? 1 : undefined },
            8 + enemies.length + unused - used * 2.5);
        } else if (s.target === 'enemy' || s.target === 'ally' || s.target === 'any') {
          const list = g.targetsFor(u, s).filter(t => s.target === 'ally' ? t.id !== u.id : true)
            .filter(t => !(s.id === 'akuma' && u.soujuuCombo === 1 && g.dist(u, t) > 1));
          if (!list.length) continue;
          const t = list.sort((a, b) => a.hp - b.hp || g.dist(u, a) - g.dist(u, b))[0];
          const missing = 1 - t.hp / Math.max(0.5, t.maxHp || 1);
          const base = s.target === 'ally' ? 7 : 12;
          const lethal = s.target !== 'ally' && t.hp <= 1 ? 5 : 0;
          consider({ type: 'skill', id: s.id, targetId: t.id, tier: s.tiers ? 1 : undefined },
            base + missing * 8 + lethal + unused + once - g.dist(u, t) * 0.08 - used * 2.5);
        } else if (s.target === 'none' || s.target === 'self') {
          const near = enemies.filter(t => g.dist(u, t) <= Math.max(1, s.range || 4)).length;
          consider({ type: 'skill', id: s.id, tier: s.tiers ? 1 : undefined },
            6 + near * 1.5 + (used === 0 ? 8 : 0) + once - used * 2.5);
        } else if (s.targets) {
          consider({ type: 'skill', id: s.id, tier: s.tiers ? 1 : undefined },
            6 + enemies.length + unused + once - used * 2.5);
        }
      }
      if (best) return best;
    }

    if (u.key === 'hanzo') {
      if (u.root > 0) return { type: 'breakRoot' };
      if (u.inDungeon) {
        const adj = adjacentTarget(g, u, enemies);
        return adj ? { type: 'attack', targetId: adj.id } : closeInMove(g, u, enemies);
      }
      const adj = adjacentTarget(g, u, enemies);
      const near = enemies.filter(t => g.dist(u, t) <= 5)
        .sort((a, b) => a.hp - b.hp || g.dist(u, a) - g.dist(u, b))[0];
      if (adj && ready(g, u, 'salamander')) {
        return { type: 'skill', id: 'salamander', targetId: adj.id };
      }
      if (near && ready(g, u, 'chainPull') && g.dist(u, near) > 1) {
        return { type: 'skill', id: 'chainPull', targetId: near.id };
      }
      if (adj && ready(g, u, 'chainDance')) return { type: 'skill', id: 'chainDance' };
      if (adj && ready(g, u, 'chainPull')) return { type: 'skill', id: 'chainPull', targetId: adj.id };
      if (ready(g, u, 'chainParry') && enemies.some(t => g.dist(u, t) <= 3)) {
        return { type: 'skill', id: 'chainParry' };
      }
      if (ready(g, u, 'chainDance') && enemies.some(t => g.dist(u, t) <= 2)) {
        return { type: 'skill', id: 'chainDance' };
      }
    }

    if (u.key === 'muramasa') {
      if (u.root > 0) return { type: 'breakRoot' };
      if (u.inDungeon) {
        const adj = adjacentTarget(g, u, enemies);
        return adj ? { type: 'attack', targetId: adj.id } : closeInMove(g, u, enemies);
      }
      if (!u.knife.owned) return { type: 'buy', item: 'knife' };
      if (!u.knife.special) return { type: 'buy', item: 'muramasaBlade' };
      const special = enemies.filter(t => !isInvincible(t)).sort((a, b) => b.hp - a.hp)[0];
      if (u.knife.special && ready(g, u, 'mumyou') && special) {
        return { type: 'skill', id: 'mumyou', targetId: special.id };
      }
      const adj = adjacentTarget(g, u, enemies);
      if (ready(g, u, 'trial') && u.trialUntil <= g.round && adj) {
        return { type: 'skill', id: 'trial' };
      }
      if (adj) return { type: 'attack', targetId: adj.id };
      return closeInMove(g, u, enemies);
    }

    if (u.key === 'changkai' && ready(g, u, 'massacre')) {
      return { type: 'skill', id: 'massacre' };
    }

    // 山中老人：隐身期直接贴脸挽终 + 死告天使，不购物
    if (u.key === 'oldman') {
      if (u.root > 0) return { type: 'breakRoot' };
      const t = adjacentTarget(g, u, enemies);
      if (t) {
        if (ready(g, u, 'deathAngel')) {
          if (!u.flags.mourning && ready(g, u, 'mourning')) return { type: 'skill', id: 'mourning' };
          return { type: 'skill', id: 'deathAngel', targetId: t.id };
        }
        return { type: 'attack', targetId: t.id };
      }
      return closeInMove(g, u, enemies);
    }

    // 张飞：不在 1 血时赌咆哮；优先飞矛补刀，满血才开咆哮
    if (u.key === 'zhangfei') {
      if (u.root > 0) return { type: 'breakRoot' };
      const adj = adjacentTarget(g, u, enemies);
      const target = lowestHp(enemies.filter(t => !t.jeep && !t.downed));
      if (adj && canFinishNow(g, u, enemies)) return { type: 'attack', targetId: adj.id };
      const spearKill = enemies.find(t => t.hp <= 0.5 && !isInvincible(t) && !t.jeep &&
        !t.shield && !(t.defense || 0) && !(t.block || 0));
      if (spearKill && ready(g, u, 'spear')) return { type: 'skill', id: 'spear', targetId: spearKill.id };
      if (u.zhangRoar) {
        if (ready(g, u, 'spear') && target) return { type: 'skill', id: 'spear', targetId: target.id };
        if (adj) return { type: 'attack', targetId: adj.id };
        return moveAction(g, u, enemies);
      }
      if (ready(g, u, 'roar') && u.hp > 1.0 && target) return { type: 'skill', id: 'roar', targetId: target.id };
      if (ready(g, u, 'spear') && target) return { type: 'skill', id: 'spear', targetId: target.id };
      if (adj) return { type: 'attack', targetId: adj.id };
      return moveAction(g, u, enemies);
    }

    // 哨卫：用治严的 2 格射程拉扯；多人时优先易位救高危队友
    if (u.key === 'sentinel') {
      if (u.root > 0) return { type: 'breakRoot' };
      const endangered = g.alliesOf(u)
        .filter(a => !a.dead && !a.removed && a !== u && a.hp <= 0.5 &&
          enemies.some(e => g.dist(a, e) <= 1))
        .sort((a, b) => a.hp - b.hp)[0];
      if (endangered && ready(g, u, 'castle')) {
        return { type: 'skill', id: 'castle', targetId: endangered.id };
      }
      const t = inRangeTarget(g, u, enemies, 2);
      if (t && !isInvincible(t)) return { type: 'attack', targetId: t.id };
      return sentinelMove(g, u, enemies);
    }

    // 鱼刀：能晕就贴脸补层；全员免晕时才去商店找别的办法
    if (u.key === 'fishknife') {
      if (u.root > 0) return { type: 'breakRoot' };
      const rShop = ryougiShopPlan(g, u, enemies);
      if (rShop) return rShop;
      const susceptible = enemies.filter(e => !isStunImmune(e) && !isInvincible(e));
      if (!susceptible.length) {
        const shop = shopPlan(g, u, enemies);
        if (shop) return shop;
        const best = bestOffense(g, u, enemies);
        if (best) return best;
        return moveAction(g, u, enemies);
      }
      const near = inRangeTarget(g, u, susceptible, 1);
      if (near && ready(g, u, 'fishLeap')) {
        const targets = g.targetsFor(u, skillOf(u, 'fishLeap'))
          .filter(t => !isStunImmune(t) && !isInvincible(t) && t.stun < 4)
          .sort((a, b) => (b.stun || 0) - (a.stun || 0) || a.hp - b.hp);
        if (targets.length) return { type: 'skill', id: 'fishLeap', targetId: targets[0].id };
      }
      if (near) return { type: 'attack', targetId: near.id };
      return closeInMove(g, u, susceptible);
    }

    // 吉尔伽美什：安全时补名刀/护盾；能普攻收人时省层；遍历目标按收益选择宝库层数
    if (u.key === 'gil') {
      if (u.root > 0) return { type: 'breakRoot' };
      if (u.inDungeon) {
        const adj = adjacentTarget(g, u, enemies);
        return adj ? { type: 'attack', targetId: adj.id } : moveAction(g, u, enemies);
      }
      // 王财能直接收人时优先收人，避免为了拉扯浪费一次击杀窗口。
      const finish = inRangeTarget(g, u, enemies, 1);
      if (finish && canFinishNow(g, u, enemies)) return { type: 'attack', targetId: finish.id };
      if (u.gilEnuma) {
        const t = g.getUnit(u.gilEnuma.targetId);
        if (t && !t.dead && !t.removed && g.dist(u, t) <= 99 && !isInvincible(t)) {
          return { type: 'skill', id: 'enumaElish', targetId: t.id };
        }
        u.gilEnuma = null;
      }
      // 王财能直接收人时优先收人，避免为了拉扯浪费一次击杀窗口。
      if (u.layers >= 1) {
        const lethal = enemies.filter(t => !isInvincible(t))
          .sort((a, b) => a.hp - b.hp)
          .find(t => {
            const tier = Math.min(vaultTier(t), u.layers, 3);
            let raw = [0, 0.5, 1.0, 1.5][tier];
            if (!t.downed) {
              raw = Math.max(0, raw - (t.defense || 0));
              raw *= (1 - (t.reduction || 0));
            }
            return raw >= t.hp;
          });
        if (lethal) return { type: 'skill', id: 'vault', targetId: lethal.id, tier: Math.min(vaultTier(lethal), u.layers, 3) };
      }
      // 吉尔只有 1 血：近身且不能收人时先拉开，而不是像近战一样贴脸。
      if (nearestDist(g, u, enemies) <= 2 && !canFinishNow(g, u, enemies)) {
        const kite = gilKiteMove(g, u, enemies);
        if (kite) return kite;
      }
      if (enemies.some(e => g.dist(u, e) <= 1) && !canFinishNow(g, u, enemies)) {
        const flee = fleeMove(g, u, enemies);
        if (flee) return flee;
      }
      const enumaTarget = enemies.filter(t => !isInvincible(t) && (t.maxHp || 0) >= 1.5 &&
        ((t.shield || 0) > 0 || (t.defense || 0) > 0 || (t.reduction || 0) > 0 || (t.block || 0) > 0 || t.key === 'trainer' || t.key === 'drill' || t.key === 'whitebeard'))
        .sort((a, b) => (b.maxHp || 0) - (a.maxHp || 0) || a.hp - b.hp)[0];
      if (enumaTarget && u.layers < 2) return { type: 'skill', id: 'enumaElish', targetId: enumaTarget.id };
      if (nearestDist(g, u, enemies) > 2) {
        const want = !u.sword && u.melee < 1 ? 'sword'
          : (!u.gun && (u.ranged || 0) < 0.5 ? 'gun'
            : (!u.knife.owned && !knifeBlocked(g, u) ? 'knife'
              : (u.shield < 1 && u.items.shield < 1 ? 'shield' : null)));
        if (want) {
          if (g.nearShop(u)) return { type: 'buy', item: want };
          const shop = shopPlan(g, u, enemies);
          if (shop) return shop;
        }
      }
    }

    // 怪异树木：浮空目标优先吃远程普攻的必中效果
    if (u.key === 'tree') {
      const air = enemies.filter(t => t.airborne > 0 && !isInvincible(t) &&
        g.dist(u, t) > 1 && g.dist(u, t) <= u.rangedRange)
        .sort((a, b) => a.hp - b.hp);
      if (air.length) return { type: 'attack', targetId: air[0].id };
    }

    // 低血自救
    if (!u.inDungeon && needBlood(u) && u.items.blood > 0) return { type: 'item', item: 'blood' };

    // 天堂制造：能补刀倒地目标时先补刀，不把第二动浪费在购物/走位上。
    if (u.key === 'mih') {
      const finish = enemies.filter(t => t.downed && !u.knockedThisRound.has(t.id) &&
        !g.knifeGuardReady(t) && !isInvincible(t) &&
        (g.dist(u, t) <= 1 || (u.ranged && g.dist(u, t) <= u.rangedRange)))
        .sort((a, b) => a.hp - b.hp)[0];
      if (finish) return { type: 'attack', targetId: finish.id };
    }

    // 天堂制造：高收益商店路线（名刀 > 盾 > 血包）
    const mihShop = mihShopPlan(g, u, enemies);
    if (mihShop) return mihShop;
    if (u.key === 'mih') {
      const active = enemies.filter(t => !(t.downed && u.knockedThisRound.has(t.id)));
      if (!active.length) {
        const idle = mihNoTargetAction(g, u, enemies);
        if (idle) return idle;
      }
    }

    // 元帅赤犬：先冥狗处刑，再蓄力流星火山；第二次蓄力后自动落火雨
    if (u.key === 'akainu') {
      if (u.meteorCharge === 1 && ready(g, u, 'meteorVolcano')) {
        return { type: 'skill', id: 'meteorVolcano' };
      }
      const target = enemies.filter(t => !isInvincible(t) && !t.doomedUntil)
        .sort((a, b) => (b.maxHp || 0) - (a.maxHp || 0) || a.hp - b.hp)[0] || null;
      if (target && ready(g, u, 'meigo')) {
        return { type: 'skill', id: 'meigo', targetId: target.id };
      }
      if (enemies.length && ready(g, u, 'meteorVolcano')) {
        return { type: 'skill', id: 'meteorVolcano' };
      }
    }

    // 地牢白板：只能近战/移动，不能使用任何技能
    if (u.inDungeon) {
      if (u.root > 0) return { type: 'breakRoot' };
      const t = adjacentTarget(g, u, enemies);
      if (t) return { type: 'attack', targetId: t.id };
      return moveAction(g, u, enemies);
    }

    // 形态 / 节奏
    if (u.key === 'sharkteeth') {
      const rShop = ryougiShopPlan(g, u, enemies);
      if (rShop) return rShop;
      if (!u.sharkEye && ready(g, u, 'kaiGuang') && adjacentTarget(g, u, enemies)) {
        const t = adjacentTarget(g, u, enemies);
        return { type: 'skill', id: 'kaiGuang', targetId: t.id };
      }
    }
    if (u.key === 'fishknife' && ready(g, u, 'fishLeap')) {
      const targets = g.targetsFor(u, skillOf(u, 'fishLeap'))
        .filter(t => t.stun < 4)
        .sort((a, b) => (b.stun || 0) - (a.stun || 0) || a.hp - b.hp);
      if (targets.length) return { type: 'skill', id: 'fishLeap', targetId: targets[0].id };
    }
    if (u.key === 'li') {
      const t = adjacentTarget(g, u, enemies);
      if (t) return { type: 'attack', targetId: t.id };
      if (ready(g, u, 'nito')) {
        const far = lowestHp(enemies);
        if (far) return { type: 'skill', id: 'nito', targetId: far.id };
      }
      if (ready(g, u, 'tiger') && enemies.some(t => g.dist(u, t) <= 2)) return { type: 'skill', id: 'tiger' };
    }
    if (u.key === 'pain') {
      const superHits = enemies.filter(t => g.dist(u, t) <= 2).length;
      const shinraHits = enemies.filter(t => g.dist(u, t) <= 1).length;
      // 连招进行中优先收尾，避免中断 CD
      if ((u.painCombo || 0) === 1) {
        const t = adjacentTarget(g, u, enemies);
        if (t) return { type: 'skill', id: 'painCombo', targetId: t.id };
        return moveAction(g, u, enemies);
      }
      if ((u.painCombo || 0) >= 2) {
        const t = lowestHp(enemies);
        if (t) return { type: 'skill', id: 'painCombo', targetId: t.id };
      }
      // 未起手连招时，优先释放可用的高收益神罗
      if (ready(g, u, 'shinraSuper') && superHits) return { type: 'skill', id: 'shinraSuper' };
      if (ready(g, u, 'shinra') && shinraHits) return { type: 'skill', id: 'shinra' };
      if (!u.painCombo && ready(g, u, 'painCombo')) {
        const t = lowestHp(enemies);
        if (t) return { type: 'skill', id: 'painCombo', targetId: t.id };
      }
      if (ready(g, u, 'shinraSuper') && superHits) return { type: 'skill', id: 'shinraSuper' };
      if (ready(g, u, 'shinra') && shinraHits) return { type: 'skill', id: 'shinra' };
    }
    if (u.key === 'hakuno') {
      const t = lowestHp(enemies);
      const adj = adjacentTarget(g, u, enemies);
      const close = enemies.some(e => g.dist(u, e) <= 2);
      // 近战改为 1 后，贴身优先用普攻收人；只有月之棺能覆盖多人时才先开月棺
      if (adj && (adj.hp <= 1 || enemies.length < 2 || !ready(g, u, 'moonCoffin'))) {
        return { type: 'attack', targetId: adj.id };
      }
      // 敌人已近身时降低 C3 权重，优先走位/普攻，而不是无脑先手眩晕
      if (ready(g, u, 'moonCoffin') && (enemies.length >= 2 || (t && t.hp <= 0.5))) return { type: 'skill', id: 'moonCoffin' };
      if (!close && ready(g, u, 'c3') && t) return { type: 'skill', id: 'c3', targetId: t.id };
      if (ready(g, u, 'moonCoffin')) return { type: 'skill', id: 'moonCoffin' };
    }
    if (u.key === 'mugram') {
      const adj = adjacentTarget(g, u, enemies);
      const charges = u.carianCharges || 0;
      const pierceDmg = 1 + charges * 0.5;
      const pierceOpts = charges >= 3 ? { armorBreak: true, ignoreDefense: true, noReduce: true } : {};
      if (adj && canFinishNow(g, u, enemies)) return { type: 'attack', targetId: adj.id };
      const pierceTargets = g.targetsFor(u, skillOf(u, 'carianPierce'))
        .filter(t => !isInvincible(t))
        .map(t => ({ t, sc: scoreDamage(g, u, t, pierceDmg, pierceOpts) }))
        .sort((a, b) => b.sc - a.sc);
      const target = pierceTargets[0] && pierceTargets[0].t;
      const canFinishTarget = (t) => {
        if (!t || isInvincible(t)) return false;
        if (t.downed) return true;
        if (t.key === 'drill' && !t.drillLockUsed) return false;
        if (t.knife && t.knife.owned && !t.knife.used) return false;
        let raw = pierceDmg;
        if (!pierceOpts.ignoreDefense) raw = Math.max(0, raw - (t.defense || 0));
        if (!pierceOpts.noReduce) raw *= (1 - (t.reduction || 0));
        if (!pierceOpts.armorBreak && (t.block || 0) > 0) return false;
        if (!pierceOpts.armorBreak) raw = Math.max(0, raw - (t.shield || 0));
        return raw >= t.hp;
      };
      const isFortifiedHighHp = t => !!t && (t.maxHp || 0) >= 1.5 &&
        ((t.defense || 0) > 0 || (t.reduction || 0) > 0 || (t.shield || 0) > 0 ||
          (t.block || 0) > 0 || t.key === 'trainer' || t.key === 'drill' || t.key === 'whitebeard');
      const fortifiedTarget = pierceTargets.find(x => isFortifiedHighHp(x.t));
      const fortified = fortifiedTarget && fortifiedTarget.t;
      // 高生命 + 防御强化目标：不足 3 层时优先蓄满，让贯刺吃到破防收益。
      if (fortified && !canFinishTarget(fortified) && ready(g, u, 'carianCharge') && charges < 3) {
        return { type: 'skill', id: 'carianCharge' };
      }
      // 3 层贯刺优先砸在高生命/有防御强化的目标上，而不是只看残血。
      if (ready(g, u, 'carianPierce') && fortified && charges >= 3) {
        return { type: 'skill', id: 'carianPierce', targetId: fortified.id };
      }
      // 蓄力会自动进入奉还，因此能在贴脸时先蓄力就不单独交奉还。
      if (ready(g, u, 'carianPierce') && target && canFinishTarget(target)) {
        return { type: 'skill', id: 'carianPierce', targetId: target.id };
      }
      // 安全距离下提高商店权重：优先补盾/名刀，再回来蓄力。
      if (!pierceTargets.length && nearestDist(g, u, enemies) > 3) {
        const shop = shopPlan(g, u, enemies);
        if (shop) return shop;
      }
      // 射程外先接近，不要在远处空蓄力让奉还架势过期。
      if (!pierceTargets.length && nearestDist(g, u, enemies) > 3 + charges * 2) {
        return moveAction(g, u, enemies);
      }
      if (ready(g, u, 'carianCharge') && charges < 3) {
        return { type: 'skill', id: 'carianCharge' };
      }
      if (ready(g, u, 'carianPierce') && target && charges >= 3) {
        return { type: 'skill', id: 'carianPierce', targetId: target.id };
      }
      if (adj && ready(g, u, 'carianReturn') && !u.counterStance) {
        return { type: 'skill', id: 'carianReturn' };
      }
      if (adj) return { type: 'attack', targetId: adj.id };
      if (!pierceTargets.length) return moveAction(g, u, enemies);
    }
    if (u.key === 'millicent') {
      if (u.root > 0) return { type: 'breakRoot' };
      const stage = u.millicentCombo || 0;
      if (stage === 1) return moveAction(g, u, enemies);
      const skill = skillOf(u, 'waterfowl');
      const cells = skill && skill.cells ? skill.cells(g, u) : [];
      if (!cells.length) return moveAction(g, u, enemies);
      let best = null, bestScore = -1e9;
      for (const c of cells) {
        const near = enemies.filter(t => !t.stealth && g.distXY(t, c.x, c.y) <= 1);
        let sc = near.length * 30;
        if (stage === 3) {
          sc += near.filter(t => t.downed).length * 55;
          sc += near.filter(t => !t.downed).length * 25;
        }
        if (sc > bestScore) { bestScore = sc; best = c; }
      }
      if (best) {
        if (bestScore <= 0) return moveAction(g, u, enemies);
        return { type: 'skill', id: 'waterfowl', x: best.x, y: best.y };
      }
      return moveAction(g, u, enemies);
    }
    if (u.key === 'bernahl') {
      const targets = g.targetsFor(u, skillOf(u, 'devourFlame'));
      const devourReady = ready(g, u, 'devourFlame');
      const finish = canFinishNow(g, u, enemies);
      if (!finish) {
        if (devourReady && targets.length && (u.hp < u.maxHp || targets.length >= 2)) {
          return { type: 'skill', id: 'devourFlame' };
        }
        if (!u.goldenVow && ready(g, u, 'goldenVow')) return { type: 'skill', id: 'goldenVow' };
        if (devourReady && targets.length) return { type: 'skill', id: 'devourFlame' };
      }
    }
    if (u.key === 'jotaro' && !u.flags.star && ready(g, u, 'star') && !canFinishNow(g, u, enemies)) return { type: 'skill', id: 'star' };
    if (u.key === 'aokiji' && ready(g, u, 'iceAge') && enemies.filter(e => !e.frozen).length >= 2) return { type: 'skill', id: 'iceAge' };
    if (u.key === 'aokiji' && ready(g, u, 'seal') && !(u.invincibleUntilAction > u.actionsTaken) && enemies.some(e => g.dist(u, e) <= 1)) {
      const t = lowestHp(enemies.filter(e => g.dist(u, e) <= 1));
      if (t) return { type: 'skill', id: 'seal', targetId: t.id };
    }
    if (u.key === 'changkai' && ready(g, u, 'massacre') && shouldMassacre(g, u, enemies)) return { type: 'skill', id: 'massacre' };
    if (u.key === 'van' && !u.inDungeon && ready(g, u, 'dungeonDuel') && !g.duelActive && !g.pendingDuel) {
      const t = g.targetsFor(u, skillOf(u, 'dungeonDuel'))
        .sort((a, b) => (b.melee + b.ranged) - (a.melee + a.ranged))[0];
      if (t) return { type: 'skill', id: 'dungeonDuel', targetId: t.id };
    }
    if (u.key === 'moshuiliang' && !u.jeep && ready(g, u, 'jeep') && !canFinishNow(g, u, enemies)) {
      return { type: 'skill', id: 'jeep' };
    }
    if (u.key === 'whitebeard' && !u.leaderGuard && ready(g, u, 'leader') && !canFinishNow(g, u, enemies)) {
      return { type: 'skill', id: 'leader' };
    }
    if (u.key === 'trainer' && !u.carrying && ready(g, u, 'guard')) {
      const a = g.alliesOf(u)
        .filter(x => g.dist(u, x) <= 1 && !x.carriedBy)
        .sort((x, y) => x.hp - y.hp)[0];
      if (a) return { type: 'skill', id: 'guard', targetId: a.id };
    }
    if (u.key === 'cgil') {
      const easy = adjacentTarget(g, u, enemies);
      const canFinish = !!(easy && easy.hp <= 1.0 && !easy.shield && !(easy.defense || 0) && !(easy.block || 0));
      if (!canFinish && u.kingAmmo <= 0 && ready(g, u, 'kingBarrage')) return { type: 'skill', id: 'kingBarrage' };
      if (!canFinish && u.kingAmmo > 0 && ready(g, u, 'kingVolley')) {
        const t = lowestHp(enemies.filter(e => !isInvincible(e)));
        if (t) return { type: 'skill', id: 'kingVolley', targetId: t.id };
      }
      if (!canFinish && !u.evadeUses && ready(g, u, 'clairvoyance')) {
        return { type: 'skill', id: 'clairvoyance' };
      }
    }

    // 蓄力 / 突刺
    if (u.key === 'kukuang') {
      if (u.charge === 'kukuang') {
        const t = lowestHp(enemies);
        if (t) return { type: 'skill', id: 'rageThrust', targetId: t.id };
      } else if (u.chargesUsed < 3 && ready(g, u, 'rage') && u.hp > 0.5 && !adjacentTarget(g, u, enemies)) {
        // 贴脸时先普攻；只有在无法立刻普攻/可安全蓄力时才蓄力
        return { type: 'skill', id: 'rage' };
      }
    }
    if (u.key === 'jotaro' && u.flags.star) {
      const near = adjacentTarget(g, u, enemies);
      const ranged = inRangeTarget(g, u, enemies, 3);
      if (u.charge === 'finger') {
        if (ranged && (g.dist(u, ranged) > 1 || ranged.hp <= 1.0 || ranged.shield > 0 || ranged.defense >= 0.25)) {
          return { type: 'skill', id: 'fingerHit', targetId: ranged.id };
        }
        // 贴脸且普攻 1.5 更划算时，不急着交指刺
      } else if (ready(g, u, 'finger') && ranged && !near) {
        // 普攻够不到时才用指刺蓄力；贴脸优先 1.5 普攻
        return { type: 'skill', id: 'finger' };
      }
    }
    if (u.key === 'oldman' && ready(g, u, 'deathAngel')) {
      const t = adjacentTarget(g, u, enemies);
      if (t) {
        if (!u.flags.mourning && ready(g, u, 'mourning')) return { type: 'skill', id: 'mourning' };
        return { type: 'skill', id: 'deathAngel', targetId: t.id };
      }
    }

    // 治疗 / 维修
    if (u.key === 'rakshasa' && ready(g, u, 'recover')) {
      const allies = 1 + g.alliesOf(u).filter(a => !a.dead && !a.removed).length;
      if (allies < enemies.length) {
        // 人少时恢复 0.5 的收益追不上对方人数优势，优先保留行动做别的事。
      } else {
        const pool = [u].concat(g.alliesOf(u).filter(a => g.dist(u, a) <= 1));
        const t = lowestHp(pool);
        if (t && t.hp < t.maxHp) return { type: 'skill', id: 'recover', targetId: t.id };
      }
    }
    if (u.key === 'icehalberd' && ready(g, u, 'repair')) {
      const threats = enemies.filter(e => g.dist(u, e) <= 2);
      const adjacent = threats.filter(e => g.dist(u, e) === 1);
      // 只在低盾（0/0.5）且有远程压力时维修；1.0 修到 1.5 收益太低，贴脸则优先普攻
      if (u.shield <= 0.5 && threats.length && !adjacent.length) {
        return { type: 'skill', id: 'repair' };
      }
    }

    // 安全时优先补充装备与补给；没有金币门槛。
    if (!refusesShop(u) && g.nearShop(u) && nearestDist(g, u, enemies) > 2) {
      const want = decideBuy(g, u);
      if (want) return { type: 'buy', item: want };
    }

    // 藤虎：陨石是最高优先级的一次性收益
    if (u.key === 'fujitora' && ready(g, u, 'meteor') && g.round >= 2) {
      const t = enemies.filter(e => !isInvincible(e) && g.dist(u, e) <= 8)
        .sort((a, b) => (b.maxHp || 0) - (a.maxHp || 0) || a.hp - b.hp)[0];
      if (t) return { type: 'skill', id: 'meteor', targetId: t.id };
    }

    const best = bestOffense(g, u, enemies);
    if (best) return best;

    if (u.root > 0) return { type: 'breakRoot' };
    if (!u.inDungeon && needBlood(u) && u.items.blood > 0) return { type: 'item', item: 'blood' };
    if (!u.inDungeon && u.shield < Math.max(1, u.shieldCap) && u.items.shield > 0) return { type: 'item', item: 'shield' };

    const shop = shopPlan(g, u, enemies);
    if (shop) return shop;

    return moveAction(g, u, enemies);
  };

  AI.apply = function (g, u, act) {
    if (!act) return g.pass(u);
    switch (act.type) {
      case 'stand': return g.stand(u);
      case 'unfreeze': return g.unfreeze(u);
      case 'breakStun': return g.breakStun(u);
      case 'breakRoot': return g.breakRoot(u);
      case 'shot': return g.resolveShot(u);
      case 'move': return u.root > 0 ? g.breakRoot(u) : g.move(u, act.x, act.y);
      case 'freeMove': return g.freeMove(u, act.x, act.y);
      case 'endTurn': return g.endTurnAfterFreeMove(u);
      case 'attack': return g.basicAttack(u, act.targetId);
      case 'skill': return g.useSkill(u, act.id, act.targetId, { tier: act.tier, x: act.x, y: act.y });
      case 'buy': return g.buy(u, act.item);
      case 'item': return g.useItem(u, act.item);
      case 'pass': return g.pass(u);
      default: return g.pass(u);
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);


</script>
<script>
/* 速开对决 — 战报生成（无 DOM 依赖，可在 Node 中直接测试） */
(function (root) {
  'use strict';
  const WX = (root.WX = root.WX || {});

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function fmt(v) {
    return (Math.round(Number(v || 0) * 10) / 10).toString();
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) {
    if (!d) return '—';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function statusText(u) {
    if (u.removed) return '移除';
    if (u.dead) return '阵亡';
    if (u.downed) return '倒地';
    return '存活';
  }

  function build(game, opts) {
    opts = opts || {};
    if (!game) return null;
    const units = game.units.map(u => {
      const st = u.stats || {};
      return {
        id: u.id, key: u.key, name: u.name, short: u.short, color: u.color, team: u.team,
        hp: u.hp, maxHp: u.maxHp, downed: u.downed, dead: u.dead, removed: u.removed,
        alive: !u.dead && !u.removed,
        kills: st.kills || (u.kills ? u.kills.length : 0),
        dealt: st.dealt || 0, taken: st.taken || 0, healed: st.healed || 0,
        actions: st.actions || 0, skills: st.skills || 0,
        copiedPassive: u.copiedPassive ? {
          name: u.copiedPassive.name,
          desc: u.copiedPassive.desc,
          sourceKey: u.copiedPassive.sourceKey
        } : null,
        copiedSkills: (u.copiedSkills || []).map(s => ({
          id: s.id, name: s.name, desc: s.desc || ''
        }))
      };
    });
    const nameCount = {};
    units.forEach(u => { nameCount[u.name] = (nameCount[u.name] || 0) + 1; });
    const nameSeen = {};
    units.forEach(u => {
      nameSeen[u.name] = (nameSeen[u.name] || 0) + 1;
      u.label = nameCount[u.name] > 1 ? u.name + ' #' + nameSeen[u.name] : u.name;
    });
    const left = units.filter(u => u.team === 'left');
    const right = units.filter(u => u.team === 'right');
    const winnerText = !game.over ? '进行中' :
      (game.winner === 'left' ? '蓝方获胜' : game.winner === 'right' ? '红方获胜' : '平局');
    const baseMode = opts.pvp ? '联机 PvP' : (opts.autoBattle ? '自动对战（AI vs AI）' : (opts.demo ? '演示对局' : '玩家 vs AI'));
    const sizeLabel = opts.clone ? '克隆 4v4' : (opts.mode === '1v1' ? '1v1' : (opts.mode === '2v2' ? '2v2' : ''));
    const modeText = baseMode + (sizeLabel ? ' · ' + sizeLabel : '');
    const started = game.startedAt ? new Date(game.startedAt) : new Date();
    const ended = game.endedAt ? new Date(game.endedAt) : new Date();
    const secs = Math.max(1, Math.round((ended - started) / 1000));
    const duration = secs >= 60 ? Math.floor(secs / 60) + '分' + (secs % 60) + '秒' : secs + '秒';
    const score = u => u.kills * 100 + u.dealt * 4 + u.healed * 2 + (u.alive ? 15 : 0);
    const ranked = units.slice().sort((a, b) => score(b) - score(a));
    const mvp = ranked.length && score(ranked[0]) > 0 ? ranked[0] : null;
    const keyCls = new Set(['kill', 'death', 'timestop', 'knife', 'gameover', 'dungeon']);
    const keyEvents = game.logs.filter(l => keyCls.has(l.cls) || /滥杀无辜|阵亡|移除|获胜|平局/.test(l.msg));
    const rounds = [];
    game.logs.forEach(l => { const r = l.round || 0; (rounds[r] = rounds[r] || []).push(l); });

    const data = {
      round: game.round,
      over: game.over,
      winner: game.winner,
      winnerText, modeText, started, ended, duration,
      units, left, right, mvp, keyEvents, rounds,
      logCount: game.logs.length,
      totalKills: units.reduce((s, u) => s + u.kills, 0),
      totalDealt: units.reduce((s, u) => s + u.dealt, 0)
    };
    data.markdown = markdown(data);
    data.html = html(data);
    return data;
  }

  function markdown(d) {
    const lines = [];
    lines.push('# 速开对决 · 战报', '');
    lines.push('- 生成时间：' + fmtDate(new Date()));
    lines.push('- 开局时间：' + fmtDate(d.started));
    lines.push('- 模式：' + d.modeText);
    lines.push('- 结果：' + d.winnerText);
    lines.push('- 回合：第 ' + d.round + ' 回合');
    lines.push('- 用时：' + d.duration);
    lines.push('- 总击杀：' + d.totalKills);
    lines.push('');
    lines.push('## 阵容', '');
    lines.push('**蓝方**：' + d.left.map(u => u.label).join('、'));
    lines.push('**红方**：' + d.right.map(u => u.label).join('、'));
    lines.push('');

    const copied = d.units.filter(u => u.copiedPassive || (u.copiedSkills && u.copiedSkills.length));
    if (copied.length) {
      lines.push('## 复制能力', '');
      copied.forEach(u => {
        lines.push('### ' + u.label, '');
        if (u.copiedPassive) {
          lines.push('- 被动：**' + u.copiedPassive.name + '** — ' + (u.copiedPassive.desc || ''));
        }
        if (u.copiedSkills && u.copiedSkills.length) {
          u.copiedSkills.forEach(s => {
            lines.push('- 技能：**' + s.name + '**' + (s.desc ? ' — ' + s.desc : ''));
          });
        }
        lines.push('');
      });
    }

    lines.push('## 核心数据', '');
    lines.push('| 单位 | 阵营 | 击杀 | 输出 | 承伤 | 治疗 | 行动 | 技能 | 结果 |');
    lines.push('| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |');
    d.units.forEach(u => {
      lines.push('| ' + u.label + ' | ' + (u.team === 'left' ? '蓝' : '红') + ' | ' + u.kills + ' | ' +
        fmt(u.dealt) + ' | ' + fmt(u.taken) + ' | ' + fmt(u.healed) + ' | ' + u.actions + ' | ' +
        u.skills + ' | ' + statusText(u) + ' |');
    });
    lines.push('');
    lines.push('## MVP', '');
    if (d.mvp) {
      lines.push('**' + d.mvp.label + '**（' + (d.mvp.team === 'left' ? '蓝方' : '红方') + '）— 击杀 ' +
        d.mvp.kills + '，输出 ' + fmt(d.mvp.dealt) + '，承伤 ' + fmt(d.mvp.taken) + '，治疗 ' + fmt(d.mvp.healed) + '。');
    } else {
      lines.push('暂无（对局刚开始）');
    }
    lines.push('');
    lines.push('## 关键事件', '');
    if (!d.keyEvents.length) lines.push('- 暂无');
    else d.keyEvents.forEach(e => lines.push('- R' + e.round + ' ' + e.msg));
    lines.push('');
    lines.push('## 完整战报', '');
    d.rounds.forEach((logs, r) => {
      if (!logs || !logs.length) return;
      lines.push('### 第 ' + r + ' 回合');
      logs.forEach(e => lines.push('- ' + e.msg));
      lines.push('');
    });
    return lines.join('\n');
  }

  function html(d) {
    const resultClass = d.over && d.winner === 'left' ? 'win' : (d.over && d.winner === 'right' ? 'lose' : '');
    let out = '<div class="report-summary">' +
      '<div class="report-kpi ' + resultClass + '"><span>结果</span><b>' + esc(d.winnerText) + '</b></div>' +
      '<div class="report-kpi"><span>模式</span><b style="font-size:13px">' + esc(d.modeText) + '</b></div>' +
      '<div class="report-kpi"><span>回合</span><b>' + d.round + '</b></div>' +
      '<div class="report-kpi"><span>用时</span><b>' + esc(d.duration) + '</b></div>' +
      '<div class="report-kpi"><span>总击杀</span><b>' + d.totalKills + '</b></div>' +
      '<div class="report-kpi"><span>总输出</span><b>' + fmt(d.totalDealt) + '</b></div>' +
      '</div>';

    out += '<div class="report-teams">' +
      '<div class="report-team left"><h4>蓝方 · ' + d.left.length + ' 人</h4><p>' + d.left.map(u => esc(u.label)).join('、') + '</p></div>' +
      '<div class="report-team right"><h4>红方 · ' + d.right.length + ' 人</h4><p>' + d.right.map(u => esc(u.label)).join('、') + '</p></div>' +
      '</div>';

    const copied = d.units.filter(u => u.copiedPassive || (u.copiedSkills && u.copiedSkills.length));
    if (copied.length) {
      out += '<div class="report-section"><h3>复制能力</h3>';
      copied.forEach(u => {
        out += '<div class="report-copy"><div class="report-copy-name">' + esc(u.label) + '</div>';
        if (u.copiedPassive) {
          out += '<div class="report-copy-line"><b>被动 · ' + esc(u.copiedPassive.name) + '</b><span>' +
            esc(u.copiedPassive.desc || '') + '</span></div>';
        }
        (u.copiedSkills || []).forEach(s => {
          out += '<div class="report-copy-line"><b>技能 · ' + esc(s.name) + '</b><span>' +
            esc(s.desc || '') + '</span></div>';
        });
        out += '</div>';
      });
      out += '</div>';
    }

    if (d.mvp) {
      out += '<div class="report-section"><h3>MVP</h3><div class="report-mvp">' +
        '<div class="mvp-name">' + esc(d.mvp.label) + '</div>' +
        '<div class="mvp-meta">' + (d.mvp.team === 'left' ? '蓝方' : '红方') +
        ' · 击杀 ' + d.mvp.kills + ' · 输出 ' + fmt(d.mvp.dealt) + ' · 承伤 ' + fmt(d.mvp.taken) +
        ' · 治疗 ' + fmt(d.mvp.healed) + '</div></div></div>';
    }

    out += '<div class="report-section"><h3>核心数据</h3><div class="report-table-wrap"><table class="report-table"><thead><tr>' +
      '<th>单位</th><th>阵营</th><th class="num">击杀</th><th class="num">输出</th><th class="num">承伤</th>' +
      '<th class="num">治疗</th><th class="num">行动</th><th class="num">技能</th><th>结果</th></tr></thead><tbody>';
    d.units.forEach(u => {
      out += '<tr' + (d.mvp && d.mvp.id === u.id ? ' class="mvp"' : '') + '>' +
        '<td>' + esc(u.label) + '</td><td class="pt">' + (u.team === 'left' ? '蓝' : '红') + '</td>' +
        '<td class="num">' + u.kills + '</td><td class="num">' + fmt(u.dealt) + '</td>' +
        '<td class="num">' + fmt(u.taken) + '</td><td class="num">' + fmt(u.healed) + '</td>' +
        '<td class="num">' + u.actions + '</td><td class="num">' + u.skills + '</td>' +
        '<td>' + statusText(u) + '</td></tr>';
    });
    out += '</tbody></table></div></div>';

    out += '<div class="report-section"><h3>关键事件</h3>';
    if (!d.keyEvents.length) out += '<div class="report-empty">暂无关键事件</div>';
    else {
      out += '<ul class="report-events">';
      d.keyEvents.forEach(e => {
        out += '<li><span class="rd">R' + e.round + '</span>' + esc(e.msg) + '</li>';
      });
      out += '</ul>';
    }
    out += '</div>';

    out += '<div class="report-details"><details><summary>完整战报（' + d.logCount + ' 条）</summary><div class="report-log">';
    if (!d.logCount) out += '暂无记录';
    else {
      d.rounds.forEach(logs => {
        if (!logs || !logs.length) return;
        logs.forEach(e => {
          out += '<div class="rline ' + e.cls + '"><span class="rd">R' + e.round + '</span>' + esc(e.msg) + '</div>';
        });
      });
    }
    out += '</div></details></div>';
    out += '<div class="report-hint">战报根据当前对局实时生成；「复制 Markdown」或「下载 .md」可保存。</div>';
    return out;
  }

  WX.Report = { build, markdown, html };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 速开对决 — 界面与交互 */
(function () {
  'use strict';
  const WX = window.WX;
  const C = WX.CONST;
  const $ = s => document.querySelector(s);

  const UI = {
    game: null,
    selected: new Set(['gil', 'li', 'aokiji', 'jotaro']),
    tokens: new Map(),
    cellEls: [],
    targetSkill: null,
    pending: null,
    mode: 'idle',
    lastLogId: 0,
    lastLogCount: 0,
    aiToken: 0,
    speed: 680,
    demo: false,
    autoplay: false,
    autoBattle: false,
    matchMode: 'classic',
    cloneMode: false,
    opponentPick: 'random',
    startActionsCollapsed: false,
    pvp: false,
    pvpRole: null,
    pvpLocalTeam: 'left',
    pvpPeer: null,
    pvpConn: null,
    pvpCode: '',
    pvpGuestKeys: null,
    pvpGuestReady: false,
    pvpReady: false,
    pvpWelcome: false,
    pvpRetry: 0,
    pvpRetryTimer: null,
    pvpConnTimer: null,
    pvpPC: null,
    pvpDC: null,
    pvpES: null,
    pvpWS: null,
    pvpWSRetryTimer: null,
    pvpPollTimer: null,
    pvpPollSince: 'all',
    pvpLastSignalId: '',
    pvpOfferTimer: null,
    pvpSignalTimer: null,
    pvpSignalSession: '',
    pvpRemoteIce: [],
    pvpGuestAnswered: false,
    pvpGuestAnswer: null,
    pvpHostIce: [],
    pvpOpen: false,
    netBusy: false,
    netApply: false,
    moveMode: false,
    freeMoveMode: false,
    lastReport: null,
    lastMode: 'normal',
    bannerRound: 0,
    bannerTimer: 0,
    killQueue: [],
    killTimer: 0,
    killShowing: false,
    grantedIds: new Set(),
    grantedTimer: 0,
    toastTimer: 0,
    overShown: false,
    lastLineup: null
  };
  window.WXUI = UI;

  const MODES = {
    classic: {
      min: 3, max: 5, random: 4, label: '经典 3–5',
      desc: '选择 3–5 名单位；其余单位由 AI 随机补齐，双方从战场两侧进入。'
    },
    '1v1': {
      min: 1, max: 1, random: 1, label: '1v1',
      desc: '选择 1 名单位，与 AI 随机 1 名单挑。'
    },
    '2v2': {
      min: 2, max: 2, random: 2, label: '2v2',
      desc: '选择 2 名单位，与 AI 随机 2 名对战。'
    },
    clone: {
      min: 1, max: 1, random: 1, label: '克隆 4v4',
      desc: '选择 1 名单位作为克隆体，双方各复制 4 个同角色克隆。'
    }
  };

  function isLocalTeam(team) {
    return UI.pvp ? team === UI.pvpLocalTeam : team === 'left';
  }
  function isLocalUnit(u) {
    return !!u && isLocalTeam(u.team);
  }

  /* ------------------------------ 工具 ------------------------------ */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function hpClass(u) {
    const r = u.hp / u.maxHp;
    if (r <= 0.3) return 'crit';
    if (r <= 0.6) return 'low';
    return '';
  }
  function fmt(v) {
    const n = Number(v) || 0;
    const r = Math.round(n * 100) / 100;
    if (Math.abs(r - Math.round(r)) < 1e-9) return String(Math.round(r));
    if (Math.abs(r * 10 - Math.round(r * 10)) < 1e-9) return r.toFixed(1);
    return r.toFixed(2);
  }
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ------------------------------ 选人 ------------------------------ */
  function buildRoster() {
    const grid = $('#rosterGrid');
    grid.innerHTML = '';
    WX.ROSTER.forEach(key => {
      const def = WX.UNITS[key];
      const card = document.createElement('div');
      card.className = 'unit-card' + (UI.selected.has(key) ? ' selected' : '');
      card.style.setProperty('--c', def.color);
      card.dataset.key = key;
      const skillNames = def.skills.length
        ? def.skills.slice(0, 2).map(s => s.name).join(' · ')
        : '无主动技能';
      card.innerHTML =
        '<div class="uc-head">' +
          '<div class="uc-glyph">' + esc(def.short) + '</div>' +
          '<div><div class="uc-name" title="' + esc(def.name) + '">' + esc(def.name) + '</div><div class="uc-role">' + esc(def.role) + '</div></div>' +
        '</div>' +
        '<div class="uc-stats">' +
          '<span>HP ' + def.hp + '</span>' +
          '<span>近战 ' + fmt(def.melee || 0) + '</span>' +
          (def.ranged ? '<span>远程 ' + fmt(def.ranged) + '</span>' : '') +
        '</div>' +
        '<div class="uc-skills">' + esc(skillNames) + '</div>' +
        '<button class="uc-info" title="查看完整技能与被动">?</button>';
      card.addEventListener('click', e => {
        if (e.target.closest('.uc-info')) { e.stopPropagation(); showUnitByKey(key); return; }
        togglePick(key);
      });
      card.querySelector('.uc-info').addEventListener('click', e => {
        e.stopPropagation();
        e.preventDefault();
        showUnitByKey(key);
      });
      grid.appendChild(card);
    });
  }

  function togglePick(key) {
    if (UI.pvpRole && (UI.pvpReady || UI.pvpGuestReady)) { toast('已准备，不能更改阵容'); return; }
    const cfg = MODES[UI.matchMode] || MODES.classic;
    if (UI.selected.has(key)) UI.selected.delete(key);
    else if (UI.selected.size >= cfg.max) {
      if (cfg.max <= 2) {
        const first = [...UI.selected][0];
        if (first) UI.selected.delete(first);
        UI.selected.add(key);
      } else {
        toast('当前模式最多 ' + cfg.max + ' 名单位');
        return;
      }
    } else {
      UI.selected.add(key);
    }
    buildRoster();
    updatePickCount();
  }

  function setStartActionsCollapsed(collapsed) {
    UI.startActionsCollapsed = !!collapsed;
    const screen = $('#startScreen');
    if (screen) screen.classList.toggle('actions-collapsed', UI.startActionsCollapsed);
    const bar = $('#startActions');
    if (bar) bar.classList.toggle('collapsed', UI.startActionsCollapsed);
    const btn = $('#startActionsToggle');
    if (btn) {
      btn.textContent = UI.startActionsCollapsed ? '展开操作 ▴' : '收起操作 ▾';
      btn.setAttribute('aria-expanded', UI.startActionsCollapsed ? 'false' : 'true');
    }
  }

  function updatePickCount() {
    const cfg = MODES[UI.matchMode] || MODES.classic;
    $('#pickCount').textContent = UI.selected.size;
    const maxEl = $('#pickMax');
    if (maxEl) maxEl.textContent = cfg.max;
    const btn = $('#startBtn');
    if (UI.pvpOpen) {
      btn.disabled = true;
      btn.textContent = '联机房间中';
    } else {
      btn.disabled = UI.selected.size < cfg.min || UI.selected.size > cfg.max;
      btn.textContent = UI.matchMode === 'clone' ? '开始克隆对战' : '开始对战';
    }
    if ($('#pickDesc')) {
      $('#pickDesc').textContent = (UI.pvpOpen || UI.pvpRole)
        ? '联机 PvP：双方各自选择阵容，准备好后由房主开始对战。'
        : cfg.desc;
    }
    document.querySelectorAll('.mode-chip').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === UI.matchMode);
    });
  }

  function setMode(mode) {
    if (!MODES[mode]) return;
    if (UI.pvpRole && (UI.pvpReady || UI.pvpGuestReady)) { toast('已准备，不能切换模式'); return; }
    UI.matchMode = mode;
    const cfg = MODES[mode];
    if (UI.selected.size > cfg.max) {
      UI.selected = new Set([...UI.selected].slice(0, cfg.max));
    }
    buildRoster();
    updatePickCount();
  }

  function randomLineup(size) {
    const pool = WX.ROSTER.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, size);
  }

  function buildOpponentSelect() {
    const sel = $('#opponentSelect');
    if (!sel) return;
    sel.innerHTML = '<option value="random">随机对手</option>' +
      WX.ROSTER.map(k => '<option value="' + k + '">' + esc(WX.UNITS[k].name) + '</option>').join('');
    sel.value = UI.opponentPick;
    sel.onchange = () => {
      UI.opponentPick = sel.value;
      toast(sel.value === 'random' ? 'AI 对手：随机' : 'AI 对手：' + WX.UNITS[sel.value].name);
    };
  }

  function enemyLineup(size, leftKeys) {
    const left = new Set(leftKeys || []);
    const pick = UI.opponentPick;
    if (!WX.UNITS[pick] || pick === 'random') {
      const pool = WX.ROSTER.filter(k => !left.has(k));
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, size);
    }
    const out = [pick];
    const pool = WX.ROSTER.filter(k => k !== pick && !left.has(k));
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    while (out.length < size && pool.length) out.push(pool.shift());
    return out.slice(0, size);
  }

  /* ------------------------------ 开局 ------------------------------ */
  function startGame(leftKeys, rightKeys, opts) {
    opts = opts || {};
    const params = new URLSearchParams(location.search);
    UI.autoBattle = !!opts.autoBattle;
    UI.pvp = !!opts.pvp;
    UI.pvpRole = opts.pvpRole || null;
    UI.pvpLocalTeam = opts.localTeam || 'left';
    UI.netBusy = false;
    UI.netApply = false;
    UI.pvpOpen = false;
    const pvpPanel = $('#pvpPanel');
    if (pvpPanel) pvpPanel.classList.add('hidden');
    if (UI.pvp) UI.autoBattle = false;
    UI.matchMode = opts.mode || UI.matchMode || 'classic';
    UI.cloneMode = !!opts.clone || UI.matchMode === 'clone';
    UI.lastMode = UI.autoBattle ? 'auto' : 'normal';
    UI.game = null;
    UI.tokens.forEach(el => el.remove());
    UI.tokens.clear();
    UI.targetSkill = null;
    UI.pending = null;
    UI.moveMode = false;
    UI.mode = 'play';
    UI.bannerRound = 0;
    UI.killQueue = [];
    UI.killShowing = false;
    clearTimeout(UI.killTimer);
    UI.killTimer = 0;
    const killBanner = $('#killBanner');
    if (killBanner) { killBanner.classList.remove('show'); killBanner.innerHTML = ''; }
    UI.grantedIds.clear();
    clearTimeout(UI.grantedTimer);
    UI.overShown = false;
    UI.lastLogId = 0;
    UI.lastLogCount = 0;
    UI.autoplay = false;
    UI.lastReport = null;
    clearTimeout(UI.bannerTimer);
    if (UI.autoBattle) UI.speed = params.has('fast') ? 120 : 380;
    else if (!UI.demo) UI.speed = params.has('fast') ? 120 : 680;
    $('#gameOver').classList.add('hidden');
    $('#reportModal').classList.add('hidden');
    $('#startScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#fx').innerHTML = '';
    $('#banner').classList.remove('show');

    buildCells();

    const seeded = params.get('seed');
    const rng = opts.seed != null
      ? mulberry32((Number(opts.seed) || 0) >>> 0)
      : (seeded ? mulberry32(hashSeed(seeded)) : Math.random);

    UI.lastLineup = {
      left: leftKeys.slice(), right: rightKeys.slice(),
      autoBattle: UI.autoBattle, mode: UI.matchMode, clone: UI.cloneMode,
      pvp: UI.pvp, localTeam: UI.pvpLocalTeam
    };
    UI.game = new WX.Game({
      rng,
      hooks: {
        onTurn: onTurn,
        onUpdate: () => { if (UI.game) sync(); },
        onFloat: floatUnit,
        onFloatAt: floatAt,
        onImpact: impactUnit,
        onSkill: playSkillFx,
        onKill: announceKill,
        onGameOver: onGameOver
      }
    });
    UI.game.setup(leftKeys, rightKeys);
    if (UI.pvp) pvpInstall(UI.game);
  }

  function onTurn(u) {
    UI.aiToken += 1;
    UI.targetSkill = null;
    UI.pending = null;
    UI.moveMode = false;
    const auto = UI.autoBattle || (!UI.pvp && u.team === 'left' && UI.autoplay);
    const local = isLocalUnit(u) && !UI.demo && !auto;
    UI.mode = local ? 'player' : 'ai';
    sync();
    if (UI.game.over) return;
    if (!UI.pvp && (u.team === 'right' || UI.demo || auto)) {
      const token = UI.aiToken;
      setTimeout(() => aiStep(u, token), UI.speed);
    }
  }

  function aiStep(u, token) {
    const g = UI.game;
    if (!g || g.over || token !== UI.aiToken) return;
    if (g.current !== u || g.actionsLeft <= 0) return;
    const act = WX.AI.choose(g, u);
    let res = WX.AI.apply(g, u, act);
    if (res && res.error) {
      res = g.pass(u);
      if (res && res.error) { console.warn('AI pass failed', res.error); return; }
    }
    sync();
    if (UI.game && UI.game.current === u && UI.game.actionsLeft > 0 && !UI.game.over) {
      setTimeout(() => aiStep(u, token), UI.speed);
    }
  }

  /* ------------------------------ 棋盘 ------------------------------ */
  function buildCells() {
    const board = $('#board');
    board.style.aspectRatio = C.W + ' / ' + C.H;
    const cells = $('#cells');
    cells.innerHTML = '';
    UI.cellEls = [];
    for (let y = 0; y < C.H; y++) {
      for (let x = 0; x < C.W; x++) {
        const d = document.createElement('div');
        d.className = 'cell' + (isShop(x, y) ? ' shop' : '');
        d.style.width = (100 / C.W) + '%';
        d.style.height = (100 / C.H) + '%';
        d.style.left = (x * 100 / C.W) + '%';
        d.style.top = (y * 100 / C.H) + '%';
        d.dataset.x = x; d.dataset.y = y;
        d.addEventListener('click', () => onCellClick(x, y));
        cells.appendChild(d);
        UI.cellEls.push(d);
      }
    }
  }
  function isShop(x, y) { return C.SHOPS.some(s => s.x === x && s.y === y); }

  function onCellClick(x, y) {
    const g = UI.game;
    if (!g || g.over || UI.demo || UI.autoplay || UI.autoBattle || UI.netBusy) return;
    const u = g.current;
    if (!u || !isLocalUnit(u)) return;
    if (UI.targetSkill && UI.targetSkill.kind === 'cell') {
      const s = UI.targetSkill.skill;
      const cells = (s.cells ? s.cells(g, u) : []);
      if (!cells.some(c => c.x === x && c.y === y)) {
        toast('该格不能作为目标');
        return;
      }
      const res = g.useSkill(u, UI.targetSkill.id, null, { x, y });
      runAction(res);
      return;
    }
    if (UI.targetSkill || UI.pending) return;
    if (!UI.moveMode) { toast('先点右侧「移动」按钮，再选择落点'); return; }
    if (isShop(x, y)) {
      toast('商店格不可通行');
      return;
    }
    if (g.unitAt(x, y)) { toast('该格已被占用'); return; }
    const res = UI.freeMoveMode ? g.freeMove(u, x, y) : g.move(u, x, y);
    if (res && res.error) toast(res.error);
    else {
      UI.moveMode = false; UI.freeMoveMode = false; UI.targetSkill = null; UI.pending = null;
    }
    sync();
  }

  function onTokenClick(id) {
    const g = UI.game;
    if (!g) return;
    const u = g.getUnit(id);
    if (!u) return;
    if (UI.demo || UI.autoplay || UI.autoBattle) { showUnit(u); return; }
    if (UI.netBusy) return;
    if (UI.pending) return;
    if (UI.moveMode) { toast('移动模式：请点击棋盘空格（Esc 取消）'); return; }
    if (UI.targetSkill) {
      const list = currentTargets();
      if (!list.includes(u)) { toast('该目标不在可选范围内'); return; }
      UI.pending = Object.assign({}, UI.targetSkill, { targetId: id });
      UI.mode = 'confirm';
      sync();
      return;
    }
    const cur = g.current;
    if (cur && isLocalUnit(cur) && !g.over && !isLocalTeam(u.team)) {
      const why = basicBlockReason(cur, u);
      if (!why) {
        UI.pending = { kind: 'basic', targetId: id };
        UI.mode = 'confirm';
        sync();
        return;
      }
      toast(why);
      showUnit(u);
      return;
    }
    showUnit(u);
  }

  function basicBlockReason(u, t) {
    if (!u || u.downed) return '倒地中，无法攻击';
    if (u.frozen) return '冰冻中，无法攻击';
    if (u.pendingShot) return '请先结算上一发射击';
    if (!t || t.dead || t.removed) return '目标已不在场';
    if (UI.game && UI.game.isCarriedProtected(t)) return '被守护，无法造成伤害';
    if (!!u.inDungeon !== !!t.inDungeon) return '地牢内外无法互相攻击';
    if (t.stealth > 0) return '目标隐身，无法选中';
    const d = Math.max(Math.abs(u.x - t.x), Math.abs(u.y - t.y));
